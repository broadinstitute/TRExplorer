    // The background color and label of a standard deviation cell, by its rank percentile among loci with the same motif
    const STDEV_RANK_PERCENTILE_TIERS = [
        {minPercentile: 0.999, color: '#ff9999', label: 'top 0.1%'},
        {minPercentile: 0.99, color: '#ffcccc', label: 'top 1%'},
        {minPercentile: 0.95, color: '#ffe8cc', label: 'top 5%'},
        {minPercentile: 0.9, color: '#ffffcc', label: 'top 10%'},
    ]
    const findStdevRankPercentileTier = (rankPercentile) =>
        rankPercentile == null ? undefined : STDEV_RANK_PERCENTILE_TIERS.find(tier => rankPercentile >= tier.minPercentile)

    for (const columnName of ['HPRC256_Stdev', 'HPRC256TotalLength_Stdev', 'AoU1027_Stdev', 'TenK10K_Stdev']) {
        const isLps = columnName === 'HPRC256_Stdev' || columnName === 'AoU1027_Stdev'
        const alleleLengthDescription = isLps
            ? 'the longest pure segment (LPS) of each allele'
            : (columnName === 'HPRC256TotalLength_Stdev'
                ? 'the total length of each allele (of the whole variation cluster for a locus in one)'
                : 'the ExpansionHunter repeat count of each allele')
        TABLE_COLUMNS[columnName] = {
            displayName: `σ<sub>${STDEV_SIGMA_SUBSCRIPTS[columnName]}</sub>`,
            helpText: STDEV_HELP_TEXTS[columnName],
            getCellStyle: (row) => {
                const rankPercentile = row[`${columnName}RankPercentile`]
                const total = row[`${columnName}RankTotalNumberByMotif`]
                const stdev = row[columnName]
                if (rankPercentile == null || total == null || total <= 1) return ''
                if (stdev == null || stdev < 0.2) return ''
                const tier = findStdevRankPercentileTier(rankPercentile)
                return tier ? ` background-color: ${tier.color};` : ''
            },
            getValue: (row) => {
                if (row[columnName] != null) {
                    let tag = ''
                    if (row[`${columnName}RankByMotif`] != null && row[`${columnName}RankTotalNumberByMotif`] != null) {
                        const rank = row[`${columnName}RankByMotif`]
                        const total = row[`${columnName}RankTotalNumberByMotif`]
                        const rankPercentile = row[`${columnName}RankPercentile`]
                        const tier = findStdevRankPercentileTier(rankPercentile)
                        const tagText = total == 1 ? ' (only)' : ` (${tier ? tier.label : 'rank'})`

                        const stdevHelp = `The standard deviation of allele lengths (in repeat units) observed at this locus in the ${STDEV_SIGMA_SUBSCRIPTS[columnName]} dataset, computed using ${alleleLengthDescription}.`
                        const rankHelp = `Rank of the standard deviation at this locus among all loci with the same motif in the ${STDEV_SIGMA_SUBSCRIPTS[columnName]} dataset. Rank 1 = highest standard deviation (most polymorphic).`
                        const percentileHelp = `Percentile rank within all loci having the same motif in the ${STDEV_SIGMA_SUBSCRIPTS[columnName]} dataset. Higher = more polymorphic (1.00 means the standard deviation of the allele frequency histogram at this locus is the highest among loci with this motif).`
                        tag = ` &nbsp; <span class="show-popup action-link" data-html="`
                        tag += `<div style=&quot;min-width:250px&quot;><b>Standard Deviation:</b> ${row[columnName].toFixed(2)} <i class='question circle outline icon link nested-help-icon' style='margin-left: 10px;' data-html='${stdevHelp}'></i><br /><br />`
                        tag += `<b>Rank:</b> ${rank?.toLocaleString()} out of ${total.toLocaleString()} `
                        tag += `analyzed loci with this motif <i class='question circle outline icon link nested-help-icon' style='margin-left: 10px;' data-html='${rankHelp}'></i><br /><br />`
                        tag += `<b>Percentile:</b> ${rankPercentile != null ? rankPercentile.toFixed(2) : 'n/a'} <i class='question circle outline icon link nested-help-icon' style='margin-left: 10px;' data-html='${percentileHelp}'></i><br /><br />`
                        tag += `<i>NOTE:</i> The rank indicates how variable the allele lengths are within the ${STDEV_SIGMA_SUBSCRIPTS[columnName]} dataset - at this locus compared to other loci with the same motif.`
                        if (isLps) {
                            tag += ` When calculated using the longest pure segment (LPS), as it was here, this ranking strongly separates disease-associated TR loci from other TRs (see [<a href=&quot;${DANZI_2025_PAPER_URL}&quot; target=_blank>Danzi et al. 2025</a>])`
                        }
                        tag += `</div>`
                        tag += `">`
                        tag += `${tagText}</span>`
                    }
                    return `${grayIfZero(row[columnName], row[columnName].toFixed(2))}${tag}`
                } else {
                    return ''
                }
            },
            // Sort by the within-motif rank (rank 1 = most polymorphic for that motif), ASC so the
            // most polymorphic loci surface first and σ=0 / not-genotyped loci sink to the bottom.
            // Every motif has a rank-1 locus, so rank ties are common across motifs; break them first by
            // the number of same-motif loci, then by the σ value. "INVERSE" = opposite of the header
            // direction, so the default ASC view resolves to DESC (largest motif groups first, then
            // highest σ) and the whole list reverses cleanly when the sort direction is toggled.
            defaultSortDirection: 'ASC',
            getSortColumns: () => [`${columnName}RankByMotif`, `${columnName}RankTotalNumberByMotif INVERSE`, `${columnName} INVERSE`],
            getRequiredColumns: () => [columnName, `${columnName}RankByMotif`, `${columnName}RankTotalNumberByMotif`, `${columnName}RankPercentile`]
        }
    }

    for (const columnName of ['StdevFromIllumina174k', 'StdevFromT2TAssemblies']) {
        TABLE_COLUMNS[columnName] = {
            displayName: `σ<sub>${STDEV_SIGMA_SUBSCRIPTS[columnName]}</sub>`,
            helpText: STDEV_HELP_TEXTS[columnName],
            getValue: (row) => row[columnName] != null ? grayIfZero(row[columnName], row[columnName]) : '',
            defaultSortDirection: 'DESC',
            getSortColumns: () => [columnName],
            getRequiredColumns: () => [columnName]
        }
    }

    // ----- HPRC256 decomposed-allele rendering -----

    // State of the allele sequences section. renderDecomposedAllelesSection resets it for each locus.
    const DECOMPOSED_ALLELES_STATE = {
        alleles: [],            // parsed { seq, count, isRef, skipReason, motifUnits } records
        totalCalledHaplotypes: 0,
        visibleCount: 0,
        observer: null,         // IntersectionObserver instance (recreated per fetch)
        sortColumn: null,       // null = default order (input order = by count desc)
        sortDirection: null,    // 'ASC' | 'DESC' | null
        sequenceMode: 'boxes',  // 'boxes' | 'dotted' | 'collapsed'
    }

    const DECOMPOSED_ALLELES_PAGE_SIZE = 100
    const MAX_BOXES_PER_ALLELE = 500  // hard cap on visible blocks per allele, applied only in 'collapsed' mode

    // Canonical-motif equivalence. Two motifs share a canonical form iff one can be
    // turned into the other by some cyclic shift and/or reverse complement. The
    // canonical form is the lex-smallest string among all rotations of the motif and
    // all rotations of its reverse complement — so `AAG`, `AGA`, `GAA`, `TTC`, `TCT`,
    // `CTT` all canonicalize to `AAG`. Used both by the index page's motif search
    // (CanonicalMotif column) and the locus page's allele-color assignment.
    const COMPLEMENT = {
        A: 'T', T: 'A', C: 'G', G: 'C',
        R: 'Y', Y: 'R', M: 'K', K: 'M',
        B: 'V', V: 'B', D: 'H', H: 'D',
        N: 'N',
    }
    const reverseComplement = (m) =>
        m.toUpperCase().split('').map(b => COMPLEMENT[b] || b).reverse().join('')

    const canonicalMotif = (m) => {
        m = m.toUpperCase()
        const rotations = []
        for (let i = 0; i < m.length; i++) {
            rotations.push(m.slice(i) + m.slice(0, i))
        }
        const allVariants = [...rotations, ...rotations.map(reverseComplement)]
        return allVariants.sort()[0]
    }

    // Column definitions for the HPRC256 allele table. Each column has a sort key and a
    // default sort direction (clicked-from-default applies this direction first).
    // Numeric columns have fixed widths so re-sorting (which changes value lengths)
    // doesn't reshuffle the table layout. The Sequence column has no width and absorbs
    // the remaining horizontal space.
    const ALLELE_TABLE_COLUMNS = {
        sequence: { displayName: 'Allele Sequence', defaultSortDirection: 'ASC',
                    width: null,
                    getSortKey: a => a.motifUnits.join(',') },
        size:     { displayName: 'Length', defaultSortDirection: 'DESC',
                    width: '80px',
                    getSortKey: a => a.skipReason === 'spanning_del' ? -1 : a.seq.length },
        repeats:  { displayName: 'TRViz\nrepeats', defaultSortDirection: 'DESC',
                    width: '90px',
                    getSortKey: a => a.motifUnits.length },
        fraction: { displayName: 'Fraction of\nHaplotypes', defaultSortDirection: 'DESC',
                    width: '110px',
                    getSortKey: a => a.count },
        percent:  { displayName: 'Percent', defaultSortDirection: 'DESC',
                    width: '90px',
                    getSortKey: a => a.count },
    }

    // Stable sort: returns a new array; null sortColumn/Direction means default order.
    const sortAlleles = (alleles, sortColumn, sortDirection) => {
        if (!sortColumn || !sortDirection) return alleles.slice()
        const col = ALLELE_TABLE_COLUMNS[sortColumn]
        if (!col) return alleles.slice()
        const dir = sortDirection === 'ASC' ? 1 : -1
        return alleles
            .map((a, i) => ({ a, k: col.getSortKey(a), i }))
            .sort((x, y) => (x.k < y.k ? -dir : x.k > y.k ? dir : x.i - y.i))
            .map(o => o.a)
    }

    // Fetch every stratified-LPS row for a given LocusId, ordered narrowest-interval
    // first. Used by the locus page summary stats table to render one HPRC256 row
    // per (LocusId, Interval) pair. The full rows (per-stratum + summary stats) are
    // also cached for the LPS allele and genotype charts, so switching the interval
    // doesn't query them again.
    const fetchAllHprc256IntervalRows = async (locusId) => {
        if (!locusId) return []
        const sql = `
            SELECT * FROM ${HPRC256_LPS_STRATIFIED_COMPLETE_TABLE_ID}
            WHERE LocusId = '${escapeTextForSqlStringLiteral(locusId)}'`
        try {
            const result = await queryBigQuery(sql, 0, 256, null, null)
            const rows = result?.rows || []
            if (window.searchResults) {
                for (const row of rows) {
                    window.searchResults[buildHprc256StratifiedRowCacheKey(HPRC256_STRATIFIED_CHARTS.allele, locusId, row['Interval'])] = row
                }
            }
            const intervalSpan = (iv) => {
                const span = iv ? computeIntervalSize(iv) : NaN
                return Number.isFinite(span) ? span : Infinity
            }
            return rows.slice().sort((a, b) => {
                const da = intervalSpan(a['Interval'])
                const db = intervalSpan(b['Interval'])
                if (da !== db) return da - db
                return (a['Interval'] || '').localeCompare(b['Interval'] || '')
            })
        } catch (e) {
            console.warn('All-intervals stratified fetch failed:', e)
            return []
        }
    }

    // Query the distinct TRGT intervals that genotyped a given LocusId, ordered
    // narrowest-first (smallest vcf_end_1based - vcf_start_0based span). Used to
    // populate the interval selector on the locus page so the user can switch
    // between e.g. the standalone-TR genotyping and the variation-cluster
    // genotyping of the same locus.
    const fetchHprc256Intervals = async (chromIndex, locusId) => {
        if (chromIndex == null || !locusId) return []
        // `interval` is a reserved word in BigQuery SQL (INTERVAL <n> <part>
        // literal), so the column reference must be backtick-quoted in every
        // SELECT / WHERE / ORDER BY context.
        const sql = `
            SELECT DISTINCT \`interval\`, vc, vcf_start_0based, vcf_end_1based
            FROM ${HPRC256_DECOMPOSED_ALLELES_TABLE_ID}
            WHERE chrom_index = ${chromIndex}
              AND locus_id = '${locusId}'
            ORDER BY (vcf_end_1based - vcf_start_0based) ASC, \`interval\` ASC`
        try {
            const result = await queryBigQuery(sql, 0, 256, null, null)
            return result?.rows || []
        } catch (e) {
            console.warn('Interval list fetch failed:', e)
            return []
        }
    }

    // Loading placeholder for the HPRC256 Allele Sequences section, shown while the
    // (sometimes slow) interval-list / decomposed-alleles BigQuery fetches run.
    const alleleSequencesLoadingHtml = () => `
        <div style="border-top: 1px dashed #ccc; padding: 23px 20px 15px 15px;">
            <h3 style="margin:0 0 12px 0;">HPRC256 Allele Sequences</h3>
            <div class="loading-indicator"><div class="ui small active inline loader"></div><span>Loading allele sequences&hellip;</span></div>
        </div>`

    // Each call of fetchAndRenderDecomposedAlleles gets the next id, and only the latest call updates the section, so a
    // slow response for an interval the user has since switched away from can't replace the current interval's sequences
    let latestDecomposedAllelesRequestId = 0

    const fetchAndRenderDecomposedAlleles = async (chromIndex, locusId, interval) => {
        const requestId = ++latestDecomposedAllelesRequestId
        if (chromIndex == null || !locusId || !interval) {
            // Catalog row missing the join key — render nothing.
            $('#locus-page-allele-sequences').html('')
            return
        }
        // `interval` is a reserved word in BigQuery — backtick-quote the column.
        const sql = `
            SELECT chrom, vcf_start_0based, vcf_end_1based,
                   total_allele_number, total_unique_alleles, allele_data
            FROM ${HPRC256_DECOMPOSED_ALLELES_TABLE_ID}
            WHERE chrom_index = ${chromIndex}
              AND locus_id = '${locusId}'
              AND \`interval\` = '${interval}'
            LIMIT 1`
        try {
            // Show a loading indicator while the (sometimes slow) BigQuery fetch runs.
            $('#locus-page-allele-sequences').html(alleleSequencesLoadingHtml())
            const result = await queryBigQuery(sql, 0, 1, null, null)
            if (requestId !== latestDecomposedAllelesRequestId) return
            const queryRow = result?.rows?.[0]
            if (!queryRow) {
                $('#locus-page-allele-sequences').html('')
                return
            }
            $('#locus-page-allele-sequences').html(renderDecomposedAllelesSection(queryRow))
            rerenderDecomposedAllelesTable()
        } catch (e) {
            // The allele sequences section is optional: on a query error, log it and leave the section empty
            console.warn('Decomposed alleles fetch failed:', e)
            if (requestId === latestDecomposedAllelesRequestId) $('#locus-page-allele-sequences').html('')
        }
    }

    // Parses the `allele_data` STRING column into an array of records.
    // Format: `seq|composition|count|isRef` (4 fields, success) OR
    //         `seq|composition|count|isRef|skipReason` (5 fields, skipped).
    // For non-skipped alleles, `skipReason` is undefined; rendering branches
    // (`=== 'spanning_del'`, falsy check) treat undefined the same as ''.
    const parseAlleleData = (alleleDataStr) => {
        if (!alleleDataStr) return []
        return alleleDataStr.split(';').map(rec => {
            const parts = rec.split('|')
            const compositionCsv = parts[1] || ''
            return {
                seq: parts[0] || '',
                count: parseInt(parts[2] || '0', 10) || 0,
                isRef: parts[3] === '1',
                skipReason: parts[4],
                // "".split(",") returns [""], which would otherwise inject a fake empty motif.
                motifUnits: compositionCsv ? compositionCsv.split(',') : [],
            }
        })
    }

    // Build a motif color map from every allele at the locus (not just the visible
    // page). Each motif-unit occurrence across any allele's composition contributes 1
    // to that motif's count (so e.g. "A,A,A,T,A" adds A+=4, T+=1). Motifs are then
    // ranked by descending count (alphabetical tiebreak). Computing over all alleles
    // keeps the legend and box colors stable across pagination / sort changes.
    //
    // Color assignment is *per canonical class* (rotation + reverse complement):
    // motifs sharing a canonical class share a color. The top
    // MAX_COLORED_CANONICAL_MOTIFS canonical classes (in rank order) get unique
    // palette colors; later classes fall back to OTHER_MOTIFS_COLOR. Every motif
    // belonging to a top class gets its own legend entry; the rest are aggregated
    // under a clickable "Other" entry.
    const buildMotifColorMap = (alleles) => {
        const counts = {}
        alleles.forEach(a => {
            a.motifUnits.forEach(m => {
                counts[m] = (counts[m] || 0) + 1
            })
        })

        // Aggregate per-canonical-class so we can rank classes (not motifs) by total
        // occurrence count and assign one color per top-N class.
        const canonicalCounts = {}
        const canonicalMembers = {}
        Object.entries(counts).forEach(([m, c]) => {
            const canon = canonicalMotif(m)
            canonicalCounts[canon] = (canonicalCounts[canon] || 0) + c
            ;(canonicalMembers[canon] = canonicalMembers[canon] || []).push(m)
        })
        const rankedCanonicals = Object.keys(canonicalCounts).sort(
            (x, y) => canonicalCounts[y] - canonicalCounts[x] || (x < y ? -1 : x > y ? 1 : 0)
        )
        const topCanonicals = rankedCanonicals.slice(0, MAX_COLORED_CANONICAL_MOTIFS)
        const rareCanonicals = rankedCanonicals.slice(MAX_COLORED_CANONICAL_MOTIFS)

        // Each top canonical class claims the next palette color. Rare classes get gray.
        const canonicalColor = {}
        topCanonicals.forEach((canon, i) => {
            canonicalColor[canon] = MOTIF_COLORS[i]  // MAX_COLORED_CANONICAL_MOTIFS is at most MOTIF_COLORS.length
        })
        const colorMap = {}
        Object.keys(counts).forEach(m => {
            colorMap[m] = canonicalColor[canonicalMotif(m)] || OTHER_MOTIFS_COLOR
        })

        // Legend entries: every motif belonging to a top canonical class gets its own
        // entry. Sort by canonical-class rank first, then by motif count desc within a
        // class — so e.g. AAG and AGA appear adjacently in the legend with the same
        // color, with the more frequent of the two listed first.
        const sortMotifsInClass = ms => ms.slice().sort(
            (x, y) => counts[y] - counts[x] || (x < y ? -1 : x > y ? 1 : 0)
        )
        const rankedTop = []
        topCanonicals.forEach(canon => {
            sortMotifsInClass(canonicalMembers[canon]).forEach(m => rankedTop.push(m))
        })
        const rankedRare = []
        rareCanonicals.forEach(canon => {
            sortMotifsInClass(canonicalMembers[canon]).forEach(m => rankedRare.push(m))
        })
        const rareTotal = rankedRare.reduce((acc, m) => acc + counts[m], 0)
        return { colorMap, motifCounts: counts, rankedTop, rankedRare, rareTotal }
    }

    // Collapse consecutive identical motif units into single labeled blocks.
    // Each block: { motif, runLength, mixedMotifs (for windowed merges) }.
    const rleCollapse = (motifUnits) => {
        const blocks = []
        for (const m of motifUnits) {
            if (blocks.length > 0 && blocks[blocks.length - 1].motif === m) {
                blocks[blocks.length - 1].runLength += 1
            } else {
                blocks.push({ motif: m, runLength: 1 })
            }
        }
        return blocks
    }

    // If RLE alone leaves > MAX_BOXES_PER_ALLELE blocks (e.g. alternating motifs),
    // coalesce consecutive blocks into mixed-motif blocks until block count <= cap.
    const coalesceToMixed = (blocks, cap) => {
        if (blocks.length <= cap) return blocks
        const windowSize = Math.ceil(blocks.length / cap)
        const result = []
        for (let i = 0; i < blocks.length; i += windowSize) {
            const chunk = blocks.slice(i, i + windowSize)
            const unique = new Set(chunk.map(b => b.motif))
            if (unique.size === 1 && chunk.length === 1) {
                result.push(chunk[0])
            } else {
                const totalRun = chunk.reduce((a, b) => a + b.runLength, 0)
                const mixedList = Array.from(unique)
                result.push({
                    motif: null,
                    mixedMotifs: mixedList,
                    runLength: totalRun,
                    isMixed: true,
                })
            }
        }
        return result
    }

    // Returns an array of render blocks for one allele's composition viz. `mode`
    // is 'boxes' (one box per repeat unit, regardless of allele length) or
    // 'collapsed' (always RLE — every run becomes a labeled block; capped at
    // MAX_BOXES_PER_ALLELE via windowed coalesce for adversarially long alleles).
    const buildAlleleBlocks = (motifUnits, mode) => {
        if (motifUnits.length === 0) return []
        if (mode === 'collapsed') {
            return coalesceToMixed(rleCollapse(motifUnits), MAX_BOXES_PER_ALLELE)
        }
        return motifUnits.map(m => ({ motif: m, runLength: 1 }))
    }

    // Build the HTML for a single composition viz (the row of colored boxes).
    const renderCompositionBoxes = (blocks, colorMap) => {
        const boxParts = blocks.map(b => {
            let color, title, label
            if (b.isMixed) {
                color = OTHER_MOTIFS_COLOR
                title = `~${b.runLength}x mixed (${b.mixedMotifs.join('/')})`
                label = `~${b.runLength}x mixed`
            } else {
                color = colorMap[b.motif] || OTHER_MOTIFS_COLOR
                if (b.runLength === 1) {
                    title = b.motif
                    label = ''
                } else {
                    title = `${b.runLength}x ${b.motif}`
                    label = `${b.runLength}x${b.motif.length <= 6 ? ' ' + b.motif : ''}`
                }
            }
            // Wide block (run > 1) renders inline text; single boxes are 12px wide.
            const isRun = b.runLength > 1 || b.isMixed
            const style = isRun
                ? `display:inline-flex; align-items:center; justify-content:center; min-width:42px; height:24px; padding:0 4px; background:${color}; color:#fff; font-size:11px; font-family:monospace; border-right:1px solid #fff; box-sizing:border-box;`
                : `display:inline-block; width:12px; height:24px; background:${color}; border-right:1px solid #fff; box-sizing:border-box;`
            // The box's tooltip text goes in `data-content`, which the delegated hover handler in ensureMotifBoxTooltip
            // reads from boxes with the `allele-motif-box` class.
            return `<span class="allele-motif-box" style="${style}" data-content="${escapeHtmlText(title)}">${escapeHtmlText(label)}</span>`
        })
        return `<div style="display:flex; flex-wrap:wrap; align-items:stretch; line-height:0;">${boxParts.join('')}</div>`
    }

    // Build the HTML for the Sequence cell. `mode` controls the form:
    //   'boxes'     — one colored box per repeat unit.
    //   'collapsed' — always RLE; every run is a labeled block.
    //   'dotted'    — text form like "CAG&middot;CAG&middot;CAT" (no boxes).
    // Skipped alleles ignore `mode` and show the skip note + raw sequence inline.
    const renderAlleleSequenceCell = (allele, colorMap, mode) => {
        if (allele.skipReason === 'spanning_del') {
            return `<div style="font-style:italic; color:#888;">(spanning deletion)</div>`
        }
        if (allele.skipReason) {
            let note
            if (allele.skipReason === 'too_long') note = '(decomposition skipped: too long)'
            else if (allele.skipReason === 'contains_invalid_bases') note = '(skipped: contains N or other non-ACGT)'
            else note = `(skipped: ${allele.skipReason})`
            return `<div style="font-style:italic; color:#888;">${escapeHtmlText(note)}</div>
                <div style="margin-top:4px; font-family:monospace; font-size:0.85em; overflow-wrap:anywhere; color:#333;">${escapeHtmlText(allele.seq)}</div>`
        }
        if (mode === 'dotted') {
            // Each motif unit is colored by its canonical-class color (same map used for
            // the boxes). The parent div's gray `color` shows through on the &middot;
            // separators between motifs.
            const parts = allele.motifUnits.map(m => {
                const color = colorMap[m] || OTHER_MOTIFS_COLOR
                return `<span style="color:${color}; font-weight:600;">${escapeHtmlText(m)}</span>`
            })
            return `<div style="font-family:monospace; font-size:0.85em; overflow-wrap:anywhere; color:#aaa;">${parts.join('&middot;')}</div>`
        }
        // 'boxes' or 'collapsed' — same renderer, different block-building strategy.
        const blocks = buildAlleleBlocks(allele.motifUnits, mode)
        const blocksHtml = renderCompositionBoxes(blocks, colorMap)
        // Lazy-render: stash the markup in a data attribute and let
        // observeCompositionPlaceholders swap it in when the row scrolls into view.
        return `<div class="allele-composition-placeholder" data-blocks-html="${escapeHtmlText(blocksHtml)}" style="min-height:24px;"></div>`
    }

    // Build the HTML for a single allele <tr> in the table.
    const renderAlleleTableRow = (allele, totalCalled, colorMap, mode) => {
        const freq = totalCalled > 0 ? (100 * allele.count / totalCalled).toFixed(1) : '0.0'
        const lengthBp = allele.skipReason === 'spanning_del' ? 0 : allele.seq.length
        // Reference rows place the orange badge at the right edge of the Sequence cell.
        // `margin-left:auto` pushes the badge to the right within the flex container;
        // `flex-wrap:wrap` lets it drop to its own line when the composition viz wraps.
        const refBadge = allele.isRef
            ? `<span style="display:inline-block; padding:1px 6px; background:rgba(255, 165, 0, 0.7); border:1px solid rgba(255, 165, 0, 1); color:#555; font-size:0.85em; border-radius:3px; white-space:nowrap; margin-left:auto;">reference allele</span>`
            : ''
        const seqCell = renderAlleleSequenceCell(allele, colorMap, mode)
        const cellContent = refBadge
            ? `<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">${seqCell}${refBadge}</div>`
            : seqCell
        const widthFor = key => ALLELE_TABLE_COLUMNS[key].width ? `width:${ALLELE_TABLE_COLUMNS[key].width};` : ''
        return `<tr>
            <td style="padding:8px; vertical-align:top;">${cellContent}</td>
            <td style="padding:8px; vertical-align:top; text-align:right; white-space:nowrap; ${widthFor('size')}">${lengthBp.toLocaleString('en-US')} bp</td>
            <td style="padding:8px; vertical-align:top; text-align:right; white-space:nowrap; ${widthFor('repeats')}">${allele.motifUnits.length}</td>
            <td style="padding:8px; vertical-align:top; text-align:right; white-space:nowrap; color:#666; ${widthFor('fraction')}">${allele.count}/${totalCalled}</td>
            <td style="padding:8px; vertical-align:top; text-align:right; white-space:nowrap; font-weight:600; color:#333; ${widthFor('percent')}">${freq}%</td>
        </tr>`
    }

    // Build the sortable <thead>. The icon reflects the current sort state for the
    // column (neutral / up / down). Click handling is wired in wireDecomposedAllelesHandlers.
    const renderAlleleTableHeader = (sortColumn, sortDirection) => {
        const cells = Object.entries(ALLELE_TABLE_COLUMNS).map(([key, col]) => {
            const isSorted = key === sortColumn && sortDirection != null
            let icon = '<i class="sort icon"></i>'
            if (isSorted) {
                icon = sortDirection === 'ASC' ? '<i class="sort up icon"></i>' : '<i class="sort down icon"></i>'
            }
            const widthStyle = col.width ? `width:${col.width};` : ''
            return `<th class="${isSorted ? 'sorted' : ''} decomposed-alleles-sortable-header"
                        data-column="${key}"
                        style="cursor:pointer; user-select:none; text-align:left; padding:8px; white-space:nowrap; ${widthStyle}">
                ${escapeHtmlText(col.displayName).replace(/\n/g, '<br>')} ${icon}
            </th>`
        }).join('')
        return `<thead><tr>${cells}</tr></thead>`
    }

    // Assemble the full <table> for the currently-visible slice.
    const renderAlleleTable = (visible, totalCalled, colorMap, mode, sortColumn, sortDirection) => {
        const rowsHtml = visible.map(a => renderAlleleTableRow(a, totalCalled, colorMap, mode)).join('')
        return `<table class="ui sortable celled table" style="margin:0;">
            ${renderAlleleTableHeader(sortColumn, sortDirection)}
            <tbody>${rowsHtml}</tbody>
        </table>`
    }

    // Returns the <option> HTML for the HPRC256 interval selector, or null when
    // fewer than 2 intervals exist for this locus. Reads the intervals list from
    // a global set by the locus page after the per-locus interval fetch
    // completes. The caller passes the currently-selected value so that the
    // "above" copies (which drive both charts and decomp) and the decomp-only
    // copy can track independent selections — see the change-handler split in
    // locus_page_template.html.
    const renderHprc256IntervalOptions = (currentValue) => {
        const intervals = window.__HPRC256_INTERVALS || []
        if (intervals.length <= 1) return null
        return intervals.map((iv) =>
            `<option value="${iv['interval']}"${iv['interval'] === currentValue ? ' selected' : ''}>${describeHprc256Interval(iv['interval'], iv['vc'])}</option>`
        ).join('')
    }

    // Dropdown above the table that toggles the sequence-column display mode.
    // When the locus has multiple HPRC256 intervals, the interval selector is
    // rendered on the same row to the LEFT of "Sequence display:". Both pairs
    // use the same bold-label / default-select styling as the Population/Sex
    // row in the polymorphism section so the controls look visually consistent.
    const renderSequenceModeSelector = (mode) => {
        const opts = [
            { value: 'boxes', label: 'Repeat boxes' },
            { value: 'dotted', label: 'Dotted text (e.g. CAG·CAG·CAT)' },
            { value: 'collapsed', label: 'Collapsed boxes (e.g. 5x CAG  1x CAT)' },
        ]
        const optsHtml = opts.map(o =>
            `<option value="${o.value}"${o.value === mode ? ' selected' : ''}>${o.label}</option>`
        ).join('')
        // The decomp section tracks its own interval, independent of the "above"
        // dropdowns in the Population/Sex rows: changes to the decomp dropdown
        // never propagate upward, but changes to any "above" dropdown sync down
        // into this one.
        const decompInterval = window.__HPRC256_DECOMP_INTERVAL || GLOBAL_PAGE_STATE['hprc256_interval']
        const intervalOptions = renderHprc256IntervalOptions(decompInterval)
        const intervalHtml = intervalOptions
            ? `<label style="display: inline-flex; align-items: center;"><b>Genotyped interval:</b>&nbsp;&nbsp;<select class="hprc256-interval-select hprc256-interval-select-decomp">${intervalOptions}</select></label>`
            : ''
        return `<div style="margin-top: 0.5em; margin-bottom: 10px; display: flex; justify-content: flex-start; align-items: center; gap: 1em; flex-wrap: wrap;">
            ${intervalHtml}
            <label style="display: inline-flex; align-items: center;"><b>Sequence display style:</b>&nbsp;&nbsp;<select id="decomposed-alleles-sequence-mode">${optsHtml}</select></label>
        </div>`
    }

    const renderLegend = ({ colorMap, motifCounts, rankedTop, rankedRare, rareTotal }) => {
        const items = rankedTop.map(m => {
            return `<span style="display:inline-flex; align-items:center; margin:0 12px 4px 0;">
                <span style="display:inline-block; width:14px; height:14px; background:${colorMap[m]}; margin-right:5px; border:1px solid #ccc;"></span>
                <span style="font-family:monospace; font-size:0.9em; color:#333;">${escapeHtmlText(m)}</span>
                <span style="color:#888; font-size:0.85em; margin-left:4px;">(${motifCounts[m]})</span>
            </span>`
        })
        if (rankedRare.length > 0) {
            // Single-quoted data-html to allow inline <div> markup without attribute escaping.
            // `break-inside:avoid` keeps each motif on a single column line; the outer
            // CSS-columns + max-height/overflow combo flows long rare lists into a
            // multi-column grid that stays inside the viewport (Semantic UI otherwise
            // errors with "Popup does not fit within the boundaries of the viewport").
            // Size the CSS columns to the longest rare motif so long repeat units
            // can't overflow a too-narrow fixed-width column and overlap the next one.
            // `ch` tracks the monospace glyph width; +8 leaves room for the trailing
            // " (count)". Short-motif loci still flow into many compact columns.
            const rareColCh = rankedRare.reduce((mx, m) => Math.max(mx, m.length), 0) + 8
            const rareHtml = rankedRare
                .map(m => `<div style="font-family:monospace; break-inside:avoid; white-space:nowrap;">${escapeHtmlText(m)} <span style="color:#888;">(${motifCounts[m]})</span></div>`)
                .join('')
            // TSV of EVERY motif at this locus (both the top legend entries and the
            // rare ones in this popup), sorted by count desc then motif asc. Encoded
            // into a data: URI so the link downloads without any event wiring.
            // encodeURIComponent leaves single quotes as they are, so they're encoded too, to keep the link safe inside
            // the single-quoted data-html attribute below.
            // The counts are of occurrences in the distinct allele sequences, not weighted by how many haplotypes have each
            // (see buildMotifColorMap)
            const allMotifsTsv = 'motif\toccurrences_in_distinct_HPRC256_alleles\n' + Object.keys(motifCounts)
                .sort((a, b) => motifCounts[b] - motifCounts[a] || (a < b ? -1 : a > b ? 1 : 0))
                .map(m => `${m}\t${motifCounts[m]}`)
                .join('\n')
            const downloadHref = `data:text/tab-separated-values;charset=utf-8,${encodeURIComponent(allMotifsTsv).replace(/'/g, '%27')}`
            // Height cap + vertical scroll live on the OUTER wrapper; the column
            // layout on the INNER div has no height cap. Putting both on one element
            // makes multicol fill a column to the cap then flow sideways into the next
            // column (horizontal scroll) instead of scrolling down. The Download link
            // sits after the columns (full-width, past a blank-line gap) so it appears
            // at the very bottom of the scroll.
            const popupHtml = `<div style="min-width:240px; max-width:min(90vw, 640px);"><div style="font-size:0.9em; font-weight:700; color:#333; margin-bottom:6px;">Rare motif units</div><div style="max-height:50vh; overflow-y:auto; overflow-x:hidden;"><div style="column-width:${rareColCh}ch; column-gap:18px; font-size:0.9em; line-height:1.5;">${rareHtml}</div><div style="margin-top:1.4em; font-size:0.9em;"><a href="${downloadHref}" download="HPRC256_motif_occurrences_in_distinct_alleles.tsv" style="color:#4183c4; text-decoration:underline;">Download</a></div></div></div>`
            items.push(`<span class="show-popup action-link" data-position="top center" data-html='${popupHtml}'
                style="display:inline-flex; align-items:center; margin:0 12px 4px 0;">
                <span style="display:inline-block; width:14px; height:14px; background:${OTHER_MOTIFS_COLOR}; margin-right:5px; border:1px solid #ccc;"></span>
                <span style="font-size:0.9em; color:#333;">Other</span>
                <span style="color:#888; font-size:0.85em; margin-left:4px;">(${rareTotal})</span>
            </span>`)
        }
        if (items.length === 0) return ''
        return `<div style="display:flex; flex-wrap:wrap; align-items:center;">${items.join('')}</div>`
    }

    // Helpers for getting the currently-visible slice (after sort) and the
    // load-more button HTML.
    const getVisibleAlleles = () => {
        const state = DECOMPOSED_ALLELES_STATE
        const sorted = sortAlleles(state.alleles, state.sortColumn, state.sortDirection)
        return sorted.slice(0, state.visibleCount)
    }
    const renderLoadMoreButton = () => {
        const state = DECOMPOSED_ALLELES_STATE
        if (state.visibleCount >= state.alleles.length) return ''
        return `<div style="text-align:center; margin-top:12px;">
                    <button id="decomposed-alleles-load-more" class="ui small button">
                        Load more (showing ${state.visibleCount} of ${state.alleles.length})
                    </button>
                </div>`
    }

    const renderDecomposedAllelesSection = (queryRow) => {
        const alleles = parseAlleleData(queryRow.allele_data)
        const totalCalled = parseInt(queryRow.total_allele_number, 10) || 0
        const totalUnique = parseInt(queryRow.total_unique_alleles, 10) || alleles.length

        // Reset the allele list and paging for this locus.
        const state = DECOMPOSED_ALLELES_STATE
        state.alleles = alleles
        state.totalCalledHaplotypes = totalCalled
        state.visibleCount = Math.min(DECOMPOSED_ALLELES_PAGE_SIZE, alleles.length)
        // sequenceMode + sort persist across page loads via the URL hash
        // (hprc256dam, hprc256dasc, hprc256dasd). Sort state is validated against
        // ALLELE_TABLE_COLUMNS / 'ASC'|'DESC' to ignore stale or malformed URLs.
        state.sequenceMode = GLOBAL_PAGE_STATE['hprc256_decomposed_alleles_mode']
        const urlSortColumn = GLOBAL_PAGE_STATE['hprc256_decomposed_alleles_sort_column']
        const urlSortDirection = GLOBAL_PAGE_STATE['hprc256_decomposed_alleles_sort_direction']
        const validSort = urlSortColumn in ALLELE_TABLE_COLUMNS
            && (urlSortDirection === 'ASC' || urlSortDirection === 'DESC')
        state.sortColumn = validSort ? urlSortColumn : null
        state.sortDirection = validSort ? urlSortDirection : null

        // Full VCF-record span (shared across all sub-TRIDs of a compound TRGT record).
        // ``vcf_start_0based``/``vcf_end_1based`` come from VCF POS / INFO/END and may
        // extend past this sub-TRID's own coordinates when TRGT clusters adjacent loci.
        const vcfChrom = queryRow.chrom || ''
        const vcfStart = parseInt(queryRow.vcf_start_0based, 10)
        const vcfEnd = parseInt(queryRow.vcf_end_1based, 10)
        let trgtRegionHtml = ''
        if (vcfChrom && Number.isFinite(vcfStart) && Number.isFinite(vcfEnd)) {
            // Shown with its 0-based start, like the catalog's intervals, but IGV reads a locus's start as 1-based
            const locus = `${vcfChrom}:${vcfStart}-${vcfEnd}`
            trgtRegionHtml = `<div style="color:#666; font-size:0.95em; margin-top:4px;">TRGT genotyped interval: <a href="#" class="decomposed-alleles-igv-link" data-locus="${vcfChrom}:${vcfStart + 1}-${vcfEnd}">${locus}</a></div>`
        }

        return `
            <div style="border-top: 1px dashed #ccc; padding: 23px 20px 15px 15px;">
                <div style="margin-bottom:10px;">
                    <h3 style="margin:0;">HPRC256 Allele Sequences</h3>
                    ${trgtRegionHtml}
                    ${renderSequenceModeSelector(state.sequenceMode)}
                    <div style="color:#666; font-size:0.95em; margin-top:2px;">
                        TRGT reported ${totalUnique} unique allele${totalUnique === 1 ? '' : 's'} at this locus; <a href="https://github.com/Jong-hun-Park/trviz" target="_blank">TRViz</a> (<a href="https://doi.org/10.1093/bioadv/vbad058" target="_blank">Park <i>et al.</i> 2023</a>) then decomposed these alleles into the following motifs:
                    </div>
                </div>
                <div id="decomposed-alleles-legend" style="margin-bottom:12px;"></div>
                <div id="decomposed-alleles-table-container"></div>
                <div id="decomposed-alleles-load-more-container"></div>
            </div>`
    }

    // One shared tooltip element + delegated hover handler for the motif boxes.
    // We never call `.popup()` per-box: with thousands of boxes per allele the
    // per-element binding cost is prohibitive. Instead one plain floating div
    // gets repositioned on hover via a single event-delegated handler on document.
    let motifBoxTooltipEl = null
    let motifBoxTooltipBound = false
    const ensureMotifBoxTooltip = () => {
        if (motifBoxTooltipBound) return
        motifBoxTooltipBound = true
        // Plain styled div — not a `.ui.popup`, because that class brings an arrow
        // pseudo-element that renders awkwardly when we position the tooltip ourselves
        // instead of letting Semantic UI's JS handle it.
        motifBoxTooltipEl = $('<div style="position:absolute; display:none; z-index:9999; pointer-events:none; background:#1b1c1d; color:#fff; padding:4px 8px; border-radius:3px; font-size:0.85em; font-family:monospace; box-shadow:0 2px 6px rgba(0,0,0,0.2); white-space:nowrap;"></div>')
            .appendTo('body')
        $(document)
            .on('mouseenter', '.allele-motif-box', function() {
                const content = this.getAttribute('data-content') || ''
                if (!content) return
                motifBoxTooltipEl.text(content).css({ visibility: 'hidden' }).show()
                const trigger = this.getBoundingClientRect()
                const popup = motifBoxTooltipEl[0].getBoundingClientRect()
                motifBoxTooltipEl.css({
                    top: trigger.top + window.scrollY - popup.height - 6,
                    left: trigger.left + window.scrollX + trigger.width / 2 - popup.width / 2,
                    visibility: 'visible',
                })
            })
            .on('mouseleave', '.allele-motif-box', () => motifBoxTooltipEl.hide())
    }

    // Inject composition markup for an allele row when it scrolls into view, then stop
    // observing it. Off-screen alleles never pay DOM cost for the colored boxes.
    const observeCompositionPlaceholders = () => {
        ensureMotifBoxTooltip()
        if (DECOMPOSED_ALLELES_STATE.observer) {
            DECOMPOSED_ALLELES_STATE.observer.disconnect()
        }
        const injectCompositionBoxes = (placeholderEl) => {
            const html = placeholderEl.getAttribute('data-blocks-html') || ''
            placeholderEl.classList.remove('allele-composition-placeholder')
            placeholderEl.innerHTML = html
            placeholderEl.removeAttribute('data-blocks-html')
        }
        if (typeof IntersectionObserver === 'undefined') {
            document.querySelectorAll('.allele-composition-placeholder').forEach(injectCompositionBoxes)
            return
        }
        DECOMPOSED_ALLELES_STATE.observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return
                injectCompositionBoxes(entry.target)
                observer.unobserve(entry.target)
            })
        }, { rootMargin: '200px 0px' })
        document.querySelectorAll('.allele-composition-placeholder').forEach(el => {
            DECOMPOSED_ALLELES_STATE.observer.observe(el)
        })
    }

    // Attaches a fresh Semantic UI popup to the legend's "Other" entry, if any.
    // Called after every legend (re-)render — the previous popup instance is
    // discarded with the old DOM, so no teardown is needed.
    const initLegendPopup = () => {
        $('#decomposed-alleles-legend .show-popup').popup({ on: 'click', hoverable: true })
    }

    // Render the table body + legend + load-more button using the current state, and set up their handlers.
    // Called after renderDecomposedAllelesSection's section is inserted, and after any state change (sort,
    // load-more, sequence-mode change).
    const rerenderDecomposedAllelesTable = () => {
        const state = DECOMPOSED_ALLELES_STATE
        // Legend tally and color map are computed over all alleles (not the visible
        // slice) so they stay stable as the user paginates or re-sorts.
        const colorInfo = buildMotifColorMap(state.alleles)
        const visible = getVisibleAlleles()
        const tableHtml = renderAlleleTable(
            visible, state.totalCalledHaplotypes, colorInfo.colorMap, state.sequenceMode,
            state.sortColumn, state.sortDirection,
        )
        $('#decomposed-alleles-table-container').html(tableHtml)
        $('#decomposed-alleles-legend').html(renderLegend(colorInfo))
        $('#decomposed-alleles-load-more-container').html(renderLoadMoreButton())
        initLegendPopup()
        wireDecomposedAllelesHandlers()
        observeCompositionPlaceholders()
    }

    // Cycle sort state for the clicked column (see getSortAfterColumnHeaderClick)
    const cycleSortForColumn = (column) => {
        const state = DECOMPOSED_ALLELES_STATE
        const nextSort = getSortAfterColumnHeaderClick(
            state.sortColumn, state.sortDirection, column, ALLELE_TABLE_COLUMNS[column]?.defaultSortDirection || 'ASC')
        state.sortColumn = nextSort.column
        state.sortDirection = nextSort.direction
        // Sorting reshuffles rows — reset paging to the first page.
        state.visibleCount = Math.min(DECOMPOSED_ALLELES_PAGE_SIZE, state.alleles.length)
        // Persist the new sort state in the URL hash.
        GLOBAL_PAGE_STATE['hprc256_decomposed_alleles_sort_column'] = state.sortColumn || ''
        GLOBAL_PAGE_STATE['hprc256_decomposed_alleles_sort_direction'] = state.sortDirection || ''
        writePersistentPageStateToUrl()
    }

    // Wire all click/change handlers on the section. Idempotent — uses `.off()` first
    // so re-rendering doesn't double-bind.
    const wireDecomposedAllelesHandlers = () => {
        $('#decomposed-alleles-load-more').off('click').on('click', () => {
            const state = DECOMPOSED_ALLELES_STATE
            state.visibleCount = Math.min(state.visibleCount + DECOMPOSED_ALLELES_PAGE_SIZE, state.alleles.length)
            rerenderDecomposedAllelesTable()
        })
        $('.decomposed-alleles-sortable-header').off('click').on('click', function() {
            cycleSortForColumn($(this).data('column'))
            rerenderDecomposedAllelesTable()
        })
        $('#decomposed-alleles-sequence-mode').off('change').on('change', function() {
            const newMode = $(this).val()
            DECOMPOSED_ALLELES_STATE.sequenceMode = newMode
            GLOBAL_PAGE_STATE['hprc256_decomposed_alleles_mode'] = newMode
            writePersistentPageStateToUrl()
            rerenderDecomposedAllelesTable()
        })
        // Opens IGV at the TRGT-genotyped reference region for this VCF record.
        $('.decomposed-alleles-igv-link').off('click').on('click', function(e) {
            e.preventDefault()
            showIgvAt($(this).data('locus'))
        })
    }

</script>
</head>
