            probands and 286 of their unaffected siblings, and 767 individuals with schizophrenia.</span><br /><br />
            <b>LIMITATIONS:</b> A DMR is usually several hundred bp long, so its methylation change may not involve this TR.
            It may instead come from a nearby sequence variant, or arise by chance. Expansions of CG-rich TRs are one known
            cause of hypermethylation, as at FMR1.`
        html += `<div style="font-size: 0.9em; color: #666; margin-top: 8px;">
            Source: <a href="${GARG_2019_PAPER_URL}" target="_blank">Garg et al. 2019</a> (Human Mutation), Supplementary
            Table ${isAutism ? 1 : 2}
        </div>`

        return html
    }

    // The Garg 2020 details shown in the Garg 2020 DMRs column's popup and on the locus page
    function buildGarg2020DmrDetailsHtml(row) {
        let html = ''
        for (const dmr of parseJsonColumn(row, 'Garg2020_DMRDetails', '[]') || []) {
            html += `Of the 23,116 people whose DNA methylation in blood was surveyed by Garg et al. 2020,
                <b>${formatCount(dmr.numIndividualsWithDMR, 'person', 'people')}</b> had a rare <b>${dmr.methylationChange}</b>
                DMR (differentially methylated region), a frequency of ${dmr.frequencyPer10000} per 10,000 (95% confidence interval). The authors predicted the
                TR in the paper to be unstable, since it is CG-rich and highly polymorphic
                (${dmr.numTRAllelesIn600Genomes} different alleles in 600 genomes), so the hypermethylation is likely
                caused by an expansion.<br /><br />
                <b>TR in the paper:</b> ${describeHg38Interval(dmr.trHg38)}<br />
                <b>DMR:</b> ${describeHg38Interval(dmr.dmrHg38)}<br />
                <b>Genes:</b> ${describeGargDmrGenes(dmr)}<br />
                <b>Gene region:</b> ${dmr.geneRegion}<br />
                ${dmr.fragileSite ? `<b>Fragile site:</b> ${dmr.fragileSite} (${dmr.fragileSiteStatus === 'previously defined'
                    ? 'previously defined: already known to be caused by an expansion of the TR in the paper'
                    : 'putative novel: the authors propose that an expansion of the TR in the paper causes it'})<br />` : ''}
                ${dmr.validation ? `<b>Validation or reference:</b> ${dmr.validation}<br />` : ''}
                <br />`
        }
        // "CG in the motif" is intended wording; see the comment in buildGarg2019DmrDetailsHtml
        html += `<span style="color: #666;">${GARG_DMR_DEFINITION} Only TRs whose repeat contains CpG sites (CG in the motif)
            are matched.</span>`
        html += `<div style="font-size: 0.9em; color: #666; margin-top: 8px;">
            Source: <a href="${GARG_2020_PAPER_URL}" target="_blank">Garg et al. 2020</a> (American Journal of Human
            Genetics), Table S15
        </div>`

        return html
    }

    // A Garg DMR column's value, which opens a popup with the DMR details when clicked
    function buildGargDmrCellValue(displayText, popupTitle, detailsHtml) {
        return buildCellValueWithPopup(`<span class="action-link">${displayText}</span>`,
            `<div style="margin-bottom: 0.5em;"><b>${popupTitle}</b></div>${detailsHtml}`, 'dmr-details-popup')
    }

    // The Garg 2019 Autism DMRs or Garg 2019 Schizophrenia DMRs column's value, eg. 'Hypermethylated (1 proband)'.
    // cohort is 'autism' or 'schizophrenia'.
    function buildGarg2019DmrColumnValue(row, cohort) {
        const methylationChange = row[GARG_2019_COLUMNS_BY_COHORT[cohort].methylationChange]
        if (!methylationChange) return ''
        const dmrs = parseJsonColumn(row, GARG_2019_COLUMNS_BY_COHORT[cohort].details, '[]') || []
        const carriers = cohort === 'autism'
            ? formatCount(dmrs.reduce((total, dmr) => total + dmr.numProbandsWithDMR, 0), 'proband', 'probands')
            : formatCount(dmrs.reduce((total, dmr) => total + dmr.numIndividualsWithDMR, 0), 'individual', 'individuals')
        const methylationChangeText = methylationChange.split(',').join(', ')
        return buildGargDmrCellValue(
            `${methylationChangeText.charAt(0).toUpperCase()}${methylationChangeText.slice(1)} (${carriers})`,
            `Rare DMR in ${cohort} (Garg et al. 2019)`,
            buildGarg2019DmrDetailsHtml(row, cohort))
    }

    // How the Miga lab's CenSat annotation workflow (https://github.com/kmiga/alphaAnnotation) found each kind of region
    const ALPHA_SATELLITE_ANNOTATION_METHOD = `Alpha satellite was annotated with <a href="https://github.com/fedorrik/HumAS-HMMER_for_AnVIL" target="_blank">HumAS-HMMER</a>
        (Fedor Ryabov), and the results were sorted into active HOR, inactive HOR, diverged HOR, monomeric and mixed alpha satellite.`
    const HSAT2_AND_HSAT3_ANNOTATION_METHOD = `HSat2 and HSat3 were annotated with Nicolas Altemose's
        <a href="https://github.com/altemose/chm13_hsat" target="_blank">HSat2/HSat3 annotation script</a>.`
    const describeRepeatMaskerAnnotationMethod = (repeatFamilies) => `Annotated by RepeatMasker as the ${repeatFamilies}.`

    // The classes of the CentromereAndSatelliteRegion column: what each abbreviation stands for, a definition, and how it
    // was annotated. Shown in the column's popup.
    const CENTROMERE_AND_SATELLITE_REGION_CLASSES = {
        active_hor: {
            name: 'Active alpha satellite higher-order repeat (HOR) array',
            definition: `The alpha satellite array where the centromere forms. Alpha satellite is built from ~171 bp
                repeat units, and in a higher-order repeat (HOR) array a block of several of these units repeats as one
                unit. Each chromosome has one active array.`,
            annotationMethod: ALPHA_SATELLITE_ANNOTATION_METHOD,
            hg38Note: `In hg38, the centromeres are synthetic models of the alpha satellite arrays rather than assembled
                sequence (98% of hg38's active_hor regions lie in these models), so TR loci here are in modeled sequence.`,
        },
        hor: {
            name: 'Inactive alpha satellite higher-order repeat (HOR) array',
            definition: `An alpha satellite HOR array other than the one where the centromere forms.`,
            annotationMethod: ALPHA_SATELLITE_ANNOTATION_METHOD,
        },
        dhor: {
            name: 'Diverged alpha satellite higher-order repeat (HOR) array',
            definition: `An alpha satellite array whose higher-order repeat units have diverged substantially from each other.`,
            annotationMethod: ALPHA_SATELLITE_ANNOTATION_METHOD,
        },
        mon: {
            name: 'Monomeric alpha satellite',
            definition: `Alpha satellite whose ~171 bp repeat units are not organized into higher-order repeats.`,
            annotationMethod: ALPHA_SATELLITE_ANNOTATION_METHOD,
        },
        mixedAlpha: {
            name: 'Mixed alpha satellite',
            definition: `Alpha satellite that could not be sorted into the active HOR, inactive HOR, diverged HOR or
                monomeric classes.`,
            annotationMethod: ALPHA_SATELLITE_ANNOTATION_METHOD,
        },
        HSat1A: {
            name: 'Human satellite 1A (HSat1A) array',
            definition: `An array of classical human satellite 1A (formerly called SAR), a 42 bp repeat that makes up some
                of the most AT-rich regions of the genome.`,
            annotationMethod: describeRepeatMaskerAnnotationMethod('Dfam family SAR'),
        },
        HSat1B: {
            name: 'Human satellite 1B (HSat1B) array',
            definition: `An array of classical human satellite 1B (formerly called HSATI), one of the most AT-rich
                satellites, found mostly on chromosome Y.`,
            annotationMethod: describeRepeatMaskerAnnotationMethod('Dfam family HSAT1'),
        },
        HSat2: {
            name: 'Human satellite 2 (HSat2) array',
            definition: `An array of classical human satellite 2. HSat2 and HSat3 are both derived from the simple repeat
                (CATTC)n, and form some of the largest satellite arrays in the human genome.`,
            annotationMethod: HSAT2_AND_HSAT3_ANNOTATION_METHOD,
        },
        HSat3: {
            name: 'Human satellite 3 (HSat3) array',
            definition: `An array of classical human satellite 3. HSat2 and HSat3 are both derived from the simple repeat
                (CATTC)n, and form some of the largest satellite arrays in the human genome.`,
            annotationMethod: HSAT2_AND_HSAT3_ANNOTATION_METHOD,
        },
        HSat2_3: {
            name: 'Human satellite 2 or 3 array',
            definition: `A human satellite array that could not be resolved as either HSat2 or HSat3, because the HSat2 and
                HSat3 annotations overlap here.`,
            annotationMethod: HSAT2_AND_HSAT3_ANNOTATION_METHOD,
        },
        'GAP,HSat2': {
            name: 'Human satellite 2 (HSat2) array next to an assembly gap',
            definition: `An HSat2 array that ends at a gap in the reference genome, where the rest of the array is missing
                from the assembly.`,
            annotationMethod: `${HSAT2_AND_HSAT3_ANNOTATION_METHOD} The workflow extends HSat2 and HSat3 annotations up to
                any adjacent assembly gap, so the region is labeled with both.`,
        },
        'GAP,HSat3': {
            name: 'Human satellite 3 (HSat3) array next to an assembly gap',
            definition: `An HSat3 array that ends at a gap in the reference genome, where the rest of the array is missing
                from the assembly.`,
            annotationMethod: `${HSAT2_AND_HSAT3_ANNOTATION_METHOD} The workflow extends HSat2 and HSat3 annotations up to
                any adjacent assembly gap, so the region is labeled with both.`,
        },
        bSat: {
            name: 'Beta satellite (bSat) array',
            definition: `An array of beta satellite, which is more GC-rich than alpha satellite and densely CpG methylated.`,
            annotationMethod: describeRepeatMaskerAnnotationMethod('Dfam families BSR, LSAU and BSAT'),
        },
        gSat: {
            name: 'Gamma satellite (gSat) array',
            definition: `An array of gamma satellite, which is more GC-rich than alpha satellite and densely CpG methylated.`,
            annotationMethod: describeRepeatMaskerAnnotationMethod('Dfam families GSAT and TAR1'),
        },
        cenSat: {
            name: 'Other centromeric satellite',
            definition: `An array of a centromeric satellite other than alpha, beta, gamma and the classical human satellites.`,
            annotationMethod: describeRepeatMaskerAnnotationMethod('Dfam families CER, SATR, SST1, ACRO, HSAT4, HSAT5 or TAF11'),
        },
        rDNA: {
            name: 'Ribosomal DNA (rDNA) array',
            definition: `An array of tandem copies of the ~45 kb ribosomal RNA gene unit, found on the short arms of the
                acrocentric chromosomes.`,
            annotationMethod: `Annotated with an HMM built from the beginning and end of the rDNA repeat unit.`,
        },
        ct: {
            name: 'Centromeric transition region',
            definition: `Sequence between the satellite arrays of a centromere that is not itself a satellite array. These
                regions are largely long segmental duplications, and can include expressed genes.`,
            annotationMethod: `The workflow merges all satellite annotations within 2 Mb of each other, takes the merged region
                that contains the active alpha satellite array as the centromere, and labels each stretch inside it that
                isn't part of a satellite array as ct.`,
        },
    }

    // The details shown in the popup of the CentromereAndSatelliteRegion column, for a locus with a value
    function buildCentromereAndSatelliteRegionDetailsHtml(row) {
        const regionClass = row['CentromereAndSatelliteRegion']
        const classInfo = CENTROMERE_AND_SATELLITE_REGION_CLASSES[regionClass]
        let html = `<div style="margin-bottom: 0.5em;"><b>${regionClass}</b>${classInfo ? `: ${classInfo.name}` : ''}</div>`
        if (classInfo) {
            html += `<div style="margin-bottom: 0.5em;">${classInfo.definition}</div>`
            html += `<div style="margin-bottom: 0.5em;"><b>How it was annotated:</b> ${classInfo.annotationMethod}</div>`
            if (classInfo.hg38Note) {
                html += `<div style="margin-bottom: 0.5em;"><b>NOTE:</b> ${classInfo.hg38Note}</div>`
            }
        }
        html += `<div style="margin-bottom: 0.5em;">This TR locus overlaps a region of this class. A locus that overlaps
            regions of more than one class is labeled with the class of the region it overlaps the most.</div>`
        html += `<div style="font-size: 0.9em; color: #666; margin-top: 8px;">
            Source: the Miga lab's centromeric satellite (CenSat) annotation (hg38.cenSatv1.0 for hg38,
            chm13v2.0.cenSatv2.1 for CHM13) from <a href="https://github.com/hloucks/CenSatData" target="_blank">CenSatData</a>,
            made with their <a href="https://github.com/kmiga/alphaAnnotation" target="_blank">CenSat annotation workflow</a>.
            Class definitions are based on <a href="https://doi.org/10.1126/science.abl4178" target="_blank">Altemose et al. 2022</a>.
        </div>`

        return html
    }

    // Splits a SpliceAI_DeltaScoreByRepeatCountThatAffectsSplicing value such as "22:0.273AG,32:0.329AG" into
    // [{repeatCount: 22, deltaScore: 0.273, changeType: 'AG'}, ...], in the value's order (by repeat count)
    function parseSpliceAIDeltaScoresByRepeatCount(value) {
        return (value || '').split(',').filter(Boolean).map(entry => {
            const [repeatCount, scoreAndChangeType] = entry.split(':')
            const [, deltaScore, changeType] = scoreAndChangeType.match(/^([0-9.]+)([A-Z]*)$/)
            return {repeatCount: parseInt(repeatCount), deltaScore: parseFloat(deltaScore), changeType}
        })
    }

    // Splits a SpliceAI_AlleleSizesByRepeatCount value such as "18:2.5pct,25:97.5pct/99.5pct" into a Map from repeat
    // count to the simulated sizes that allele stands for: {18 => ['2.5pct'], 25 => ['97.5pct', '99.5pct']}
    function parseSpliceAIAlleleSizesByRepeatCount(value) {
        return new Map((value || '').split(',').filter(Boolean).map(entry => {
            const [repeatCount, alleleSizes] = entry.split(':')
            return [parseInt(repeatCount), alleleSizes.split('/')]
        }))
    }

    // The most common unitLength-long unit read in frame from the start of the tract, ties going to the one seen
    // first, as most_common_in_frame_unit() in ../data-prep/splicing_prediction/make_tr_expansion_benchmark_alleles.py
    function mostCommonInFrameUnit(tract, unitLength) {
        const counts = new Map()
        for (let i = 0; i + unitLength <= tract.length; i += unitLength) {
            const unit = tract.slice(i, i + unitLength)
            counts.set(unit, (counts.get(unit) || 0) + 1)
        }
        let mostCommonUnit = null
        let mostCommonUnitCount = 0
        for (const [unit, count] of counts) {   // a Map iterates in insertion order, so the first seen wins ties
            if (count > mostCommonUnitCount) {
                mostCommonUnit = unit
                mostCommonUnitCount = count
            }
        }
        return mostCommonUnit
    }

    // Returns the chrom-pos-ref-alt variant that the SpliceAI full run scored for the simulated allele with
    // repeatCount repeats, built the way allele_to_variant() in make_tr_expansion_benchmark_alleles.py builds it:
    // anchored on the base before the tract, an expansion inserts copies of the tract's most common in-frame unit and
    // a contraction deletes the tract's first whole units. Returns null if the row lacks the reference sequences
    // (the results query leaves out ReferenceRepeatSequence for loci over 10kb).
    function getSpliceAISimulatedAlleleVariant(row, repeatCount) {
        const { chrom, start_0based, motif } = parseAndNormalizeLocusId(row['LocusId'])
        const tract = (row['ReferenceRepeatSequence'] || '').toUpperCase()
        const anchor = (row['ReferenceLeftFlank'] || '').slice(-1).toUpperCase()
        if (!tract || !anchor) return null

        const unit = mostCommonInFrameUnit(tract, motif.length)
        const referenceCount = Math.floor(tract.length / motif.length)
        if (repeatCount > referenceCount) {
            return `${chrom}-${start_0based}-${anchor}-${anchor}${unit.repeat(repeatCount - referenceCount)}`
        }
        return `${chrom}-${start_0based}-${anchor}${tract.slice(0, unit.length * (referenceCount - repeatCount))}-${anchor}`
    }

    // SpliceAI-lookup refuses longer variants (MAX_VARIANT_LENGTH in the SpliceAI-lookup repo's index.html)
    const SPLICEAI_LOOKUP_MAX_VARIANT_LENGTH = 1900

    const SPLICEAI_CHANGE_TYPE_NAMES = {
        AG: 'acceptor gain',
        AL: 'acceptor loss',
        DG: 'donor gain',
        DL: 'donor loss',
    }

    // Returns the background color for a SpliceAI delta score, using the same colors and thresholds as SpliceAI-lookup's
    // delta score cells, or null if the score is below 0.2 or missing
    function getSpliceAIDeltaScoreBackgroundColor(deltaScore) {
        if (deltaScore == null) return null
        if (deltaScore >= 0.8) return '#fccfb8'
        if (deltaScore >= 0.5) return '#fff19d'
        if (deltaScore >= 0.2) return '#cdffd7'
        return null
    }

    // Shown in dark gray below the SpliceAI delta scores table in the SpliceAI column's popup and on the locus page
    const SPLICEAI_SIMULATED_ALLELES_EXPLANATION = `Repeat expansions and contractions were simulated for the 2.5th
        percentile, 97.5th, and 99.5th percentile allele sizes of the HPRC256 allele size distribution (as well as 3
        hypothetical larger expansion sizes chosen based on the HPRC256 allele size distribution at other loci with the
        same motif). These are the results of running SpliceAI on each of these simulated variants.`

    // The table shown in the SpliceAI column's popup and on the locus page: every simulated allele, with the
    // percentile size(s) it was simulated for (one per line when several round to the same repeat count) and its score
    // linking to SpliceAI-lookup with the settings the full run used (GENCODE v50 basic, distance 10,000, no masking).
    // A score has no link when SpliceAI-lookup can't open its variant, and a footnote says why. Returns {tableHtml,
    // footnotesHtml} so the caller can put the footnotes below SPLICEAI_SIMULATED_ALLELES_EXPLANATION.
    function buildSpliceAIDeltaScoresTableHtml(row) {
        let html = `<table class="ui compact table" style="width: auto; white-space: nowrap;">
            <thead><tr><th style="padding-right: 2em;">Percentile</th><th style="padding-right: 2em;">Repeats</th><th>&Delta; Score</th></tr></thead><tbody>`
        const alleleSizesByRepeatCount = parseSpliceAIAlleleSizesByRepeatCount(row['SpliceAI_AlleleSizesByRepeatCount'])
        let hasVariantTooLongForSpliceAILookup = false
        let hasVariantWithoutReferenceSequence = false
        // Truncated at 12 bp like the results table's Motif column, with the motif length shown only when truncated
        const { motif } = parseAndNormalizeLocusId(row['LocusId'])
        const motifHtml = motif.length > 12
            ? `<span style="font-family: monospace">${motif.substring(0, 12)}</span>... (${motif.length})`
            : `<span style="font-family: monospace">${motif}</span>`
        for (const {repeatCount, deltaScore, changeType} of parseSpliceAIDeltaScoresByRepeatCount(
                row['SpliceAI_DeltaScoreByRepeatCount'])) {
            // The change type is left out of the data when the delta score is below 0.01
            const scoreText = changeType
                ? `${deltaScore.toFixed(2)} ${SPLICEAI_CHANGE_TYPE_NAMES[changeType]} (${changeType})`
                : deltaScore.toFixed(2)
            const variant = getSpliceAISimulatedAlleleVariant(row, repeatCount)
            let scoreHtml = `${scoreText} *`  // the asterisk points to the footnote that says why there is no link
            if (!variant) {
                hasVariantWithoutReferenceSequence = true
            } else if (variant.length > SPLICEAI_LOOKUP_MAX_VARIANT_LENGTH) {
                hasVariantTooLongForSpliceAILookup = true
            } else {
                scoreHtml = `<a href="https://spliceailookup.broadinstitute.org/#variant=${variant}&amp;hg=38&amp;bc=basic&amp;distance=10000&amp;mask=0&amp;ra=0" target="_blank">${scoreText}</a>`
            }
            const backgroundColor = getSpliceAIDeltaScoreBackgroundColor(deltaScore)
            html += `<tr><td style="padding-right: 2em;">${(alleleSizesByRepeatCount.get(repeatCount) || []).join('<br>')}</td>
                <td style="text-align: right; padding-right: 2em;">${repeatCount} x ${motifHtml}</td>
                <td${backgroundColor ? ` style="background-color: ${backgroundColor};"` : ''}>${scoreHtml}</td></tr>`
        }
        html += '</tbody></table>'
        // Each footnote has a blank line above it, in the same color and size as SPLICEAI_SIMULATED_ALLELES_EXPLANATION
        let footnotesHtml = ''
        if (hasVariantTooLongForSpliceAILookup) {
            footnotesHtml += `<p style="color: #666; margin-top: 1em;">* A score without a link is for a simulated
                allele whose variant is longer than ${SPLICEAI_LOOKUP_MAX_VARIANT_LENGTH.toLocaleString()} characters
                (the maximum input size accepted by SpliceAI-lookup).</p>`
        }
        if (hasVariantWithoutReferenceSequence) {
            footnotesHtml += `<p style="color: #666; margin-top: 1em;">* The locus width is larger than 10 kb, so the
                results table doesn't load its sequence. Open the locus page to get links to SpliceAI-lookup.</p>`
        }
        return {tableHtml: html, footnotesHtml}
    }

    // Gene info popup helpers (used by GencodeGeneName, RefseqGeneName, ManeGeneName columns)
    const GENE_INFO_API_URL = 'https://us-central1-cmg-analysis.cloudfunctions.net/query_gene_lookup_db'
    const GENE_INFO_CACHE = new Map()

    const generateGeneNameCellValue = (geneName) => {
        if (!geneName) return ''
        return String(geneName).split(',').map(part => {
            const trimmed = part.trim()
            if (!trimmed) return ''
            const escaped = escapeHtmlText(trimmed)
            return `<span class="gene-info-link action-link" data-gene-name="${escaped}">${escaped}</span>`
        }).filter(s => s).join(', ')
    }

    const fetchGeneInfo = async (geneName) => {
        if (GENE_INFO_CACHE.has(geneName)) {
            return GENE_INFO_CACHE.get(geneName)
        }
        const sql = `SELECT * FROM \`cmg-analysis.gene_lookup.combined_gene_disease_association_table\` WHERE UPPER(gene_symbol) = UPPER('${escapeTextForSqlStringLiteral(String(geneName))}')`
        const response = await fetch(GENE_INFO_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sql, start_index: 0, page_size: 1 }),
        })
        if (!response.ok) {
            throw new Error(`Gene lookup API error: ${response.status} ${response.statusText}`)
        }
        const data = await response.json()
        const row = (data && data.rows && data.rows.length > 0) ? data.rows[0] : null
        GENE_INFO_CACHE.set(geneName, row)
        return row
    }

    const buildGeneExternalLinks = ({ geneSymbol, hgncId, ensemblId, aliases, mimNumber, excludeNames }) => {
        const exclude = excludeNames || new Set()
        const link = (label, url) => `<a href="${url}" target="_blank">${escapeHtmlText(label)}</a>`
        const pubmedNames = geneSymbol
            ? [geneSymbol, ...(aliases || '').split(',').map(s => s.trim()).filter(s => s)]
            : []
        // In the order in which the links are shown
        const linkSpecs = {
            OMIM:           mimNumber  ? link('OMIM', SOURCES.OMIM.url({ mimNumber })) : '',
            ClinGen:        hgncId     ? link('ClinGen', `https://search.clinicalgenome.org/kb/gene-dosage/${hgncId}`) : '',
            ClinVar:        geneSymbol ? link('ClinVar', SOURCES.ClinVar.url({ geneSymbol })) : '',
            HGMD:           geneSymbol ? link('HGMD', SOURCES.HGMD.url({ geneSymbol })) : '',
            GeneCards:      geneSymbol ? link('GeneCards', `https://www.genecards.org/cgi-bin/carddisp.pl?gene=${geneSymbol}`) : '',
            Decipher:       ensemblId  ? link('Decipher', SOURCES.Decipher.url({ ensemblId })) : '',
            Geno2MP:        geneSymbol ? link('Geno2MP', `https://geno2mp.gs.washington.edu/Geno2MP/#/gene/${geneSymbol}/gene/0/0/0`) : '',
            Monarch:        geneSymbol ? link('Monarch', `https://monarchinitiative.org/explore?search=${geneSymbol}#search`) : '',
            'Protein Atlas':ensemblId  ? link('Protein Atlas', `https://www.proteinatlas.org/${ensemblId}/tissue`) : '',
            GTEx:           ensemblId  ? link('GTEx', `https://www.gtexportal.org/home/gene/${ensemblId}`) : '',
            UniProt:        ensemblId  ? link('UniProt', `https://www.uniprot.org/uniprot?query=${ensemblId}+AND(reviewed:true)+AND(organism_id:9606)`) : '',
            gnomAD:         ensemblId  ? link('gnomAD', gnomadGeneUrl(ensemblId, 'gnomad_r4')) : '',
            primAD:         geneSymbol ? link('primAD', `https://primad.basespace.illumina.com/gene/${geneSymbol}`) : '',
            KEGG:           geneSymbol ? link('KEGG', `https://www.kegg.jp/kegg-bin/search_pathway_text?keyword=${geneSymbol}&viewImage=true`) : '',
            PubMed:         pubmedNames.length ? link('PubMed', `https://www.ncbi.nlm.nih.gov/pubmed/?term=(${pubmedNames.join(' OR ')})`) : '',
            'NCBI Gene':    ensemblId  ? link('NCBI Gene', `https://www.ncbi.nlm.nih.gov/gene/?term=${ensemblId}`) : '',
        }
        const linksHtml = Object.entries(linkSpecs)
            .filter(([name, linkHtml]) => linkHtml && !exclude.has(name))
            .map(([, linkHtml]) => linkHtml)
            .join('')
        if (!linksHtml) return ''
        return `<div class="gene-info-external-links"><span class="gene-info-section-label">Links:</span>${linksHtml}</div>`
    }

    const buildGeneLookupSourceAttribution = (hgncId, ensemblId) => {
        let url = ''
        if (hgncId) url = `https://genelookup.broadinstitute.org/gene.html#hgnc_gene_id=${encodeURIComponent(hgncId)}`
        else if (ensemblId) url = `https://genelookup.broadinstitute.org/gene.html#ensembl_gene_id=${encodeURIComponent(ensemblId)}`
        if (!url) return ''
        return `<div class="gene-info-source-attribution">Loaded from <a href="${url}" target="_blank">GeneLookup</a></div>`
    }

    const gnomadGeneUrl = (ensemblId, dataset) => ensemblId
        ? `https://gnomad.broadinstitute.org/gene/${encodeURIComponent(ensemblId)}?dataset=${dataset}`
        : 'https://gnomad.broadinstitute.org/'

    // Constraint-score thresholds for red/yellow highlighting in the gene-info popup.
    // pLI: higher = more constrained; LOEUF: lower = more constrained.
    const CONSTRAINT_THRESHOLDS = {
        'pLI_v2': { red: { value: 0.9, operator: '>=' } },
        'pLI_v4': { red: { value: 0.9, operator: '>=' } },
        'LOEUF':  { red: { value: 0.2, operator: '<'  }, yellow: { value: 0.6, operator: '<' } },
    }
    const CONSTRAINT_RED_COLOR = '#c0392b'
    const CONSTRAINT_YELLOW_COLOR = '#b8860b'

    const constraintOpSymbol = (op) => op === '>=' ? '≥' : op === '<=' ? '≤' : op

    const constraintCrosses = (cfg, val) => {
        if (!cfg) return false
        switch (cfg.operator) {
            case '>=': return val >= cfg.value
            case '<=': return val <= cfg.value
            case '>':  return val >  cfg.value
            case '<':  return val <  cfg.value
        }
        return false
    }

    // The 'Red when ...' and 'Yellow when ...' lines that describe a constraint score's thresholds (0, 1 or 2 lines)
    const describeConstraintThresholdLines = (t) => {
        const lines = []
        if (t && t.red)    lines.push(`<span style='color: ${CONSTRAINT_RED_COLOR}; font-weight: bold;'>Red</span> when ${constraintOpSymbol(t.red.operator)} ${t.red.value}`)
        if (t && t.yellow) lines.push(`<span style='color: ${CONSTRAINT_YELLOW_COLOR}; font-weight: bold;'>Yellow</span> when ${constraintOpSymbol(t.yellow.operator)} ${t.yellow.value}`)
        return lines
    }

    const constraintPopupHtml = (label, key) => {
        const lines = [`<b>${label}</b>`, ...describeConstraintThresholdLines(CONSTRAINT_THRESHOLDS[key])]
        return `<div style='white-space: nowrap;'>${lines.join('<br>')}</div>`
    }

    const renderConstraintValue = (val, key, labelForPopup) => {
        if (val == null) return ''
        const formatted = Number(val).toFixed(2)
        const t = CONSTRAINT_THRESHOLDS[key]
        if (!t) return formatted
        let color = null
        if (constraintCrosses(t.red, val)) color = CONSTRAINT_RED_COLOR
        else if (constraintCrosses(t.yellow, val)) color = CONSTRAINT_YELLOW_COLOR
        if (!color) return formatted
        const popup = escapeHtmlText(constraintPopupHtml(labelForPopup, key))
        return `<span class="constraint-hover-popup" data-html="${popup}" style="color: ${color}; font-weight: bold;">${formatted}</span>`
    }

    // Per-source config: URL builder for the on-click link, plus description for hover tooltips.
    // Keys are the source labels emitted by the gene-lookup pipeline (constraint sources may also
    // appear with a trailing ":<value>" suffix, which is stripped before lookup).
    const SOURCES = {
        'OMIM': {
            description: '<b>OMIM</b>: Online Mendelian Inheritance in Man',
            url: ({ mimNumber }) => mimNumber ? `https://omim.org/entry/${encodeURIComponent(mimNumber)}` : 'https://omim.org/',
        },
        'ClinGen': {
            description: '<b>ClinGen</b>: gene-disease validity classifications',
            url: ({ hgncId }) => hgncId ? `https://search.clinicalgenome.org/kb/genes/${encodeURIComponent(hgncId)}` : 'https://clinicalgenome.org/',
        },
        'GenCC': {
            description: '<b>GenCC</b>: Gene Curation Coalition',
            url: ({ hgncId }) => hgncId ? `https://search.thegencc.org/genes/${encodeURIComponent(hgncId)}` : 'https://thegencc.org/',
        },
        'PanelAppUK': {
            description: '<b>PanelApp UK</b>: Genomics England PanelApp',
            url: ({ geneSymbol }) => geneSymbol ? `https://panelapp.genomicsengland.co.uk/panels/entities/${encodeURIComponent(geneSymbol)}` : 'https://panelapp.genomicsengland.co.uk/',
        },
        'PanelAppAU': {
            description: '<b>PanelApp AU</b>: Australian Genomics PanelApp',
            url: ({ geneSymbol }) => geneSymbol ? `https://panelapp-aus.org/panels/entities/${encodeURIComponent(geneSymbol)}` : 'https://panelapp-aus.org/',
        },
        'Decipher': {
            description: '<b>DECIPHER</b>: DDG2P gene-disease associations',
            url: ({ ensemblId }) => ensemblId ? `https://www.deciphergenomics.org/gene/${encodeURIComponent(ensemblId)}/overview/protein-genomic-info` : 'https://www.deciphergenomics.org/',
        },
        'ClinVar': {
            description: '<b>ClinVar</b>: pathogenic/likely pathogenic variant annotations',
            url: ({ geneSymbol, ensemblId }) => {
                const grch38 = '+AND+GRCh38%5BAssembly%5D'
                if (geneSymbol) return `https://www.ncbi.nlm.nih.gov/clinvar?term=${encodeURIComponent(geneSymbol)}%5Bgene%5D${grch38}`
                if (ensemblId)  return `https://www.ncbi.nlm.nih.gov/clinvar?term=${encodeURIComponent(ensemblId)}${grch38}`
                return 'https://www.ncbi.nlm.nih.gov/clinvar/'
            },
        },
        'HGMD': {
            description: '<b>HGMD</b>: Human Gene Mutation Database',
            url: ({ geneSymbol }) => geneSymbol ? `https://my.qiagendigitalinsights.com/bbp/view/hgmd/pro/gene.php?gene=${encodeURIComponent(geneSymbol)}` : null,
        },
        'GWAS': {
            description: '<b>GWAS Catalog</b>: GWAS hits for MONDO rare-disease phenotypes',
            url: ({ geneSymbol }) => geneSymbol ? `https://www.ebi.ac.uk/gwas/genes/${encodeURIComponent(geneSymbol)}` : 'https://www.ebi.ac.uk/gwas/',
        },
        'Fridman': {
            description: '<b>Fridman et al. 2025</b>: autosomal recessive gene-disease associations',
            url: () => 'https://pubmed.ncbi.nlm.nih.gov/40374730/',
        },
        'dbNSFP': {
            description: '<b>dbNSFP</b>: variant-level functional annotations (e.g., model-organism phenotypes)',
            url: () => 'https://www.dbnsfp.org/',
        },
        'pLI_v2': {
            description: '<b>pLI (v2)</b>: Probability of loss-of-function intolerance from gnomAD v2',
            thresholdKey: 'pLI_v2',
            url: ({ ensemblId }) => gnomadGeneUrl(ensemblId, 'gnomad_r2_1'),
        },
        'pLI_v4': {
            description: '<b>pLI (v4)</b>: Probability of loss-of-function intolerance from gnomAD v4',
            thresholdKey: 'pLI_v4',
            url: ({ ensemblId }) => gnomadGeneUrl(ensemblId, 'gnomad_r4'),
        },
        'LOEUF': {
            description: '<b>LOEUF (v4)</b>: Loss-of-function observed/expected upper bound from gnomAD v4',
            thresholdKey: 'LOEUF',
            url: ({ ensemblId }) => gnomadGeneUrl(ensemblId, 'gnomad_r4'),
        },
        'MOEUF': {
            description: '<b>Missense O/E upper bound (v4)</b>: Missense observed/expected upper bound (MOEUF) from gnomAD v4',
            url: ({ ensemblId }) => gnomadGeneUrl(ensemblId, 'gnomad_r4'),
        },
    }

    const getSourceInfo = (src) => SOURCES[String(src).split(':')[0]] || {}

    // Returns the source names in a gene-lookup sources value like '3: OMIM, ClinVar, pLI_v4:0.98', or null if it isn't
    // in that format
    const parseGeneInfoSourceNames = (sourcesStr) => {
        const match = String(sourcesStr || '').match(/^\d+:\s*(.*)$/)
        return match ? match[1].split(',').map(s => s.trim()).filter(s => s) : null
    }

    const renderGeneInfoSourcesBadges = (sourcesStr, ids = {}) => {
        if (!sourcesStr) return ''
        const sourcesList = parseGeneInfoSourceNames(sourcesStr)
        if (!sourcesList) return escapeHtmlText(sourcesStr)
        const pastelColors = ['#e8d5d5', '#d5dfe8', '#d5e8db', '#e8e2d5', '#ddd5e8', '#d5e8e6', '#e8d5e0', '#e0e8d5']
        return sourcesList.map((src, i) => {
            const bg = pastelColors[i % pastelColors.length]
            const badge = `<span class="ui mini label" style="background-color: ${bg}; color: #333; margin: 1px;">${escapeHtmlText(src)}</span>`
            const info = getSourceInfo(src)
            const url = info.url ? info.url(ids) : null
            const descriptionParts = []
            if (info.description) descriptionParts.push(info.description)
            if (info.thresholdKey) descriptionParts.push(...describeConstraintThresholdLines(CONSTRAINT_THRESHOLDS[info.thresholdKey]))
            const popupAttr = descriptionParts.length
                ? ` class="source-hover-popup" data-html="${escapeHtmlText(`<div style='white-space: nowrap;'>${descriptionParts.join('<br>')}</div>`)}"`
                : ''
            if (url) return `<a href="${url}" target="_blank" style="text-decoration: none;"${popupAttr}>${badge}</a>`
            if (popupAttr) return `<span${popupAttr}>${badge}</span>`
            return badge
        }).join(' ')
    }

    const renderGeneInfoPopupContent = (row, queryGeneName) => {
        if (!row) {
            return `<div class="gene-info-popup-content">
                <div class="gene-info-no-disease">This gene has no known monogenic disease associations</div>
                ${buildGeneExternalLinks({ geneSymbol: queryGeneName })}

        }

        const geneSymbol = row['gene_symbol'] || ''
        const hgncId = row['hgnc_gene_id'] || ''
        const ensemblId = row['ensembl_gene_id'] || ''
        const chrom = row['gene_chrom'] || ''
        const start = row['gene_start']
        const end = row['gene_end']
        const aliases = row['gene_aliases'] || ''
        const inheritance = row['inheritance'] || ''
        const sources = row['sources'] || ''
        const coordinates = (chrom !== '' && start != null && end != null)
            ? `${String(chrom).startsWith('chr') ? '' : 'chr'}${chrom}:${start}-${end}`
            : ''

        const pliV2 = renderConstraintValue(row['pLI_v2'], 'pLI_v2', 'pLI (v2)')
        const pliV4 = renderConstraintValue(row['pLI_v4'], 'pLI_v4', 'pLI (v4)')
        const loeuf = renderConstraintValue(row['lof_oe_ci_upper_v4'], 'LOEUF', 'LOEUF (v4)')
        const moeuf = renderConstraintValue(row['mis_oe_ci_upper_v4'])  // no highlighting thresholds

        const mimNumbers = String(row['OMIM_mim_number'] || '').split(';').map(m => m.trim()).filter(m => m)

        const externalLinks = buildGeneExternalLinks({
            geneSymbol, hgncId, ensemblId, aliases, mimNumber: mimNumbers[0] || '',
            excludeNames: new Set(parseGeneInfoSourceNames(sources) || []),
        })

        const hgncCell = hgncId ? `<a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/${encodeURIComponent(hgncId)}" target="_blank">${escapeHtmlText(hgncId)}</a>` : ''
        const ensemblCell = ensemblId ? `<a href="https://ensembl.org/Homo_sapiens/Gene/Summary?g=${encodeURIComponent(ensemblId)}" target="_blank">${escapeHtmlText(ensemblId)}</a>` : ''

        const infoRow = (label, value) => (value === null || value === undefined || value === '')
            ? ''
            : `<tr><td class="gene-info-popup-label">${label}</td><td>${value}</td></tr>`

        const leftRows = [
            infoRow('Gene Symbol:', geneSymbol ? `<span style="font-weight: bold;">${escapeHtmlText(geneSymbol)}</span>` : ''),
            infoRow('HGNC ID:', hgncCell),

            infoRow('Aliases:', escapeHtmlText(aliases)),
            infoRow('Coordinates (hg38):', escapeHtmlText(coordinates)),
        ].join('')

        const rightRows = [

            : ''

            ? `<hr class="gene-info-divider"><div class="gene-info-sources-section"><span class="gene-info-section-label">Sources:</span> ${sourcesBadges}</div>`

        return `<div class="gene-info-popup-content">

            <div class="gene-info-popup-row">

    // Sets up the click popups of the .show-popup elements, and the hover popups of the help icons inside them
    const initShowPopupsWithNestedHelpIcons = () => {
        $('.show-popup').popup({
            on: 'click',
            hoverable: true,
            onVisible: function() {

            }
        })
    }

    const loadingPopupHtml = (geneName) => `<div class="gene-info-popup-content" style="min-width: 320px; padding: 6px;">Loading gene info${geneName ? ' for ' + escapeHtmlText(geneName) : ''}...</div>`

    const initGeneInfoLinks = (rootSelector) => {
        const $root = rootSelector ? $(rootSelector) : $(document)
        $root.find('.gene-info-link').each(function () {
            const $elem = $(this)
            if ($elem.data('geneInfoInitialized')) return
            $elem.data('geneInfoInitialized', true)
            $elem.popup({
                on: 'click',
                hoverable: true,
                position: 'bottom left',
                lastResort: 'bottom left',
                className: { popup: 'ui popup gene-info-popup' },
                html: loadingPopupHtml(),
                onShow: function () {
                    const geneName = $elem.data('gene-name')
                    if (!geneName) return
                    // Reset content first so stale content from a prior gene isn't shown while we render.
                    $elem.popup('change content', loadingPopupHtml(geneName))
                    const initNestedHoverPopups = () => {
                        const $popup = $elem.popup('get popup')
                        if (!$popup) return
                        $popup.find('.source-hover-popup, .constraint-hover-popup').popup({
                            on: 'hover',
                            delay: { show: 80, hide: 50 },
                            position: 'top center',
                        })
                    }
                    // 'change content' keeps the position computed for the small loading message, so the popup is
                    // repositioned to keep the larger content inside the window
                    fetchGeneInfo(geneName).then(row => {
                        $elem.popup('change content', renderGeneInfoPopupContent(row, geneName))
                        $elem.popup('reposition')
                        initNestedHoverPopups()
                    }).catch(err => {
                        $elem.popup('change content', `<div class="gene-info-popup-content gene-info-popup-error">Error loading gene info: ${escapeHtmlText(err && err.message ? err.message : String(err))}</div>`)
                        $elem.popup('reposition')
                    })
                },
            })
        })

    const REQUIRED_DATA_COLUMNS_FOR_POLYMORPHISM_COLUMN = [
        'LocusId',
        'ReferenceRegion',
        'NumRepeatsInReference',
        'ReferenceMotif',
        'StdevFromIllumina174k',
        'AlleleFrequenciesFromIllumina174k',
        'StdevFromT2TAssemblies',
        'AlleleFrequenciesFromT2TAssemblies',
        'HPRC256_Stdev',
        'HPRC256_AlleleHistogram',
        'HPRC256_BiallelicHistogram',
        'HPRC256_AlleleSizeAndPurityDistribution',
        'HPRC256_AlleleSizeAndMethylationDistribution',
        // The interval the HPRC256 LPS and purity columns above describe, which their stratified population and sex

        'HPRC256_NarrowestInterval',
        // Where the LPS charts mark the reference, and the interval of the methylation distribution
        'HPRC256_ReferenceLPSRepeatCount',
        'HPRC256_MethylationInterval',
        'HPRC256TotalLength_Stdev',
        'HPRC256TotalLength_AlleleHistogram',
        'HPRC256TotalLength_BiallelicHistogram',
        'HPRC256TotalLength_Interval',
        'TenK10K_AlleleHistogram',
        'TenK10K_BiallelicHistogram',
        'TenK10K_Stdev',
        'AoU1027_Stdev',
        'AoU1027_OE_LengthPercentile',
    ]


    // The gene annotation columns, which show the value as is, as a gene name, or as a gene region
    const showValueAsIs = (value) => value
    for (const [columnName, displayName, formatValue] of [
        ['GencodeGeneName', 'Gene', generateGeneNameCellValue],
        ['GencodeGeneId', 'Gencode Gene Id', showValueAsIs],
        ['GencodeTranscriptId', 'Gencode Transcript', showValueAsIs],
        ['RefseqGeneRegion', 'RefSeq Region', getGeneRegionColumnValue],
        ['RefseqGeneId', 'RefSeq Id', showValueAsIs],
        ['RefseqTranscriptId', 'RefSeq Transcript Id', showValueAsIs],
        ['RefseqGeneName', 'RefSeq Gene', generateGeneNameCellValue],
        ['ManeGeneRegion', 'MANE Region', getGeneRegionColumnValue],
        ['ManeGeneId', 'MANE Gene Id', showValueAsIs],
        ['ManeTranscriptId', 'MANE Transcript', showValueAsIs],
        ['ManeGeneName', 'MANE Gene', generateGeneNameCellValue],

        TABLE_COLUMNS[columnName] = {
            displayName,

            helpText: RESULTS_TABLE_COLUMN_HELP_TEXTS[columnName],

    for (const [columnName, stdevColumnName] of Object.entries(STDEV_COLUMN_BY_ALLELE_HISTOGRAM_COLUMN)) {

        }
