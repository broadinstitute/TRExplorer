    const REFERENCE_TRACKS = [

        ["igv_36k_map", "36-mer mappability", `${REFERENCE_BASE_URL}/mappability/GRCh38_no_alt_analysis_set_GCA_000001405.15-k36_m2.bw`],
        ["igv_100k_map", "100-mer mappability", `${REFERENCE_BASE_URL}/mappability/GRCh38_no_alt_analysis_set_GCA_000001405.15-k100_m2.bw`],
        ["igv_haploinsuf", "ClinGen haploinsufficiency track", `${REFERENCE_BASE_URL}/clingen/ClinGen_haploinsufficiency_gene_GRCh38.sorted.bed.gz`],
        ["igv_triplosens", "ClinGen triplosensitivity track", `${REFERENCE_BASE_URL}/clingen/ClinGen_triplosensitivity_gene_GRCh38.sorted.bed.gz`],
        ["igv_repeatmask", "UCSC RepeatMasker", `${REFERENCE_BASE_URL}/hg38.RepeatMasker.bed.gz`],
        ["igv_ncannot", "Non-coding Annotations", `${REFERENCE_BASE_URL}/ncAnnot.v0.14.jul2024.filtered.bed.gz`],

    const ALL_AVAILABLE_TRACKS = [
        ...TR_EXPLORER_SOURCE_CATALOGS,

    // The BigQuery tables that the queries sent to the query_db Cloud Function read from
    const PROJECT_ID = 'cmg-analysis'
    const DATASET_ID = 'tandem_repeat_explorer'
    const TABLE_ID = 'catalog_20261030_170523'
    const HPRC256_LPS_STRATIFIED_TABLE_ID = 'hprc256_stratified_lps_20260902_143605'
    // Rewritten by bigquery-proxy/load_bigquery_HPRC256_stratified_LPS_frequency_data.py --allele-size-measure total-length
    const HPRC256_TOTAL_LENGTH_STRATIFIED_TABLE_ID = 'hprc256_stratified_total_allele_length_20261016_004909'
    const HPRC256_METHYLATION_TABLE_ID = 'hprc256_methylation_20260521_033520'
    const HPRC256_ALLELE_PURITY_TABLE_ID = 'hprc256_allele_purity_20260521_022709'

    const HPRC256_DECOMPOSED_ALLELES_TABLE_ID = '`cmg-analysis.tandem_repeat_explorer.hprc256_decomposed_alleles_20260520_210656`'

    // Ported from the trviz CACNA1C example. Motifs at a locus are assigned colors
    // by canonical class (rotation + reverse-complement). The top
    // MAX_COLORED_CANONICAL_MOTIFS canonical classes (ranked by aggregated count
    // across all of the locus's alleles) each claim one unique palette color, and
    // every motif within those classes inherits that color. Motifs whose canonical
    // class isn't in the top-N fall back to OTHER_MOTIFS_COLOR.
    const MOTIF_COLORS = [
        "#08519c", "#4292c6", "#9ecae1",
        "#f8bbd0", "#f48fb1", "#d81b60",
        "#1b9e77", "#66c2a5", "#8dd3c7",
        "#f9c74f",
    ]
    const OTHER_MOTIFS_COLOR = "#333333"
    const MAX_COLORED_CANONICAL_MOTIFS = MOTIF_COLORS.length

    const SHOW_COLUMNS_VALUE_DELIMITER = ','

    const IGV_LOCUS_PADDING = 150
    const LOCUS_ID_REGEXP = /^[\s]*(?:chr)?(\w+)[\s]*-([\d,]+)-([\d,]+)-([ACGTNRYMKSWHBVD]+)[\s]*$/i
    const REFERENCE_REGION_REGEXP = /^[\s]*(?:chr)?([XYMTt0-9]+):([\d,]+)[\p{Dash_Punctuation}]([\d,]+)[\s]*$/iu
    // Keyed by the chromosome name without a "chr" prefix, in uppercase
    const CHROM_TO_CHROM_INDEX = {"X": 23, "Y": 24, "MT": 25, "M": 25}
    for (let i = 1; i <= 22; i++) {
        CHROM_TO_CHROM_INDEX[`${i}`] = i
    }

    // Returns the parts of a LocusId typed by the user or read from a URL, in the form LocusId is stored in (uppercase,
    // and without the "chr" prefix, comma thousands-separators and spaces that LOCUS_ID_REGEXP tolerates), as
    // {chrom, start_0based, end_1based, motif, locusId}, or null if the text isn't a LocusId
    const parseAndNormalizeLocusId = (text) => {
        const locusIdMatch = `${text}`.match(LOCUS_ID_REGEXP)
        if (!locusIdMatch) return null
        const [, chrom, start_0based, end_1based, motif] = locusIdMatch
        const parsedLocusId = {
            chrom: chrom.toUpperCase(),
            start_0based: parseInt(start_0based.replace(/,/g, '')),
            end_1based: parseInt(end_1based.replace(/,/g, '')),
            motif: motif.toUpperCase(),
        }
        parsedLocusId.locusId = `${parsedLocusId.chrom}-${parsedLocusId.start_0based}-${parsedLocusId.end_1based}-${parsedLocusId.motif}`
        return parsedLocusId
    }

    // Returns the {column, direction} that a table is sorted by after a click on a column's header: a new column sorts in
    // its default direction, a second click on it flips the direction, and a third click goes back to the table's
    // default order, which is returned as {column: null, direction: null}
    const getSortAfterColumnHeaderClick = (sortColumn, sortDirection, clickedColumn, clickedColumnDefaultDirection) => {
        if (clickedColumn !== sortColumn) return {column: clickedColumn, direction: clickedColumnDefaultDirection}
        if (sortDirection === clickedColumnDefaultDirection) {
            return {column: clickedColumn, direction: clickedColumnDefaultDirection === 'ASC' ? 'DESC' : 'ASC'}
        }
        return {column: null, direction: null}
    }

    // The IGV locus string of a LocusId from parseAndNormalizeLocusId. IGV reads the start of a locus string as 1-based,
    // while a LocusId's start is 0-based.
    const buildIgvLocusStringForLocusId = (parsedLocusId) =>
        `chr${parsedLocusId.chrom}:${parsedLocusId.start_0based + 1}-${parsedLocusId.end_1based}`

    // The SQL condition that selects the catalog row of a LocusId from parseAndNormalizeLocusId, or 'FALSE' (rather than
    // invalid SQL) for a chromosome the catalog doesn't have. The table is partitioned on chrom_index and clustered by
    // start_0based, so these limit the bytes scanned.
    const buildSqlConditionForLocusId = (parsedLocusId) => {
        const chromIndex = CHROM_TO_CHROM_INDEX[parsedLocusId.chrom]
        if (chromIndex === undefined) return 'FALSE'
        return `(chrom_index = ${chromIndex} AND start_0based = ${parsedLocusId.start_0based} AND LocusId = '${escapeTextForSqlStringLiteral(parsedLocusId.locusId)}')`
    }

        'HPRC256_BiallelicHistogram': 'Repeat Count in Longest Pure Segment (LPS)',
        'HPRC256TotalLength_BiallelicHistogram': 'Total Repeat Count (TRGT Allele Length / Motif Size)',
        'TenK10K_BiallelicHistogram': 'Repeat Count',
    }

    const ALLELE_HISTOGRAM_SHORT_NAMES = {
        'HPRC256_AlleleHistogram': 'HPRC256:LPS',
        'HPRC256TotalLength_AlleleHistogram': 'HPRC256:Length',
        'TenK10K_AlleleHistogram': 'TenK10K Phase 1',
        'AlleleFrequenciesFromIllumina174k': '1kGP',
        'AlleleFrequenciesFromT2TAssemblies': 'T2T',
    }
    const ALLELE_FREQUENCY_CHART_TITLES = {
        'HPRC256_AlleleHistogram': 'Allele Frequencies (LPS) from HPRC 256 PacBio samples',

    const queryBigQuery = async (query, startIndex=null, pageSize=null, exportToFileFormat=null, toolName=null, overlapHandling=null, trgtCatalogType=null) => {
        const url = `https://us-central1-cmg-analysis.cloudfunctions.net/query_db`
        console.log("Page state:", GLOBAL_PAGE_STATE)
        console.log(exportToFileFormat ? `Exporting to ${toolName || ''} ${exportToFileFormat}:`: `Sending query:`, query.replace(/[\n\r\s]+/g, ' '))
        const requestBody = {
            sql: query,
            export_to_file_format: exportToFileFormat,
            tool_name: toolName,
            overlap_handling: overlapHandling,
            trgt_catalog_type: trgtCatalogType,
            start_index: startIndex,
            page_size: pageSize,
        }

        let response
        try {
            response = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(requestBody),
            })
        } catch (error) {
            // fetch() throws TypeError for network-level failures, including responses that arrive
            // without CORS headers (e.g. Cloud Function infra-level timeouts). The browser surfaces
            // those as "CORS policy" errors, which is misleading — translate to something actionable.
            console.error('Error querying BigQuery:', error)
            if (error instanceof TypeError) {
                throw new Error(
                    'The server did not respond. This usually means the request timed out or there is a network problem. Please retry after double-checking that your internet connection is working.'
                )
            }
            throw new Error(`BigQuery query error: ${error.message || 'Unknown error'}`)
        }

        if (!response.ok) {
            let detail = response.statusText
            try {
                const body = await response.json()
                if (body && body.error) detail = body.error
            } catch (e) {
                // response body wasn't JSON — keep statusText
            }
            console.error(`BigQuery API error ${response.status}:`, detail)
            // BigQuery's message for the daily query quota (QueryUsagePerUserPerDay) is long and repeats itself
            if (`${detail}`.includes('QueryUsagePerUserPerDay')) {
                throw new Error('Your usage exceeded the usage quota per user per day.')
            }
            throw new Error(`BigQuery API error (HTTP ${response.status}): ${detail}`)
        }

        return await response.json()
    }

    // The window.searchResults key under which a chart's stratified row for a locus and interval is cached. A LocusId can
    // be genotyped under multiple TRGT intervals, so each (locus, interval) needs its own cache slot.
    const buildHprc256StratifiedRowCacheKey = (cfg, locusId, interval) =>
        cfg.cacheKey + '__' + locusId + (interval ? ('__' + interval) : '')

    const fetchHprc256StratifiedRow = async (chartKind, locusId, interval) => {
        const cfg = HPRC256_STRATIFIED_CHARTS[chartKind]
        const cacheKey = buildHprc256StratifiedRowCacheKey(cfg, locusId, interval)
        if (window.searchResults && cacheKey in window.searchResults) {
            return window.searchResults[cacheKey]
        }
        // Backtick-quoted, since `interval` is a reserved word in BigQuery SQL
        let where = `\`${cfg.locusIdColumn}\` = '${escapeTextForSqlStringLiteral(locusId)}'`
        if (interval) {
            where += ` AND \`${cfg.intervalColumn}\` = '${escapeTextForSqlStringLiteral(interval)}'`
        }
        const query = `SELECT * FROM ${cfg.completeTableId} WHERE ${where} LIMIT 1`
        // The query's promise is cached, so that a call made while it runs (e.g. after a quick second stratum change)
        // waits for it rather than sending it again. A failed query is removed from the cache, so it can be retried.
        const stratifiedRowPromise = queryBigQuery(query, 0, 1, null, null).then(
            result => (result && result.rows && result.rows.length > 0) ? result.rows[0] : null)
        const cache = window.searchResults
        if (cache) {
            cache[cacheKey] = stratifiedRowPromise
            stratifiedRowPromise.catch(() => { if (cache[cacheKey] === stratifiedRowPromise) delete cache[cacheKey] })
        }
        return stratifiedRowPromise
    }

    // The spinner stays until every query that showed it has finished, since overlapping dropdown changes share it
    const showHprc256SpinnerOverlay = (containerEl) => {
        containerEl.__hprc256NumQueriesRunning = (containerEl.__hprc256NumQueriesRunning || 0) + 1
        if (containerEl.querySelector('.hprc256-spinner-overlay')) return
        const overlay = document.createElement('div')
        overlay.className = 'hprc256-spinner-overlay'
        overlay.style.cssText = 'position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.7); z-index:5;'
        overlay.innerHTML = '<div class="ui active loader"></div>'
        containerEl.style.position = 'relative'
        containerEl.appendChild(overlay)
    }

    const hideHprc256SpinnerOverlay = (containerEl) => {
        containerEl.__hprc256NumQueriesRunning -= 1
        if (containerEl.__hprc256NumQueriesRunning > 0) return
        const overlay = containerEl.querySelector('.hprc256-spinner-overlay')
        if (overlay) overlay.remove()
    }

    const handleHprc256DropdownChange = async (controlsEl, mainCatalogRow) => {
        const chartKind = controlsEl.dataset.chartKind
        const cfg       = HPRC256_STRATIFIED_CHARTS[chartKind]
        const containerEl = controlsEl.parentElement
        const canvasEl    = containerEl.querySelector('canvas')
        const emptyNoteEl = controlsEl.querySelector('.hprc256-stratum-empty-note')
        const errorNoteEl = controlsEl.querySelector('.hprc256-stratum-error-note')

        const pop     = controlsEl.querySelector('.hprc256-pop-select').value
        const sexData = controlsEl.querySelector('.hprc256-sex-select').value
        const stratum = HPRC256_STRATUM_FROM_SELECTION(pop, sexData)

        GLOBAL_PAGE_STATE[cfg.urlPopField] = pop
        GLOBAL_PAGE_STATE[cfg.urlSexField] = sexData
        // The selection is kept in the URL without adding a history entry, since on the search page Back would otherwise
        // rerun the search
        writePersistentPageStateToUrl(true)

        // In-flight token: rapid stratum / interval changes can fire multiple
        // concurrent fetches. Stamp the controls element with the current call's
        // token and skip rendering when the token has been superseded.
        const myToken = (controlsEl.__hprc256InFlightToken || 0) + 1
        controlsEl.__hprc256InFlightToken = myToken

        // The catalog row's columns describe one interval per chart kind (cfg.getCatalogInterval), while the chart
        // shows cfg.getSelectedInterval, e.g. the locus page's interval selection for the HPRC256 (LPS) charts, so
        // stratified fetches always pin to the interval being shown. The "All" stratum view can be sourced from the
        // catalog row only when the two match; otherwise it comes from the stratified table's unsuffixed column.
        const activeInterval = cfg.getSelectedInterval(mainCatalogRow)
        const catalogInterval = cfg.getCatalogInterval(mainCatalogRow)
        const usingNonDefaultInterval = !!(activeInterval && catalogInterval && activeInterval !== catalogInterval)

        let histogramString
        let fixedRanges
        try {
            if (!stratum && !usingNonDefaultInterval) {
                histogramString = mainCatalogRow[cfg.mainColumn]
            } else {
                const stratifiedColName = stratum ? `${cfg.unsuffixedColumn}__${stratum}` : cfg.unsuffixedColumn
                // fetchHprc256StratifiedRow returns a cached row right away, so the spinner is shown only for a query
                const isRowCached = window.searchResults
                    && buildHprc256StratifiedRowCacheKey(cfg, mainCatalogRow.LocusId, activeInterval) in window.searchResults
                if (!isRowCached) showHprc256SpinnerOverlay(containerEl)
                try {
                    const fetchedRow = await fetchHprc256StratifiedRow(chartKind, mainCatalogRow.LocusId, activeInterval)
                    histogramString = fetchedRow ? fetchedRow[stratifiedColName] : null
                } finally {
                    if (!isRowCached) hideHprc256SpinnerOverlay(containerEl)
                }
            }

            // The fixed axis and color ranges, which don't change as the user flips between strata. The ones that
            // renderChartsInPolymorphismDialog saved on the canvas come from the catalog row's interval, so for another
            // interval they're computed from that interval's unstratified values instead, so that its alleles outside
            // the catalog interval's range still show.
            // The purity and methylation heatmaps share their ranges, and their catalog columns can describe different
            // intervals (see getHprc256MethylationCatalogInterval), so they keep the saved ranges exactly when the default
            // interval is selected, which keeps the two charts' ranges the same.
            const parseSavedRange = (value) => value != null ? parseFloat(value) : null
            const isShowingAnotherIntervalThanTheSavedRanges = cfg.chartType === 'sizeAndValueHeatmap'
                ? !!GLOBAL_PAGE_STATE['hprc256_interval'] : usingNonDefaultInterval
            fixedRanges = isShowingAnotherIntervalThanTheSavedRanges
                ? await computeHprc256FixedRangesForInterval(chartKind, mainCatalogRow.LocusId, activeInterval)
                : {
                    minAlleleSize: parseSavedRange(canvasEl.dataset.fixedMinAlleleSize),
                    maxAlleleSize: parseSavedRange(canvasEl.dataset.fixedMaxAlleleSize),
                    maxCount: parseSavedRange(canvasEl.dataset.fixedMaxCount),
                    minX: parseSavedRange(canvasEl.dataset.fixedMinX),
                    maxX: parseSavedRange(canvasEl.dataset.fixedMaxX),
                }
        } catch (error) {
            console.error(`Failed to load the HPRC256 ${chartKind} chart data:`, error)
            // Clear the chart rather than leave the previous selection's data under the new selection
            if (controlsEl.__hprc256InFlightToken === myToken) {
                destroyExistingChart(canvasEl)
                emptyNoteEl.style.display = 'none'
                errorNoteEl.style.display = 'inline'
            }
            return
        }

        // Stale-fetch guard: if a newer call superseded this one while the
        // BigQuery fetch was in flight, skip the chart update so the rendered
        // data always matches the latest dropdown state.
        if (controlsEl.__hprc256InFlightToken !== myToken) return

        errorNoteEl.style.display = 'none'
        const safeString = histogramString || ''
        emptyNoteEl.style.display = safeString ? 'none' : 'inline'
        // With no data there is nothing to draw (the purity and methylation heatmaps would throw on an empty dataset)
        if (!safeString) {
            destroyExistingChart(canvasEl)
            return
        }

        // The reference allele size comes from the catalog row, so it describes the catalog's interval. For another
        // interval, whose alleles are measured over a different span, the chart shows no reference allele.
        const refAlleleSize = usingNonDefaultInterval ? null : parseInt(canvasEl.dataset.refAlleleSize)
        const sharedOpts = {
            thisObj: canvasEl, refAlleleSize,
            axisUnits: canvasEl.dataset.axisUnits,
            chartWidth: canvasEl.dataset.chartWidth, chartHeight: canvasEl.dataset.chartHeight,
        }
        if (cfg.chartType === 'alleleHistogram') {
            const freqs = parseAlleleFrequenciesString(safeString)
            const sizes = freqs.map(f => f.size)
            createAlleleFrequencyChart({
                ...sharedOpts, frequencies: freqs,
                minAlleleSize: fixedRanges.minAlleleSize != null ? fixedRanges.minAlleleSize : (sizes.length ? Math.min(...sizes) : refAlleleSize),
                maxAlleleSize: fixedRanges.maxAlleleSize != null ? fixedRanges.maxAlleleSize : (sizes.length ? Math.max(...sizes) : refAlleleSize),
            })
        } else if (cfg.chartType === 'biallelicHistogram') {
            const data = parseBiallelicHistogramString(safeString)
            createBiallelicHistogramChart({
                ...sharedOpts, data,
                minAlleleSize: fixedRanges.minAlleleSize != null ? fixedRanges.minAlleleSize : (data.length ? Math.min(...data.map(f => Math.min(f.x, f.y))) : refAlleleSize),
                maxAlleleSize: fixedRanges.maxAlleleSize != null ? fixedRanges.maxAlleleSize : (data.length ? Math.max(...data.map(f => Math.max(f.x, f.y))) : refAlleleSize),
                fixedMaxCount: fixedRanges.maxCount,
            })
        } else {
            createSizeAndValueHeatmapChart({
                data: parseSizeAndValueDistributionString(safeString),
                thisObj: canvasEl,
                chartWidth: canvasEl.dataset.chartWidth,
                yAxisLabel: canvasEl.dataset.yAxisLabel,
                fixedMinX: fixedRanges.minX,
                fixedMaxX: fixedRanges.maxX,
                fixedMaxCount: fixedRanges.maxCount,
            })
        }
    }

    // The fixed axis and color ranges of a stratified chart for one of the locus's intervals other than the catalog
    // row's. They are computed the way renderChartsInPolymorphismDialog computes them from the catalog row, but from that
    // interval's unstratified ("All") values. Returns {minAlleleSize, maxAlleleSize, maxCount} for the allele histograms
    // and genotype heatmaps, {minX, maxX, maxCount} for the purity and methylation heatmaps, or {} if there is no data.
    const computeHprc256FixedRangesForInterval = async (chartKind, locusId, interval) => {
        if (HPRC256_STRATIFIED_CHARTS[chartKind].chartType === 'sizeAndValueHeatmap') {
            // The purity and methylation heatmaps share one range, as in computeHprc256GlobalRanges
            const [purityRow, methylationRow] = await Promise.all([
                fetchHprc256StratifiedRow('purity', locusId, interval),
                fetchHprc256StratifiedRow('methylation', locusId, interval),
            ])
            const range = computeSizeAndValueRange(
                purityRow && purityRow.AlleleSizeAndPurityDistribution,
                methylationRow && methylationRow.AlleleSizeAndMethylationDistribution)
            return range ? {minX: range.xMin, maxX: range.xMax, maxCount: range.maxCount} : {}
        }
        const lpsRow = await fetchHprc256StratifiedRow(chartKind, locusId, interval)
        const range = lpsRow && computeAlleleSizeRange(lpsRow.BiallelicHistogram, lpsRow.AlleleSizeHistogram)
        if (!range) return {}
        return {
            minAlleleSize: range.xMin,
            maxAlleleSize: range.xMax,
            maxCount: lpsRow.BiallelicHistogram
                ? computeGenotypeHeatmapMaxCount(lpsRow.BiallelicHistogram, range.xMin, range.xMax)
                : null,
        }
    }

    const parseAlleleFrequenciesString = (frequenciesString) => {
        if (!frequenciesString) return []
        try {
            const data = []
            const items = frequenciesString.split(',')
            for (let i = 0; i < items.length; i++) {
                const [size, count] = items[i].split(':')
                data.push({
                    size: parseInt(size.replace('x', '')),
                    count: parseInt(count)
                })
            }
            return data
        } catch (e) {
            console.error('Error parsing allele frequencies string:', e)
            return []
        }
    }

    const parseRepeatMaskerIntervals = (repeatMaskerIntervals) => {
        if (!repeatMaskerIntervals) {
            return ''
        }

        let values = new Set()
        let count = 0
        let details = []
        for (let token of repeatMaskerIntervals.split(', ')) {
            const tokenEntries = token.split(':')
            if (!['Simple_repeat', 'Low_complexity'].includes(tokenEntries[0])) {
                values.add(tokenEntries[0])
                count += 1
                details.push(`<span style='font-family: monospace'>${tokenEntries[0]}: ${tokenEntries[1]}</span>`)
            }
        }

        if (count == 0) {
            return ''
        }

        return `<span class="show-popup action-link" data-html="${details.join('<br />')}">${Array.from(values).join(', ')}</span>`
    }

    const parseNonCodingAnnotations = (ncAnnot) => {
        if (!ncAnnot) {
            return ''
        }

        const descriptions = {'uce': 'original UCE defined list (human-mouse-rat 100% sequence identity  >= 200bp), lifted over from hg19',
            'cFootprint_primate': 'evidence for TF binding for constrained primate elements (should be more constrained than mammals)',
            'uce_primate': 'ultra conserved in primates at least 20 bp',
            'har': 'elements conserved in mammals but enriched for fixed changes in human only - could be either depleted or enriched for SVs in humans; liftover hg18 -> hg38',
            'zoonomia_tfbs': 'zoonomia constrained tfbs',
            'zooHAR': 'zoonomia human accelerated regions',
            'zooCHAR': 'zoonomia chimp-human accelerated regions',
            'ucne': '18 species conserved, more permissive than UCE.481',
            'fetal_cortex_enh_gw18': '24,218 enhancers in GW18 cortex MPRA (psychencode2)',
            'fetal_cortex_sil_gw18': '2,783 silencers in GW18 cortex MPRA (psychencode2)',
            'TF_footprints': 'fetal_TF_footprint',
            'PROcap': 'neuro_procap_enh',
            'en3_dnase_k4m3_ctcf': 'encode3 DNase-H3K4me3-CTCF',
            'en3_dnase_k4m3': 'encode3 DNase-H3K4me3',
            'en3_pLS_ctcf': 'encode3 pLS-CTCF',
            'en3_pLS': 'encode3 pLS',
            'UCSC_TF_ChIP': 'UCSC table browser query on encTfChipPkENCFF730MQM',
            'vista': 'VISTA enhancer core element - positive',
            'abc_loeuf_0.15': 'same as abc_0.015 + any target gene loeuf < 0.35',
            'abc_pHaplo_0.9': 'ABC score >= 0.015 + any target gene pHaplo > 0.9',
            'abc_pTriplo_0.84': 'ABC score >= 0.015 + any target gene pTriplo > 0.84'}
        
        // add popup with description (if it exists) of each non-coding annotation
        return ncAnnot.split(',').map(k => {
            k = k.trim()
            const description = descriptions[k]
            if (description) {
                return `<span class="show-popup action-link" data-position="top center" data-html="${escapeHtmlText(`<div style='min-width: 200px'>${escapeHtmlText(description)}</div>`)}">${k}</span>`
            }
            return k
        }).join(', ')
    }

    const showTruncatedSequence = (sequence, truncateAt=12, showSize=true, leftTruncate=false, addBpSuffix=false) => {
        // The index-page SELECT nulls ReferenceRepeatSequence when it is longer than 10,000 bp
        // (`CASE WHEN LENGTH(col) <= 10000`); return empty so renderers don't crash on null.
        if (sequence == null) return ''
        let sequenceSizeString = ''
        if (showSize) {
            sequenceSizeString += `(${sequence.length}${addBpSuffix? 'bp' : ''})`
        }
        if (sequence.length > truncateAt) {
            let result = `<span class="show-popup action-link" style="white-space: nowrap" data-html="<span style='font-family: monospace'>${sequence.replace(/.{1,100}/g, chunk => chunk + ' ')}</span>">`
            if (leftTruncate) {
                const truncatedSequence = sequence.substring(sequence.length - truncateAt, sequence.length)
                result += `<span style="font-family: monospace">${sequenceSizeString}</span> &nbsp; ...${truncatedSequence}`
            } else {
                const truncatedSequence = sequence.substring(0, truncateAt)
                result += `<span style="font-family: monospace">${truncatedSequence}</span>... &nbsp; ${sequenceSizeString}`
            }
            result += `</span>`
            return result
        } else {
            let result = `<span style="white-space: nowrap">`
            if (leftTruncate) {
                result += `${sequenceSizeString} &nbsp; <span style="font-family: monospace">${sequence}</span>`
            } else {
                result += `<span style="font-family: monospace">${sequence}</span> &nbsp; ${sequenceSizeString}`
            }
            result += `</span>`
            return result
        }
    }


    const getGeneRegionColumnValue = (geneRegion) => {
        if (!geneRegion) return ''
        const regionRename = {
            'CDS': 'coding',
        }
        return `${regionRename[geneRegion] || geneRegion}`
    }

    const getPolymorphismSummaryColumnValue = (row) => {
        return `<span class="cell-in-polymorphism-column">
            <span class="action-link">
                <b>σ<sub>${STDEV_SIGMA_SUBSCRIPTS['HPRC256_Stdev']}</sub></b>
            </span>
            <span style="color: #333;">
                = ${row.HPRC256_Stdev != null ? row.HPRC256_Stdev.toFixed(1) : '<span style="color: #888888;">not available</span>'} &nbsp; &nbsp;
            </span>
            ${row.AoU1027_Stdev != null ? `<span class="action-link">σ<sub>${STDEV_SIGMA_SUBSCRIPTS["AoU1027_Stdev"]}</sub></span>
            <span style="color: #333;">
                = ${row.AoU1027_Stdev.toFixed(1)} &nbsp; &nbsp;
            </span>` : ''}
            <span class="action-link">
                ${['HPRC256TotalLength_Stdev', 'TenK10K_Stdev', 'StdevFromIllumina174k', 'StdevFromT2TAssemblies']
                    .filter(column => row[column] != null)
                    .map(column => `σ<sub>${STDEV_SIGMA_SUBSCRIPTS[column]}</sub>`).join('  ')}
            </span>
        </span>
        `
    }

    const SUMMARY_STATS_DATASETS = [
        { prefix: 'HPRC256_', name: 'HPRC256:LPS', description: '256 long-read PacBio samples from HPRC genotyped using TRGT-LPS' },
        { prefix: 'HPRC256TotalLength_', name: 'HPRC256:Length', description: 'The same 256 HPRC samples, using the total length of each TRGT allele (of the whole variation cluster for a locus in one)' },
        { prefix: 'AoU1027_', name: 'AoU1027:LPS', description: '1,027 long-read PacBio samples from AoU genotyped using TRGT-LPS', hideColumns: ['UniqueAlleleLengths'] },
        { prefix: 'TenK10K_', name: 'TenK10K Phase 1', description: '1,925 short-read samples from TenK10K genotyped using ExpansionHunter' },
    ]

    // Format number: show as integer (with commas) if it's a whole number, otherwise show 1 decimal place
    const formatIntOrDecimal = (v) => v == null ? '-' : (Number.isInteger(v) ? v.toLocaleString() : v.toFixed(1))

    // Color used to de-emphasize exact-zero numeric values so they read as noticeably
    // lighter than non-zero values (but stay visible, rather than rendering as a blank cell).
    const NUMERIC_ZERO_COLOR = '#aaaaaa'
    // Wrap `formatted` in a gray span when the underlying numeric value is exactly 0.
    const grayIfZero = (value, formatted) => Number(value) === 0
        ? `<span style="color: ${NUMERIC_ZERO_COLOR};">${formatted}</span>`
        : `${formatted}`

    const SUMMARY_STATS_COLUMNS = [
        { suffix: 'MinAllele', header: 'Min', format: formatIntOrDecimal, highlight: true },
        { suffix: 'Median', header: 'Median', format: formatIntOrDecimal, highlight: true },
        { suffix: '99thPercentile', header: '99th %', format: formatIntOrDecimal, highlight: true },
        { suffix: 'MaxAllele', header: 'Max', format: formatIntOrDecimal, highlight: true },
        { suffix: 'UniqueAlleleLengths', header: 'Unique Allele Lengths', format: (v) => v != null ? v.toLocaleString() : '-' },
        { suffix: 'NumCalledAlleles', header: 'Total Genotyped Alleles', format: (v) => v != null ? v.toLocaleString() : '-' },
        { suffix: 'ModeAllele', header: 'Mode', format: formatIntOrDecimal, highlight: true },
        { suffix: 'Stdev', header: 'Stdev', format: (v) => v?.toFixed(2) ?? '-', highlight: true },
    ]

    // The label of an HPRC256 interval: a variation cluster when the interval has a variation cluster id, or else a
    // standalone TR
    const describeHprc256Interval = (interval, variationClusterId) => variationClusterId
        ? `Variation cluster ${interval}`
        : `Standalone TR ${interval}`

    // A generateSummaryStatsTable dataset for a stratified-LPS row's per-interval summary stats, which are mapped onto
    // the HPRC256_* catalog-row shape (sourceRow) so the table renders them without duplicating column-handling logic.
    // ``showIntervalInName`` controls whether the dataset's "Dataset" column carries the interval label (true when
    // multiple HPRC256 rows are about to be rendered side-by-side; false when only one HPRC256 row exists and the label
    // would be redundant).
    const buildHprc256IntervalDatasetRow = (stratifiedRow, showIntervalInName) => {
        return {
            prefix: 'HPRC256_',
            // Only annotate the dataset name with the interval when multiple HPRC256
            // rows are present — otherwise it's redundant clutter.
            name: showIntervalInName
                ? `HPRC256:LPS — ${describeHprc256Interval(stratifiedRow['Interval'] || '?', stratifiedRow['VC'])}`
                : 'HPRC256:LPS',
            description: showIntervalInName
                ? 'Per-interval stats from the HPRC256 stratified LPS table'
                : SUMMARY_STATS_DATASETS.find(d => d.prefix === 'HPRC256_').description,
            sourceRow: {
                HPRC256_MinAllele: stratifiedRow['Min'],
                HPRC256_Median: stratifiedRow['Median'],
                HPRC256_99thPercentile: stratifiedRow['99thPercentile'],
                HPRC256_MaxAllele: stratifiedRow['Max'],
                HPRC256_UniqueAlleleLengths: stratifiedRow['UniqueAlleleLengths'],
                HPRC256_NumCalledAlleles: stratifiedRow['NumCalledAlleles'],
                HPRC256_ModeAllele: stratifiedRow['Mode'],
                HPRC256_Stdev: stratifiedRow['Stdev'],
            },
        }
    }

    // The "Constraint (O/E Length) percentile" line with its help icon, in a div with the given style
    const buildConstraintPercentileHtml = (row, divStyle, iconLeftMargin) => `
        <div style="${divStyle}">
            Constraint (O/E Length) percentile = ${((100*row.AoU1027_OE_LengthPercentile).toFixed(1))}% <i class="question circle icon link" style="margin-left: ${iconLeftMargin};" data-html="${escapeHtmlText(RESULTS_TABLE_COLUMN_HELP_TEXTS['AoU1027_OE_LengthPercentile'])}"></i>
        </div>
    `

    const generateSummaryStatsTable = (row, hprc256IntervalRows) => {
        // hprc256IntervalRows is optional; when provided (lazy-fetched per-(LocusId, Interval) rows
        // from the stratified LPS BQ table) the HPRC256 dataset is split into one row per interval,
        // replacing the single catalog-driven HPRC256 row. The interval label is shown inside the
        // "Dataset" column only when there are multiple HPRC256 rows side-by-side.
        const useIntervalRows = Array.isArray(hprc256IntervalRows) && hprc256IntervalRows.length > 0
        const showIntervalInName = useIntervalRows && hprc256IntervalRows.length > 1
        const datasets = useIntervalRows
            ? [
                ...hprc256IntervalRows.map(stratifiedRow => buildHprc256IntervalDatasetRow(stratifiedRow, showIntervalInName)),
                ...SUMMARY_STATS_DATASETS.filter(d => d.prefix !== 'HPRC256_'),
            ]
            : SUMMARY_STATS_DATASETS

        // Check if any dataset has Stdev data. Read from sourceRow when present
        // (per-interval mode), otherwise from the catalog row.
        const datasetHasStdev = (dataset) => (dataset.sourceRow || row)[dataset.prefix + 'Stdev'] != null
        const hasAnyData = datasets.some(datasetHasStdev)

        if (!hasAnyData) {
            return ''
        }

        let html = `<div style="border-top: 1px dashed #ccc; padding: 23px 20px 15px 15px;">`
        html += `<div style="position: relative; margin-bottom: 15px;"><div style="text-align: center;"><span style="font-weight: bold">Allele Frequency Distribution Summary Statistics</span></div><div style="position: absolute; right: 0; top: 0;"><span style="display: inline-block; width: 14px; height: 14px; background-color: #e8f4fc; border: 1px solid #888; vertical-align: middle;"></span> = number of repeats</div></div>`
        html += `<table class="ui compact celled table" style="font-size: 0.95em;">`

        // Header row
        html += `<thead><tr><th>Dataset</th>`
        for (const col of SUMMARY_STATS_COLUMNS) {
            html += `<th style="text-align: center;">${col.header}</th>`
        }
        html += `</tr></thead>`

        // Data rows
        html += `<tbody>`
        const unavailableDatasets = []
        for (const dataset of datasets) {
            const sourceRow = dataset.sourceRow || row
            if (!datasetHasStdev(dataset)) {
                unavailableDatasets.push(dataset.name)
                continue
            }

            html += `<tr>`
            html += `<td style="white-space: nowrap;"><b>${dataset.name}</b><br/><span style="font-size: 0.85em; color: #666;">${dataset.description}</span></td>`
            for (const col of SUMMARY_STATS_COLUMNS) {
                const isHidden = dataset.hideColumns?.includes(col.suffix)
                const value = isHidden ? null : sourceRow[dataset.prefix + col.suffix]
                const bgStyle = col.highlight ? 'background-color: #e8f4fc;' : ''
                html += `<td style="text-align: center; ${bgStyle}">${col.format(value)}</td>`
            }
            html += `</tr>`
        }

        // Add row for unavailable datasets
        if (unavailableDatasets.length > 0) {
            const numCols = SUMMARY_STATS_COLUMNS.length + 1
            html += `<tr><td colspan="${numCols}" style="text-align: left; color: #686868;">${unavailableDatasets.join(', ')} data is not available for this locus</td></tr>`
        }

        html += `</tbody></table>`

        // Add constraint percentile if available
        if (row.AoU1027_OE_LengthPercentile != null) {
            html += buildConstraintPercentileHtml(row, 'margin-top: 15px; text-align: center;', '10px')
        }

        html += `</div>`
        return html
    }

    // A note for a locus whose methylation data come from another interval than its narrowest one, which the interval
    // selector shows as the default
    const describeHprc256MethylationInterval = (row) => {
        const methylationInterval = row['HPRC256_MethylationInterval']
        return methylationInterval && methylationInterval !== row['HPRC256_NarrowestInterval']
            ? `<br />There are no methylation calls at ${row['HPRC256_NarrowestInterval']} for this locus, so by default this heatmap shows the ones at ${methylationInterval}`
            : ''
    }

    // Added to the subtitle of the HPRC256 total allele length charts of a locus in a variation cluster, whose values
    // describe the whole cluster
    const describeHprc256TotalLengthInterval = (row) => {
        const interval = row['HPRC256TotalLength_Interval']
        const { chrom, start_0based, end_1based } = parseAndNormalizeLocusId(row['LocusId'])
        return interval && interval !== `${chrom}:${start_0based}-${end_1based}`
            ? `<br />This locus is part of the variation cluster ${interval}, so these sizes are the total length of the whole cluster divided by the motif length of this locus`
            : ''
    }

    // The hg38 reference allele size, in repeats, that a chart of this column should mark: for the HPRC256 total allele
    // length charts, the reference length of HPRC256TotalLength_Interval (the whole variation cluster for a locus in
    // one) divided by the motif length, since that is what their sizes measure
    const getReferenceAlleleSizeForColumn = (row, columnName) => {
        if (columnName.startsWith('HPRC256TotalLength_') && row['HPRC256TotalLength_Interval']) {
            return Math.floor(computeIntervalSize(row['HPRC256TotalLength_Interval']) / row['ReferenceMotif'].length)
        }
        // The HPRC256 (LPS) alleles are each one's longest pure segment, so the reference is measured the same way
        if (['HPRC256_AlleleHistogram', 'HPRC256_BiallelicHistogram'].includes(columnName)
                && row['HPRC256_ReferenceLPSRepeatCount'] != null) {
            return row['HPRC256_ReferenceLPSRepeatCount']
        }
        return row['NumRepeatsInReference']
    }

    // The stratum dropdowns under a chart, for the main-table columns that have a stratified table
    const renderHprc256StratumControlsForColumn = (columnName) => HPRC256_STRATIFIED_CHART_KIND_BY_MAIN_COLUMN[columnName]
        ? renderHprc256StratumControls(HPRC256_STRATIFIED_CHART_KIND_BY_MAIN_COLUMN[columnName])
        : ''

    const generatePolymorphismDialogContent = (row, options = {}) => {
        const { showSigmaSummary = true } = options
        const yAxisLabelBySizeAndValueDistColumn = {
            'HPRC256_AlleleSizeAndPurityDistribution': 'TRGT Allele Purity',
            'HPRC256_AlleleSizeAndMethylationDistribution': 'TRGT Allele Methylation',
        }

        const nStdevsNotAvailable = ALL_STDEV_COLUMNS.filter(key => row[key] == null).length

        let polymorphismDialogContent1 = `<div class="content info-font-size" style="text-align: center">`

        // Summary statistics section (sigma values) - only show if showSigmaSummary is true
        if (showSigmaSummary && nStdevsNotAvailable < ALL_STDEV_COLUMNS.length) {
            polymorphismDialogContent1 += `
                <div><span style="font-weight: bold">Allele Frequency Distribution Summary Statistics</span></div>
                <div style="margin-top: 5px">
                    <table style="margin: 0 auto">
            `
            for (const key of ALL_STDEV_COLUMNS) {
                if (row[key] != null) {
                    polymorphismDialogContent1 += `
                        <tr>
                            <td style="text-align: left;">
                                <span style="font-size: 1.2em;">σ<sub style="font-size: 0.7em;">${STDEV_SIGMA_SUBSCRIPTS[key]}</sub></span>
                            </td>
                            <td style="text-align: right;">
                                = ${row[key].toFixed(3)}
                            </td>
                            <td style="text-align: right;">
                                <i class="question circle icon link" style="margin-left: 15px;" data-html="${escapeHtmlText(STDEV_HELP_TEXTS[key])}"></i>
                            </td>
                        </tr>
                    `
                }
            }
            polymorphismDialogContent1 += `</table>`

            if (nStdevsNotAvailable > 0) {
                polymorphismDialogContent1 += `<br />`
                let namesOfMissingSigmas = []
                for (const key of ALL_STDEV_COLUMNS) {
                    if (row[key] == null) {
                        namesOfMissingSigmas.push(`<span style="font-size: 1.2em;">σ<sub style="font-size: 0.7em;">${STDEV_SIGMA_SUBSCRIPTS[key]}</sub></span>`)
                    }
                }
                polymorphismDialogContent1 += ` ${namesOfMissingSigmas.join(' &amp; ')} ${namesOfMissingSigmas.length > 1 ? 'are' : 'is'} not available for this locus`
            }

            if (row.AoU1027_OE_LengthPercentile != null) {
                polymorphismDialogContent1 += buildConstraintPercentileHtml(row, 'margin-top: 25px', '15px')
            }

            polymorphismDialogContent1 += `</div>`
        } else if (showSigmaSummary) {
            polymorphismDialogContent1 += `<span style="color: #686868;">No polymorphism data available</span><br /><br />`
        }

        // A section of charts, with one panel (title, subtitle, chart and stratum controls) per column that has data
        const renderChartSection = (columns, renderCanvas) => {
            // An empty string means no data, as in renderAlleleSizeCharts
            const columnsWithData = columns.filter(columnName => row[columnName])
            if (columnsWithData.length === 0) return ''
            return `
                <div style="margin-top: 15px;">
                    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px">
                ${columnsWithData.map(columnName => `
                        <div style="border-top: 1px dashed #ccc; padding: 23px 20px 15px 15px;">
                            <div style="margin-bottom: 5px;"><b>${ALLELE_FREQUENCY_CHART_TITLES[columnName]}</b><br /><span style="color: #686868;">${ALLELE_FREQUENCY_CHART_SUBTITLES[columnName]}${columnName.startsWith('HPRC256TotalLength_') ? describeHprc256TotalLengthInterval(row) : ''}${columnName === 'HPRC256_AlleleSizeAndMethylationDistribution' ? describeHprc256MethylationInterval(row) : ''}</span></div>
                            ${renderCanvas(columnName)}
                            ${renderHprc256StratumControlsForColumn(columnName)}
                        </div>
                `).join('')}
                    </div>
                </div>`
        }
        const renderHistogramCanvas = (canvasClass) => (columnName) =>
            `<canvas class="${canvasClass}" data-frequencies-column="${columnName}" data-ref-allele-size="${getReferenceAlleleSizeForColumn(row, columnName)}" data-axis-units="${AXIS_UNITS[columnName]}" data-chart-width="500px" data-chart-height="200px" style="width: 100%; height: 100px;"></canvas>`

        polymorphismDialogContent1 += renderChartSection(
            Object.keys(STDEV_COLUMN_BY_ALLELE_HISTOGRAM_COLUMN), renderHistogramCanvas('allele-frequency-chart'))
        polymorphismDialogContent1 += renderChartSection(
            BIALLELIC_HISTOGRAM_COLUMNS, renderHistogramCanvas('biallelic-histogram-chart'))
        polymorphismDialogContent1 += renderChartSection(
            Object.keys(yAxisLabelBySizeAndValueDistColumn), (columnName) =>
                `<canvas class="size-and-value-dist-chart" data-frequencies-column="${columnName}" data-y-axis-label="${yAxisLabelBySizeAndValueDistColumn[columnName]}" data-chart-width="500px" style="width: 100%; height: 100px;"></canvas>`)

        polymorphismDialogContent1 += '</div>'
        return polymorphismDialogContent1
    }


    // Returns {xMin, xMax} of the allele sizes in a dataset's unstratified genotype heatmap, or in its allele histogram
    // if it has no heatmap data, or null if it has neither
    const computeAlleleSizeRange = (biallelicHistogramString, alleleHistogramString) => {
        if (biallelicHistogramString) {
            const data = parseBiallelicHistogramString(biallelicHistogramString)
            if (data.length > 0) {
                const allSizes = data.flatMap(d => [d.x, d.y])
                return {xMin: Math.min(...allSizes), xMax: Math.max(...allSizes)}
            }
        }
        if (alleleHistogramString) {
            const sizes = parseAlleleFrequenciesString(alleleHistogramString).map(f => f.size)
            if (sizes.length > 0) {
                return {xMin: Math.min(...sizes), xMax: Math.max(...sizes)}
            }
        }
        return null
    }

    // The largest count in a genotype heatmap that shows allele sizes from minAlleleSize to maxAlleleSize, after binning
    // the genotypes the same way createBiallelicHistogramChart does
    const computeGenotypeHeatmapMaxCount = (biallelicHistogramString, minAlleleSize, maxAlleleSize) => {
        const binnedData = binGenotypeCounts(
            parseBiallelicHistogramString(biallelicHistogramString), minAlleleSize, maxAlleleSize).data
        return binnedData.length > 0 ? Math.max(...binnedData.map(d => d.v)) : 1
    }

    // Returns {xMin, xMax, maxCount} of the repeat counts and cell counts in the unstratified purity and methylation
    // heatmaps combined, or null if neither has data
    const computeSizeAndValueRange = (purityDistributionString, methylationDistributionString) => {
        const combined = parseSizeAndValueDistributionString(purityDistributionString)
            .concat(parseSizeAndValueDistributionString(methylationDistributionString))
        if (combined.length === 0) return null
        const xs = combined.map(d => d.x)
        return {xMin: Math.min(...xs), xMax: Math.max(...xs), maxCount: Math.max(...combined.map(d => d.v))}
    }

    // Which of computeHprc256GlobalRanges's allele size ranges each HPRC256 allele histogram and genotype heatmap uses
    const HPRC256_ALLELE_SIZE_RANGE_KEY_BY_COLUMN = {
        'HPRC256_AlleleHistogram': 'lps',
        'HPRC256_BiallelicHistogram': 'lps',
        'HPRC256TotalLength_AlleleHistogram': 'totalLength',
        'HPRC256TotalLength_BiallelicHistogram': 'totalLength',
    }

    // Compute the global (unstratified) HPRC256 plot ranges so the LPS and total allele length charts
    // (Allele Frequencies + Genotype Heatmap) and the repeat-count-based heatmaps
    // (Allele Purity + Methylation) keep a fixed axis/color scale when users change
    // the Population/Sex stratum.
    const computeHprc256GlobalRanges = (row) => ({
        lps: computeAlleleSizeRange(row.HPRC256_BiallelicHistogram, row.HPRC256_AlleleHistogram),
        totalLength: computeAlleleSizeRange(row.HPRC256TotalLength_BiallelicHistogram, row.HPRC256TotalLength_AlleleHistogram),
        repeat: computeSizeAndValueRange(row.HPRC256_AlleleSizeAndPurityDistribution, row.HPRC256_AlleleSizeAndMethylationDistribution),
    })

    const renderChartsInPolymorphismDialog = (row) => {

        const hprc256Globals = computeHprc256GlobalRanges(row)

        // Draws one kind of allele size chart (the allele histograms or the genotype heatmaps). Each HPRC256 chart uses its
        // dataset's allele size range, from its genotype heatmap, so the allele histogram's axis matches the heatmap's.
        // The range is saved on the canvas so it stays the same when the user picks another population or sex. The other
        // charts share the range of all of them.
        //
        // Args:
        //   canvasSelector: selector of the chart canvases
        //   parseChartValues: (column value) -> the chart's data fields, eg. {frequencies}
        //   getAlleleSizes: (the chart's data fields) -> the allele sizes in its data
        //   createChart: (chart data) -> draws the chart
        const renderAlleleSizeCharts = (canvasSelector, parseChartValues, getAlleleSizes, createChart) => {
            const chartDataList = []
            $(canvasSelector).each(function() {
                const frequenciesColumn = $(this).data('frequencies-column')
                if (!row[frequenciesColumn]) return   // Skip if no data

                const chartValues = parseChartValues(row[frequenciesColumn])
                const alleleSizes = getAlleleSizes(chartValues)
                chartDataList.push({
                    ...chartValues,
                    frequenciesColumn: frequenciesColumn,
                    thisObj: this,
                    refAlleleSize: $(this).data('ref-allele-size'),
                    axisUnits: $(this).data('axis-units'),
                    chartWidth: $(this).data('chart-width'),
                    chartHeight: $(this).data('chart-height'),
                    minAlleleSize: Math.min(...alleleSizes),
                    maxAlleleSize: Math.max(...alleleSizes),
                    fixedRange: hprc256Globals[HPRC256_ALLELE_SIZE_RANGE_KEY_BY_COLUMN[frequenciesColumn]],
                })
            })

            const otherChartDataList = chartDataList.filter(d => !(d.frequenciesColumn in HPRC256_ALLELE_SIZE_RANGE_KEY_BY_COLUMN))
            const sharedMinAlleleSize = otherChartDataList.length > 0 ? Math.min(...otherChartDataList.map(d => d.minAlleleSize)) : 0
            const sharedMaxAlleleSize = otherChartDataList.length > 0 ? Math.max(...otherChartDataList.map(d => d.maxAlleleSize)) : 0

            for (const chartData of chartDataList) {
                if (chartData.fixedRange) {
                    chartData.minAlleleSize = chartData.fixedRange.xMin
                    chartData.maxAlleleSize = chartData.fixedRange.xMax
                    chartData.thisObj.dataset.fixedMinAlleleSize = chartData.fixedRange.xMin
                    chartData.thisObj.dataset.fixedMaxAlleleSize = chartData.fixedRange.xMax
                } else {
                    chartData.minAlleleSize = sharedMinAlleleSize
                    chartData.maxAlleleSize = sharedMaxAlleleSize
                }
                createChart(chartData)
            }
        }

        renderAlleleSizeCharts(
            '.allele-frequency-chart',
            (frequenciesString) => ({frequencies: parseAlleleFrequenciesString(frequenciesString)}),
            ({frequencies}) => frequencies.map(f => f.size),
            createAlleleFrequencyChart)

        renderAlleleSizeCharts(
            '.biallelic-histogram-chart',
            (frequenciesString) => ({data: parseBiallelicHistogramString(frequenciesString)}),
            ({data}) => data.flatMap(d => [d.x, d.y]),
            (chartData) => {
                // An HPRC256 heatmap's color scale is fixed too, at its largest binned count, so it stays the same when
                // the user picks another population or sex
                if (chartData.fixedRange) {
                    chartData.fixedMaxCount = computeGenotypeHeatmapMaxCount(
                        row[chartData.frequenciesColumn], chartData.minAlleleSize, chartData.maxAlleleSize)
                    chartData.thisObj.dataset.fixedMaxCount = chartData.fixedMaxCount
                }
                createBiallelicHistogramChart(chartData)
            })

        $('.size-and-value-dist-chart').each(function() {
            const frequenciesColumn = $(this).data('frequencies-column')
            const frequenciesString = row[frequenciesColumn]
            if (!frequenciesString) return

            const data = parseSizeAndValueDistributionString(frequenciesString)
            const chartArgs = {
                data: data,
                thisObj: this,
                chartWidth: $(this).data('chart-width'),
                yAxisLabel: $(this).data('y-axis-label'),
            }
            if (hprc256Globals.repeat) {
                chartArgs.fixedMinX = hprc256Globals.repeat.xMin
                chartArgs.fixedMaxX = hprc256Globals.repeat.xMax
                chartArgs.fixedMaxCount = hprc256Globals.repeat.maxCount
                this.dataset.fixedMinX = hprc256Globals.repeat.xMin
                this.dataset.fixedMaxX = hprc256Globals.repeat.xMax
                this.dataset.fixedMaxCount = hprc256Globals.repeat.maxCount
            }
            createSizeAndValueHeatmapChart(chartArgs)
        })

        $('.hprc256-stratum-controls').each(function() {
            const controlsEl = this
            $(controlsEl).find('.hprc256-pop-select, .hprc256-sex-select').on('change', () => handleHprc256DropdownChange(controlsEl, row))
            const cfg = HPRC256_STRATIFIED_CHARTS[controlsEl.dataset.chartKind]
            if (GLOBAL_PAGE_STATE[cfg.urlPopField] || GLOBAL_PAGE_STATE[cfg.urlSexField]) {
                handleHprc256DropdownChange(controlsEl, row)
            }
        })
    }


    function renderSmallDotPlot() {
        const leftFlank = $(this).data('left-flank')
        const repeatSeq = $(this).data('repeat-seq')
        const rightFlank = $(this).data('right-flank')
        const sequence = [leftFlank, repeatSeq, rightFlank].join('|')

        const pixelsPerCell = 2 // higher number increases resolution
        plotDotPlot(this, sequence, pixelsPerCell)
    }

    function addClickHandlerToShowDotPlotDialog() {
        const referenceRegion = $(this).data('reference-region')
        const referenceRegionSize = $(this).data('reference-region-size')
        const numRepeatsInReference = $(this).data('repeats-in-reference')
        const flankWidth = $(this).data('flank-width')
        const motif = $(this).data('motif')

        const leftFlank = $(this).data('left-flank')
        const repeatSeq = $(this).data('repeat-seq')
        const rightFlank = $(this).data('right-flank')
        const sequence = [leftFlank, repeatSeq, rightFlank].join('|')

        $(this).click(() => {
            $('#dot-plot-dialog-header').html(`${referenceRegion} locus: ${referenceRegionSize}bp repeat +/- ${flankWidth}bp flanks; ${numRepeatsInReference} x ${motif}`)

            const dotPlotPixelsPerCell = 10
            const dotPlotDialogCanvas = $('#dot-plot-dialog-canvas').get(0)
            const wasDotPlotDrawn = plotDotPlot(dotPlotDialogCanvas, sequence, dotPlotPixelsPerCell)
            $(dotPlotDialogCanvas).toggle(wasDotPlotDrawn)
            $('#dot-plot-dialog-dot-plot-not-drawn-message').toggle(!wasDotPlotDrawn)

            const dotPlotDialogPeriodicityPlotCanvas = $('#dot-plot-dialog-periodicity-plot-canvas').get(0)
            const periodicityPlotPixelsPerCell = 20
            const minRunLength = 5
            const endWithPeriod = Math.max(motif.length * 2, 12)
            const periodicityMatrix = plotPeriodicityPlot(
                dotPlotDialogPeriodicityPlotCanvas,
                sequence,
                periodicityPlotPixelsPerCell,
                minRunLength,
                endWithPeriod,
            )

            const barPlotDiv = $('#dot-plot-dialog-bar-plot').get(0)
            if (periodicityMatrix) {
                $(dotPlotDialogPeriodicityPlotCanvas).show()
                buildPeriodicityMatrixBarChart(barPlotDiv, periodicityMatrix)
            } else {
                $(dotPlotDialogPeriodicityPlotCanvas).hide()
                // Undo the bar chart layout that an earlier locus's histogram may have left on the container
                Object.assign(barPlotDiv.style, {display: 'block', height: 'auto', marginTop: '0'})
                barPlotDiv.textContent = 'This sequence is too long to draw a periodicity plot.'
            }

            $('#dot-plot-dialog-sequences').html(`
                    <table style="margin: 0 auto">
                    <tr><td><b>Left Flank:</b></td></tr>
                    <tr><td><span style="font-family: monospace">${leftFlank}</span></td></tr>
                    <tr><td><b>Repeat Sequence:</b></td></tr>
                    <tr><td><span style="font-family: monospace">${repeatSeq}</span></td></tr>
                    <tr><td><b>Right Flank:</b></td></tr>
                    <tr><td><span style="font-family: monospace">${rightFlank}</span></td></tr>
                    </table>
                `)
            $('#dot-plot-dialog').modal('show')
        })
    }

    const getAlleleHistogramColumnValue = (row, columnName) => {
        if (row[columnName] ) {
            return `<canvas class="allele-frequency-inline-chart cell-in-polymorphism-column" data-frequencies="${row[columnName]}" data-ref-allele-size="${getReferenceAlleleSizeForColumn(row, columnName)}" data-axis-units="${AXIS_UNITS[columnName]}" style="width: 100%; height: 100px"></canvas>`
        } else {
            let otherHistograms = ''
            for ( const c of ALL_STDEV_COLUMNS ) {
                if (row[c] != null) {
                    otherHistograms += `<span class="action-link">σ<sub>${STDEV_SIGMA_SUBSCRIPTS[c]}</sub></span>`
                }
            }

            let result = `<span class="cell-in-polymorphism-column"><span style="color: #888888; text-align: center; display: block; width: 100%;">`
            if (otherHistograms) {
                result += `not available (but has ${otherHistograms})`
            } else {
                result += `not available`
            }
            result += `</span></span>`
            return result
        }
    }

    // Returns the names sorted by the p-value in details[name].pvalue, most significant first. Names without a p-value
    // go last.
    const sortNamesByDetailPvalue = (names, details) => [...names].sort(
        (a, b) => (details[a]?.pvalue ?? Infinity) - (details[b]?.pvalue ?? Infinity))

    // eg. ['CD4_TCM', 'NK', 'B'] returns 'CD4_TCM (+2 more)'
    const formatFirstNameAndNumberOfOthers = (names) => names.length <= 1 ? names[0] : `${names[0]} (+${names.length - 1} more)`

    // A results table value that opens a popup with popupHtml when clicked. popupVariation is an optional Semantic UI
    // popup variation (a CSS class for the popup, e.g. 'wide').
    function buildCellValueWithPopup(cellHtml, popupHtml, popupVariation = '') {
        const variationAttribute = popupVariation ? ` data-variation="${popupVariation}"` : ''
        return `<span class="action-cell show-popup"${variationAttribute} data-html="${escapeHtmlText(popupHtml)}">${cellHtml}</span>`
    }

    // Parses a column that holds JSON, such as Tanudisastro2024_Details, or returns null (after logging the error) if it
    // can't be parsed. An empty column is read as jsonIfMissing.
    const parseJsonColumn = (row, columnName, jsonIfMissing = '{}') => {
        try {
            return JSON.parse(row[columnName] || jsonIfMissing)
        } catch (e) {
            console.error(`Failed to parse ${columnName}:`, e)
            return null
        }
    }

    // The source of the Tanudisastro2024_* sc-eTR columns, as a link
    const TANUDISASTRO_2026_LINK_HTML = '<a href="https://doi.org/10.1038/s41586-026-10438-2" target="_blank">Tanudisastro et al. 2026</a>'

    // The paper's tables give p = 0 for p-values too small for a double-precision number
    const formatScEtrPvalue = (pvalue) => pvalue === 0 ? '< 1e-300' : pvalue.toExponential(2)

    // A table of a locus's sc-eTR associations (the associations list in Tanudisastro2024_Details, one per cell type and
    // eGene, most significant first), followed by notes on the fine-mapping PIP (only when an association was
    // fine-mapped) and on the cell types in which the TR is also a caQTL. Used by the results table popup
    // (isCompactTable = true, which right-aligns the numbers) and the locus page.
    const buildScEtrTableHtml = (associations, caqtlCellTypes, isCompactTable) => {
        const numberCellStyle = isCompactTable ? ' style="text-align: right;"' : ''
        const showPipColumn = associations.some(a => a.fineMappingPIP != null)
        const rowsHtml = associations.map(a => `<tr>
                <td>${a.cellType}</td>
                <td>${a.eGene}</td>
                <td${numberCellStyle}>${formatScEtrPvalue(a.pvalue)}</td>
                <td${numberCellStyle}>${a.effectSize.toFixed(3)}</td>
                ${showPipColumn ? `<td${numberCellStyle}>${a.fineMappingPIP != null ? a.fineMappingPIP.toFixed(2) : ''}</td>` : ''}
            </tr>`).join('')
        let html = `<table class="ui compact${isCompactTable ? '' : ' striped'} table"${isCompactTable ? ' style="white-space: nowrap;"' : ''}>
            <thead><tr>
                <th>Cell Type</th><th>eGene</th><th${numberCellStyle}>P-value</th><th${numberCellStyle}>Effect Size</th>${showPipColumn ? `<th${numberCellStyle}>Fine-mapping PIP</th>` : ''}
            </tr></thead><tbody>${rowsHtml}</tbody></table>`
        const noteStyle = 'font-size: 0.9em; color: #666; margin-top: 8px;'
        if (showPipColumn) {
            html += `<div style="${noteStyle}">PIP: posterior inclusion probability from fine-mapping, i.e. the probability that this TR is the variant causing the expression change. The paper calls TRs with PIP ≥ 0.7 candidate causal.</div>`
        }
        if (caqtlCellTypes) {
            html += `<div style="${noteStyle}">Also a chromatin accessibility QTL (its length is associated with accessibility at a scATAC-seq peak within 10 kb) in: ${caqtlCellTypes.split(',').join(', ')}</div>`
        }
        return html
    }

    // The rows of a table of Manigbas 2024 PheWAS trait associations, one per trait, most significant first. The results
    // table popup's compact table (isCompactTable = true) right-aligns the numbers and shows replication as an icon. The
    // locus page's full table also shows -log10(p), and shows replication as Yes or No.
    const buildPheWASTableRowsHtml = (details, isCompactTable) => {
        const numberCellStyle = isCompactTable ? 'text-align: right;' : ''
        return sortNamesByDetailPvalue(Object.keys(details), details).filter(traitName => details[traitName]).map(traitName => {
            const d = details[traitName]
            const replicatedHtml = isCompactTable
                ? (d.replicatedInAoU
                    ? '<i class="check circle green icon" title="Replicated in All of Us"></i>'
                    : '<i class="minus circle grey icon" title="Not replicated"></i>')
                : (d.replicatedInAoU ? '<span style="color: green;">Yes</span>' : '<span style="color: gray;">No</span>')
            const caviarColor = d.caviarProbability >= 0.9 ? 'green' : (d.caviarProbability >= 0.5 ? 'orange' : '')
            return `<tr>
                <td>${traitName}</td>
                <td>${d.traitType || ''}</td>
                <td style="${numberCellStyle}">${d.pvalue != null ? d.pvalue.toExponential(isCompactTable ? 1 : 2) : ''}</td>
                ${isCompactTable ? '' : `<td>${d.log10Pvalue != null ? d.log10Pvalue.toFixed(1) : ''}</td>`}
                <td style="${numberCellStyle} color: ${caviarColor}; font-weight: ${caviarColor ? 'bold' : 'normal'};">
                    ${d.caviarProbability != null ? (d.caviarProbability * 100).toFixed(1) + '%' : ''}
                </td>
                <td style="${numberCellStyle}">${d.sampleSize != null ? d.sampleSize.toLocaleString() : ''}</td>
                <td>${replicatedHtml}</td>
            </tr>`
        }).join('')
    }

    function buildScEtrPopupContent(row) {
        const details = parseJsonColumn(row, 'Tanudisastro2024_Details')
        if (!details) return '<div>Error loading details</div>'

        let html = '<div style="overflow-x: auto;">'

        // tanudisastroLocusId is only there when the paper's locus differs from this one (matched by overlap)
        if (details.tanudisastroLocusId) {
            html += `<div style="background: #fff3cd; padding: 8px; margin-bottom: 10px; border-radius: 4px;">
                <i class="info circle icon"></i>
                <b>Note:</b> Matched via coordinate overlap.<br/>
                Original locus in Tanudisastro et al.: <code>${details.tanudisastroLocusId}</code>
            </div>`
        }

        html += buildScEtrTableHtml(details.associations, row['Tanudisastro2024_ChromatinAccessibilityCellTypes'], true)
        html += `<div style="font-size: 0.9em; color: #666; margin-top: 8px;">Source: ${TANUDISASTRO_2026_LINK_HTML}</div>`
        html += '</div>'

        return html
    }

    function buildPheWASPopupContent(row) {
        // Keyed by trait name
        const details = parseJsonColumn(row, 'Manigbas2024_Details')
        if (!details) return '<div>Error loading details</div>'

        // Only loci with associations get this popup, so details always has at least one trait
        let html = '<div style="overflow-x: auto;">'
        html += `<table class="ui compact table" style="white-space: nowrap;">
            <thead><tr>
                <th>Trait</th><th>Type</th><th style="text-align: right;">P-value</th><th style="text-align: right;">CAVIAR Prob</th><th style="text-align: right;">Sample Size</th><th>Replicated</th>
            </tr></thead><tbody>`
        html += buildPheWASTableRowsHtml(details, true)
        html += '</tbody></table>'

        html += `<div style="font-size: 0.9em; color: #666; margin-top: 8px;">
            Source: <a href="https://www.nature.com/articles/s41467-024-54678-0" target="_blank">Manigbas et al. 2024</a>
            (UK Biobank PheWAS, n=168,554)
        </div>`
        html += '</div>'

        return html
    }

    // Cell lines in the ENCODE4 MPRA element results, as they appear in ENCODE4_and_IGVF_CRISPR_or_MPRA_validated_elements
    const ENCODE4_MPRA_CELL_LINE_DESCRIPTIONS = {
        'A549': 'lung adenocarcinoma cells',
        'GM12878': 'lymphoblastoid cells',
        'HCT116': 'colorectal cancer cells',
        'HepG2': 'liver cancer cells',
        'K562': 'leukemia cells',
        'SK-N-SH': 'neuroblastoma cells',
    }

    // Returns the cell lines of the ENCODE:MPRA:<cell line> entries in ENCODE4_and_IGVF_CRISPR_or_MPRA_validated_elements,
    // leaving out the CRISPR entries
    function getEncode4MpraCellLines(row) {
        return (row['ENCODE4_and_IGVF_CRISPR_or_MPRA_validated_elements'] || '').split(',')
            .filter(entry => entry.startsWith('ENCODE:MPRA:'))
            .map(entry => entry.replace('ENCODE:MPRA:', ''))
    }

    // The ENCODE4 MPRA details shown in the ENCODE4 MPRA column's popup and on the locus page
    function buildEncode4MpraDetailsHtml(row) {
        const describeCellLine = (cellLine) => {
            const description = ENCODE4_MPRA_CELL_LINE_DESCRIPTIONS[cellLine]
            return description ? `<b>${description}</b> (${cellLine})` : cellLine
        }
        const cellLines = getEncode4MpraCellLines(row)
        const cellLinesPhrase = cellLines.length === 1 ? 'this cell line' : `these ${cellLines.length} cell lines`

        let html = `This TR locus overlaps (by at least 1 bp) a DNA element that ENCODE4 tested with a massively parallel
            reporter assay (MPRA), in which each element is placed next to a reporter gene and its effect on expression
            is measured. The element increased reporter expression (log2 fold change &gt; 0, FDR &lt; 0.05) in
            ${cellLinesPhrase}:`
        html += cellLines.length === 1
            ? ` ${describeCellLine(cellLines[0])}.<br /><br />`
            : `<ul>${cellLines.map(cellLine => `<li>${describeCellLine(cellLine)}</li>`).join('')}</ul>`
        html += `<b>LIMITATIONS:</b> The repeat may not be the active part. An MPRA element is usually a few hundred bp, so the
            activity can come from the sequence around the repeat. Also, only the reference sequence was tested.
            These assays don't say anything about how changing the repeat length affects expression. A cell line
            missing from this list may not have been tested.`
        html += `<div style="font-size: 0.9em; color: #666; margin-top: 8px;">
            Source: MPRA element results from the <a href="https://www.encodeproject.org" target="_blank">ENCODE portal</a>,
            described in <a href="https://doi.org/10.64898/2026.07.06.731365" target="_blank">The Encyclopedia of DNA Elements</a>
            (ENCODE Consortium, bioRxiv 2026)
        </div>`

        return html
    }

    // True if Zhang et al. 2025 tested this locus's length effect. False if it was not in their library, or was in it
    // but had too few barcodes to test ('not enough data')
    function wasZhang2025MpraLengthEffectTested(row) {
        return ['significant', 'not significant'].includes(row['Zhang2025_LengthEffectTestResult'])
    }

    // The Zhang 2025 MPRA details shown in the Zhang 2025 MPRA column's popup and on the locus page, for loci where
    // wasZhang2025MpraLengthEffectTested() is true. The Zhang2025_LengthEffect columns come from the paper's main
    // library (hSTR1), or from its second library (hSTR2) when hSTR1 had too few barcodes to test the locus.
    function buildZhang2025MpraDetailsHtml(row) {
        const isSignificant = row['Zhang2025_LengthEffectTestResult'] === 'significant'
        const slope = row['Zhang2025_LengthEffectSlope']
        const fdr = row['Zhang2025_LengthEffectFDR']
        const details = parseJsonColumn(row, 'Zhang2025_Details') || {}
        const formatFdr = (value) => value < 0.001 ? value.toExponential(1) : value.toFixed(4)
        const sourceLibrary = details.lengthEffectSourceLibrary
        const sourceLibraryResults = details[sourceLibrary] || {}

        let html = `In the massively parallel reporter assay (MPRA) of promoter STRs from
            <a href="https://www.biorxiv.org/content/10.1101/2025.09.14.676153" target="_blank">Zhang et al. 2025</a>,
            changing the repeat copy number of this TR (-5, +3 and +5 copies relative to hg38)
            <b>${isSignificant ? 'significantly changed' : 'did not significantly change'}</b> reporter expression in
            HEK293T cells.`
        if (sourceLibrary === 'hSTR1') {
            html += ` This result is from the paper's main library (hSTR1).`
        } else if (sourceLibrary === 'hSTR2') {
            html += ` This result is from the paper's second library (hSTR2), since its main library (hSTR1) had too
                few barcodes to test this TR.`
        }
        html += `<br /><br />`
        html += `<b>False Discovery Rate (FDR):</b> ${fdr != null ? formatFdr(fdr) : 'n/a'}
            <span style="color: #666;">(significant if &lt; 0.1)</span><br />
            <b>Length Effect Slope:</b> ${slope != null ? slope.toFixed(3) : 'n/a'}<br />
            <span style="color: #666;">change in reporter expression (RNA/DNA ratio) per added repeat copy; positive
            means longer alleles increase expression</span>`
        if (sourceLibraryResults.pearsonR != null) {
            html += `<br /><b>Pearson r:</b> ${sourceLibraryResults.pearsonR.toFixed(3)}
                <span style="color: #666;">(between repeat copy number and expression)</span>`
        }
        // When the result is from hSTR1, also show hSTR2's result for the same TR, if hSTR2 tested it
        if (sourceLibrary === 'hSTR1' && details.hSTR2) {
            const {lengthEffectFDR, lengthEffectSlope, pearsonR} = details.hSTR2
            html += `<br /><br />In the paper's second library (hSTR2), the length effect was
                <b>${lengthEffectFDR < 0.1 ? 'significant' : 'not significant'}</b> (FDR: ${formatFdr(lengthEffectFDR)},
                slope: ${lengthEffectSlope.toFixed(3)}, Pearson r: ${pearsonR.toFixed(3)}).
                <span style="color: #666;">hSTR2 slopes are about half the size of hSTR1 slopes, so compare the
                direction rather than the size.</span>`
        }
        if (details.matchType === 'fuzzy') {
            // Both intervals are chrom:start-end with a 0-based start, so each width is end - start
            const { chrom, start_0based, end_1based, motif } = parseAndNormalizeLocusId(row['LocusId'])
            html += `<div style="background: #fff3cd; padding: 8px; margin-top: 10px; border-radius: 4px;">
                <i class="info circle icon"></i>
                <b>Note:</b> This TRExplorer locus definition (chr${chrom}:${start_0based}-${end_1based}, width:
                ${(end_1based - start_0based).toLocaleString()}bp, motif: ${motif}) overlaps but is not exactly the same as the
                <code>${details.zhangLocusId}</code> (${details.zhangInterval}, width:
                ${computeIntervalSize(details.zhangInterval).toLocaleString()}bp, motif: ${details.zhangMotif}) definition used in
                Zhang et al.
            </div>`
        }
        html += `<div style="font-size: 0.9em; color: #666; margin-top: 8px;">
            Source: <a href="https://www.biorxiv.org/content/10.1101/2025.09.14.676153" target="_blank">Zhang et al. 2025</a>
            (bioRxiv)
        </div>`

        return html
    }

    // The Garg et al. 2019 and Garg et al. 2020 DMR (differentially methylated region) columns. Each *Details column
    // holds a JSON list of the DMRs (for Garg 2020, the TRs next to them) that overlap the locus, usually one, written by
    // data-prep/literature_review/Garg_2019_and_2020/generate_Garg_2019_and_2020_DMR_lookup_json.py
    const GARG_2019_PAPER_URL = 'https://pmc.ncbi.nlm.nih.gov/articles/PMC6801017/'
    const GARG_2020_PAPER_URL = 'https://pmc.ncbi.nlm.nih.gov/articles/PMC7536611/'
    // The Garg 2019 columns of each cohort ('autism' or 'schizophrenia')
    const GARG_2019_COLUMNS_BY_COHORT = {
        autism: {methylationChange: 'Garg2019_AutismDMRMethylationChange', details: 'Garg2019_AutismDMRDetails'},
        schizophrenia: {methylationChange: 'Garg2019_SchizophreniaDMRMethylationChange', details: 'Garg2019_SchizophreniaDMRDetails'},
    }
    const GARG_DMR_DEFINITION = `A DMR is a region where one person's DNA methylation in blood is far outside the range
        seen in controls: at least 3 Illumina 450k array probes within 1 kb, each above the 99.9th percentile
        (hypermethylated) or below the 0.1th percentile (hypomethylated) of the controls.`

    // eg. formatCount(1, 'proband', 'probands') returns '1 proband'
    const formatCount = (count, singular, plural) => `${count.toLocaleString()} ${count === 1 ? singular : plural}`

    // eg. 'chr1:100-250' returns 'chr1:100-250 (hg38), 150 bp'
    function describeHg38Interval(interval) {
        return `${interval} (hg38), ${computeIntervalSize(interval).toLocaleString()} bp`
    }

    // The genes whose promoter (+/-2 kb of the TSS) or gene body overlaps a DMR
    function describeGargDmrGenes(dmr) {
        const descriptions = []
        if (dmr.promoterGenes.length > 0) descriptions.push(`${dmr.promoterGenes.join(', ')} (promoter)`)
        if (dmr.geneBodyGenes.length > 0) descriptions.push(`${dmr.geneBodyGenes.join(', ')} (gene body)`)
        return descriptions.length > 0 ? descriptions.join('; ') : 'none'
    }

    // The Garg 2019 DMR details shown in the Garg 2019 Autism DMRs and Garg 2019 Schizophrenia DMRs columns' popups and
    // on the locus page. cohort is 'autism' or 'schizophrenia'.
    function buildGarg2019DmrDetailsHtml(row, cohort) {
        const isAutism = cohort === 'autism'
        let html = ''
        for (const dmr of parseJsonColumn(row, GARG_2019_COLUMNS_BY_COHORT[cohort].details, '[]') || []) {
            const carriers = isAutism
                ? [formatCount(dmr.numProbandsWithDMR, 'autism proband', 'autism probands')]
                    .concat(dmr.numSiblingsWithDMR > 0 ? [formatCount(dmr.numSiblingsWithDMR, 'unaffected sibling', 'unaffected siblings')] : [])
                    .join(' and ')
                : formatCount(dmr.numIndividualsWithDMR, 'individual with schizophrenia', 'individuals with schizophrenia')
            const alsoSeenIn = [
                dmr.numPopulationControlsWithDMR > 0 ? `${dmr.numPopulationControlsWithDMR} of 2,711 population controls` : '',
                dmr.numFamilialControlsWithDMR > 0 ? formatCount(dmr.numFamilialControlsWithDMR, 'familial control', 'familial controls') : '',
                dmr.numIntellectualDisabilityOrCongenitalAnomalyPatientsWithDMR > 0
                    ? `${dmr.numIntellectualDisabilityOrCongenitalAnomalyPatientsWithDMR} of 489 patients with intellectual disability or congenital anomalies` : '',
            ].filter(Boolean)
            html += `This TR overlaps a rare DMR (differentially methylated region) that was <b>${dmr.methylationChange}</b>
                in <b>${carriers}</b>.<br /><br />
                <b>DMR:</b> ${describeHg38Interval(dmr.dmrHg38)}, ${dmr.numProbes} array probes<br />
                <b>Genes:</b> ${describeGargDmrGenes(dmr)}<br />
                <b>Also seen in:</b> ${alsoSeenIn.length > 0 ? alsoSeenIn.join(', ') : 'none of the controls, or of 489 patients with intellectual disability or congenital anomalies'}<br />`
            if (dmr.numCarriersWithFailedProbeDetection > 0) {
                const numCarriers = isAutism ? dmr.numProbandsWithDMR + dmr.numSiblingsWithDMR : dmr.numIndividualsWithDMR
                const flaggedCarriers = dmr.numCarriersWithFailedProbeDetection < numCarriers
                    ? `${dmr.numCarriersWithFailedProbeDetection} of the ${numCarriers} people`
                    : (numCarriers === 1 ? 'the one person' : `all ${numCarriers} people`)
                html += `<b>Note:</b> in ${flaggedCarriers} with this DMR, a cluster of its array probes failed detection
                    (their signal was not above background), so the DMR may come from a technical problem or a deletion
                    rather than a change in methylation.<br />`
            }
            html += '<br />'
        }
        // "CG" in the motif is intended wording, here and in the Garg 2020 popup. The lookup also matches a CG that spans
        // two motif copies (e.g. a GCC repeat, read as GCCGCC), but a motif and its rotations (GCC, CCG, CGC) are the
        // same motif, so "in the motif" covers those loci. Don't replace it with a longer description of the rule.
        html += `<span style="color: #666;">${GARG_DMR_DEFINITION} This TRExplorer locus was assigned this result because
            it overlaps the reported DMR and contains CpG sites ("CG" in the motif). Garg et al. studied 297 autism
