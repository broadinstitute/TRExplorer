        if (value && $dropdown.find(`.menu .item[data-value="${value}"]`).length > 0) {
            $dropdown.dropdown('set selected', value)
        } else {
            $dropdown.dropdown('clear')
        }
    }

    const readSearchResultsPlotSettingsFromDialog = () => {
        const yValue = $('#plot-y-column-dropdown').dropdown('get value')
        const colorValue = $('#plot-color-column-dropdown').dropdown('get value')
        // A number left in a field that the current plot doesn't use (and so hides) mustn't block OK
        const readNumberField = (fieldSelector, inputSelector, defaultValue) =>
            $(fieldSelector).css('display') === 'none' ? defaultValue : Number($(inputSelector).val())
        return {
            type: $('input[name="searchResultsPlotType"]:checked').val() || 'bar',
            x: $('#plot-x-column-dropdown').dropdown('get value') || '',
            xMode: $('input[name="searchResultsPlotXMode"]:checked').val() || 'categories',
            bins: readNumberField('#plot-bins-field', '#plot-bins-input', DEFAULT_SEARCH_RESULTS_PLOT_SETTINGS.bins),
            y: yValue === PLOT_DIALOG_NUMBER_OF_LOCI_VALUE ? '' : (yValue || ''),
            agg: $('#plot-y-aggregate-dropdown').dropdown('get value') || 'mean',
            color: colorValue === PLOT_DIALOG_NO_COLOR_VALUE ? '' : (colorValue || ''),
            xScale: $('#plot-x-scale-dropdown').dropdown('get value') || 'linear',
            yScale: $('#plot-y-scale-dropdown').dropdown('get value') || 'linear',
            topN: readNumberField('#plot-top-n-field', '#plot-top-n-input', DEFAULT_SEARCH_RESULTS_PLOT_SETTINGS.topN),
            other: $('#plot-show-other-checkbox').prop('checked') ? 1 : 0,
            missing: $('#plot-show-missing-checkbox').prop('checked') ? 1 : 0,
            sort: $('#plot-sort-dropdown').dropdown('get value') || 'height',
            dir: $('#plot-sort-direction-dropdown').dropdown('get value') || 'desc',
            pct: $('#plot-percent-checkbox').prop('checked') ? 1 : 0,
        }
    }

    // Shows the dialog fields that apply to the selected plot type and columns, and rebuilds the column menus so
    // that they offer only the columns that fit each axis
    const updateSearchResultsPlotDialogFields = () => {
        // An error message from an earlier click on OK may no longer apply
        $('#search-results-plot-dialog-error').hide()
        isFillingSearchResultsPlotDialog = true
        try {
            const type = $('input[name="searchResultsPlotType"]:checked').val() || 'bar'
            setPlotDialogDropdownMenu($('#plot-x-column-dropdown'), buildPlotColumnDropdownMenu(
                type === 'scatter' ? canColumnBeNumericalPlotAxis : (type === 'box' ? canColumnBeCategoricalPlotAxis : () => true)))
            const numberOfLociItem = type === 'bar' ? `<div class="item" data-value="${PLOT_DIALOG_NUMBER_OF_LOCI_VALUE}">Number of loci</div><div class="divider"></div>` : ''
            setPlotDialogDropdownMenu($('#plot-y-column-dropdown'), numberOfLociItem + buildPlotColumnDropdownMenu(
                type === 'scatter' ? canColumnBeNumericalPlotAxis : canColumnBeBarOrBoxPlotYAxis))
            if (type === 'bar' && !$('#plot-y-column-dropdown').dropdown('get value')) {
                $('#plot-y-column-dropdown').dropdown('set selected', PLOT_DIALOG_NUMBER_OF_LOCI_VALUE)
            }

            const settings = readSearchResultsPlotSettingsFromDialog()
            const xColumn = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME[settings.x]
            const histogram = isHistogramPlot(settings)
            const categoricalX = doesPlotHaveCategoricalXAxis(settings)
            const showField = (selector, show) => $(selector).toggle(!!show)
            showField('#plot-x-mode-field', type === 'bar' && xColumn && xColumn.plotAxisType === 'categorical_or_numerical')
            showField('#plot-bins-field', histogram)
            showField('#plot-y-aggregate-field', type === 'bar' && settings.y)
            showField('#plot-x-scale-field', type === 'scatter' || histogram)
            showField('#plot-y-scale-field', !(isStackedBarPlot(settings) && settings.pct === 1))
            showField('#plot-top-n-field', categoricalX || settings.color)
            showField('#plot-sort-fields', categoricalX)
            showField('#plot-show-other-field', categoricalX || settings.color || histogram)
            showField('#plot-percent-field', isStackedBarPlot(settings))
            const heightSortLabel = type === 'box' ? 'Median' : 'Bar height'
            $('#plot-sort-dropdown .item[data-value="height"]').text(heightSortLabel)
            if (settings.sort === 'height') $('#plot-sort-dropdown').dropdown('set text', heightSortLabel)
        } finally {
            isFillingSearchResultsPlotDialog = false
        }
    }

    const fillSearchResultsPlotDialog = (settings) => {
        isFillingSearchResultsPlotDialog = true
        try {
            $(`input[name="searchResultsPlotType"][value="${settings.type}"]`).prop('checked', true)
            $(`input[name="searchResultsPlotXMode"][value="${settings.xMode}"]`).prop('checked', true)
            $('#plot-bins-input').val(settings.bins)
            $('#plot-top-n-input').val(settings.topN)
            $('#plot-show-other-checkbox').prop('checked', settings.other === 1)
            $('#plot-show-missing-checkbox').prop('checked', settings.missing === 1)
            $('#plot-percent-checkbox').prop('checked', settings.pct === 1)
            $('#plot-y-aggregate-dropdown').dropdown('set selected', settings.agg)
            $('#plot-x-scale-dropdown').dropdown('set selected', settings.xScale)
            $('#plot-y-scale-dropdown').dropdown('set selected', settings.yScale)
            $('#plot-sort-direction-dropdown').dropdown('set selected', settings.dir)
            $('#plot-sort-dropdown').dropdown('set selected', settings.sort)
            $('#plot-color-column-dropdown').dropdown('set selected', settings.color || PLOT_DIALOG_NO_COLOR_VALUE)
            // The x and y menus depend on the plot type, so they're rebuilt before their values are set
            $('#plot-x-column-dropdown, #plot-y-column-dropdown').dropdown('clear')
        } finally {
            isFillingSearchResultsPlotDialog = false
        }
        updateSearchResultsPlotDialogFields()
        isFillingSearchResultsPlotDialog = true
        try {
            if (settings.x) $('#plot-x-column-dropdown').dropdown('set selected', settings.x)
            $('#plot-y-column-dropdown').dropdown('set selected', settings.y || PLOT_DIALOG_NUMBER_OF_LOCI_VALUE)
        } finally {
            isFillingSearchResultsPlotDialog = false
        }
        updateSearchResultsPlotDialogFields()
    }

    // Opens the plot settings dialog for the plot at plotIndex, or for a new plot when plotIndex is null
    const showSearchResultsPlotDialog = (plotIndex) => {
        searchResultsPlotDialogPlotIndex = plotIndex
        const settingsList = getSearchResultsPlotSettingsList()
        const settings = plotIndex === null ? {...DEFAULT_SEARCH_RESULTS_PLOT_SETTINGS} : settingsList[plotIndex]
        $('#search-results-plot-dialog-title').text(plotIndex === null ? 'Add Plot' : 'Edit Plot')
        $('#search-results-plot-dialog-error').hide()
        fillSearchResultsPlotDialog(settings)
        $('#search-results-plot-dialog').modal({
            onApprove: () => {
                const newSettings = readSearchResultsPlotSettingsFromDialog()
                const problem = findProblemWithSearchResultsPlotSettings(newSettings)
                if (problem) {
                    $('#search-results-plot-dialog-error').text(problem).show()
                    return false  // keep the dialog open
                }
                const newSettingsList = getSearchResultsPlotSettingsList()
                if (searchResultsPlotDialogPlotIndex === null) {
                    newSettingsList.push(newSettings)
                } else {
                    newSettingsList[searchResultsPlotDialogPlotIndex] = newSettings
                }
                saveSearchResultsPlotSettingsList(newSettingsList)
                refreshSearchResultsPlots()
                return true
            },
        }).modal('show')
    }

    const initializeSearchResultsPlots = () => {
        $('#plot-x-column-dropdown, #plot-y-column-dropdown, #plot-color-column-dropdown, #plot-sort-dropdown').dropdown({
            fullTextSearch: true,
            onChange: () => { if (!isFillingSearchResultsPlotDialog) updateSearchResultsPlotDialogFields() },
        })
        // The aggregate decides whether colored bars are stacked, which decides whether the percent option shows
        $('#plot-y-aggregate-dropdown').dropdown({
            onChange: () => { if (!isFillingSearchResultsPlotDialog) updateSearchResultsPlotDialogFields() },
        })
        $('#plot-x-scale-dropdown, #plot-y-scale-dropdown, #plot-sort-direction-dropdown').dropdown()
        $('#plot-color-column-dropdown .menu').html(
            `<div class="item" data-value="${PLOT_DIALOG_NO_COLOR_VALUE}">None</div><div class="divider"></div>` +
            buildPlotColumnDropdownMenu(canColumnBeCategoricalPlotAxis))
        $('#plot-sort-dropdown .menu').append(
            '<div class="divider"></div><div class="header">Mean of a column</div>' +
            buildPlotColumnDropdownMenu(canColumnBeNumericalPlotAxis))
        $('#plot-color-column-dropdown, #plot-sort-dropdown').dropdown('refresh')
        $('#search-results-plot-dialog .ui.checkbox').checkbox()
        $('#search-results-plot-dialog input[type="radio"], #search-results-plot-dialog input[type="checkbox"]').on('change', () => {
            if (!isFillingSearchResultsPlotDialog) updateSearchResultsPlotDialogFields()
        })

        $('#add-search-results-plot-link').click((e) => {
            e.preventDefault()
            showSearchResultsPlotDialog(null)
        })
        $('#search-results-plots').on('click', '.edit-search-results-plot-link', (e) => {
            showSearchResultsPlotDialog(Number($(e.target).closest('.search-results-plot').data('plot-index')))
        })
        $('#search-results-plots').on('click', '.remove-search-results-plot-link', (e) => {
            const plotIndex = Number($(e.target).closest('.search-results-plot').data('plot-index'))
            saveSearchResultsPlotSettingsList(getSearchResultsPlotSettingsList().filter((_, i) => i !== plotIndex))
            refreshSearchResultsPlots()
        })
        $('#search-results-plots').on('click', '.download-search-results-plot-link', (e) => {
            const $plot = $(e.target).closest('.search-results-plot')
            const chart = Chart.getChart($plot.find('canvas')[0])
            if (!chart) return
            const link = document.createElement('a')
            link.href = chart.toBase64Image('image/png', 1)
            link.download = `${$plot.find('.search-results-plot-title').text().replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '')}.png`
            document.body.appendChild(link)
            link.click()
            link.remove()
        })
    }

</script>
