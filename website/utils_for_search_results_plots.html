<style>
    #search-results-plots-area {
        margin-top: 10px;
    }
    .search-results-plot {
        margin: 25px 0 10px 0;
        padding: 15px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
    }
    .search-results-plot-canvas-container {
        position: relative;
        height: 420px;
    }
    .search-results-plot-caption {
        margin-top: 8px;
        color: #555555;
        font-size: 13px;
    }
    .search-results-plot-links {
        margin-top: 8px;
    }
    .search-results-plot-links a {
        margin-right: 20px;
        cursor: pointer;
    }
    #add-search-results-plot-link-container {
        margin: 15px 0 25px 0;
    }
    /* The plot dialog's dropdowns are only as wide as their text, instead of as wide as their field */
    #search-results-plot-dialog .ui.form .field > .selection.dropdown {
        width: auto;
        min-width: 0;
    }
    /* ...except that an open search dropdown widens, so that the typed search text fits */
    #search-results-plot-dialog .ui.form .field > .search.selection.dropdown.active {
        min-width: 14em;
    }
    /* Each open menu is as wide as its longest item, and at least as wide as its dropdown */
    #search-results-plot-dialog .ui.selection.dropdown .menu {
        width: max-content;
        min-width: calc(100% + 2px);
    }
</style>

<script>

    // Search results plots: bar, scatter and box plots of the loci that the current search returns. Each plot is
    // described by a settings object (see DEFAULT_SEARCH_RESULTS_PLOT_SETTINGS), and the list of these is kept in the
    // URL (the "plots" page state key) so that reloading the page shows the same plots. Each plot runs its own BigQuery
    // query, using the WHERE clause of the current search, to compute the aggregate values that it shows.

    // Columns that the plots can use, with their plotAxisType ('categorical', 'numerical' or 'categorical_or_numerical')
    // Generated by get_plot_columns() in global_constants.py
    const SEARCH_RESULTS_PLOT_COLUMNS = {{ plot_columns_json }}
    const SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME = Object.fromEntries(SEARCH_RESULTS_PLOT_COLUMNS.map(c => [c.name, c]))

    // The "Add plot..." link appears when a search returns at least this many loci
    const MIN_SEARCH_RESULTS_TO_SHOW_PLOTS = 1

    // The query proxy returns at most this many rows per request
    const QUERY_PROXY_MAX_PAGE_SIZE = 10000

    // Scatter plots of larger searches show a random sample of this many loci
    const MAX_SCATTER_PLOT_POINTS = QUERY_PROXY_MAX_PAGE_SIZE

    // Category labels that the plot queries return for values outside the top N, for missing values, and (in
    // histograms) for values that a log scale can't show
    const PLOT_OTHER_CATEGORY = '__other__'
    const PLOT_MISSING_CATEGORY = '__missing__'
    const PLOT_EXCLUDED_BIN = '__excluded__'

    const PLOT_TYPES = ['bar', 'scatter', 'box']
    const PLOT_X_MODES = ['categories', 'bins']
    const PLOT_SCALES = ['linear', 'log', 'symlog']
    const PLOT_AGGREGATES = ['mean', 'median', 'min', 'max', 'sum']
    const PLOT_SORT_ORDERS = ['height', 'count', 'value']
    const PLOT_SORT_DIRECTIONS = ['desc', 'asc']

    const PLOT_AGGREGATE_SQL = {
        mean: 'AVG(y)',
        // 100 buckets, since with fewer the approximation can land on the wrong value of a column with few values
        median: 'APPROX_QUANTILES(y, 100)[SAFE_OFFSET(50)]',
        min: 'MIN(y)',
        max: 'MAX(y)',
        sum: 'SUM(y)',
    }
    const PLOT_AGGREGATE_LABELS = {mean: 'Mean', median: 'Median', min: 'Min', max: 'Max', sum: 'Sum of'}
    const PLOT_SCALE_LABELS = {linear: 'linear', log: 'log', symlog: 'symmetric log'}

    const DEFAULT_SEARCH_RESULTS_PLOT_SETTINGS = {
        type: 'bar',
        x: '',               // x-axis column
        xMode: 'categories', // bar plots: one bar per x value ('categories'), or a histogram of the x values ('bins')
        bins: 30,            // histograms: number of bins
        y: '',               // y-axis column. For bar plots, '' means the bar height is the number of loci
        agg: 'mean',         // bar plots with a y column: how the bar height summarizes the y values
        color: '',           // optional column whose values set the colors
        xScale: 'linear',
        yScale: 'linear',
        topN: 10,            // how many of the most frequent categories to show
        other: 0,            // 1 = show the categories outside the top N as one "Other" category
        missing: 0,          // 1 = show loci with no value as a "Missing" category
        sort: 'height',      // categorical x-axes: 'height' (bar height or box median), 'count', 'value', or a column name to sort by its mean
        dir: 'desc',
        pct: 0,              // stacked bar plots: 1 = show each stack as percentages that add up to 100
    }

    // Short names for the settings in the URL
    const SEARCH_RESULTS_PLOT_SETTING_URL_KEYS = {
        type: 't', x: 'x', xMode: 'xm', bins: 'b', y: 'y', agg: 'a', color: 'c', xScale: 'xs', yScale: 'ys',
        topN: 'n', other: 'o', missing: 'm', sort: 's', dir: 'd', pct: 'p',
    }
    const SEARCH_RESULTS_PLOT_SETTING_NAMES_BY_URL_KEY = Object.fromEntries(
        Object.entries(SEARCH_RESULTS_PLOT_SETTING_URL_KEYS).map(([name, urlKey]) => [urlKey, name]))
    const NUMERIC_SEARCH_RESULTS_PLOT_SETTINGS = ['bins', 'topN', 'other', 'missing', 'pct']

    // Tableau 10 followed by lighter shades, for the color categories
    const PLOT_CATEGORY_COLORS = [
        '#4e79a7', '#f28e2b', '#e15759', '#76b7b2', '#59a14f', '#edc948', '#b07aa1', '#ff9da7', '#9c755f', '#bab0ac',
        '#aec7e8', '#ffbb78', '#ff9896', '#98df8a', '#c5b0d5', '#c49c94', '#f7b6d2', '#dbdb8d', '#9edae5', '#17becf',
    ]
    const PLOT_SINGLE_SERIES_COLOR = '#2185d0'

    // The number of color categories: the number of most frequent categories to show, but at most one per palette
    // color, so that no two categories share a color
    const getNumColorCategories = (settings) => Math.min(settings.topN, PLOT_CATEGORY_COLORS.length)
    const PLOT_OTHER_CATEGORY_COLOR = '#888888'
    const PLOT_MISSING_CATEGORY_COLOR = '#cccccc'

    const canColumnBeCategoricalPlotAxis = (column) => !!column && column.plotAxisType !== 'numerical'
    const canColumnBeNumericalPlotAxis = (column) => !!column && column.plotAxisType !== 'categorical'
    // A summary of genomic coordinates (such as the mean start of the loci in a bar) means little, so these columns
    // can be scatter plot axes and histogram X-axes, but not bar or box plot Y-axes
    const GENOMIC_COORDINATE_COLUMN_NAMES = new Set(['start_0based', 'end_1based'])
    const canColumnBeBarOrBoxPlotYAxis = (column) => canColumnBeNumericalPlotAxis(column) && !GENOMIC_COORDINATE_COLUMN_NAMES.has(column.name)

    // Whether a bar plot is a histogram of a numeric x column. A numerical-only x column always is, and a
    // categorical-only one never is.
    const isHistogramPlot = (settings) => {
        if (settings.type !== 'bar') return false
        const xColumn = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME[settings.x]
        if (!xColumn) return false
        if (xColumn.plotAxisType === 'numerical') return true
        if (xColumn.plotAxisType === 'categorical') return false
        return settings.xMode === 'bins'
    }

    // Bar plots stack the color categories when the bar heights add up (counts and sums), and put them side by side
    // otherwise (means, medians, mins and maxes)
    const isStackedBarPlot = (settings) => settings.type === 'bar' && !!settings.color && (!settings.y || settings.agg === 'sum')

    const doesPlotHaveCategoricalXAxis = (settings) => settings.type === 'box' || (settings.type === 'bar' && !isHistogramPlot(settings))

    // --- Settings and the URL ---

    /**
     * Returns the reason the given plot settings can't be plotted, or '' if they can.
     */
    const findProblemWithSearchResultsPlotSettings = (settings) => {
        if (!PLOT_TYPES.includes(settings.type)) return `Unknown plot type: ${settings.type}`
        const xColumn = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME[settings.x]
        const yColumn = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME[settings.y]
        if (!settings.x) return 'Select an X-axis column.'
        if (!xColumn) return `Unknown X-axis column: ${settings.x}`
        if (settings.type === 'scatter' && !canColumnBeNumericalPlotAxis(xColumn)) return `${xColumn.displayName} can't be a scatter plot X-axis since it isn't numeric.`
        if (settings.type === 'box' && !canColumnBeCategoricalPlotAxis(xColumn)) return `${xColumn.displayName} can't be a box plot X-axis since it isn't categorical.`
        if (settings.type !== 'bar' && !settings.y) return 'Select a Y-axis column.'
        if (settings.y && !yColumn) return `Unknown Y-axis column: ${settings.y}`
        if (settings.y && !canColumnBeNumericalPlotAxis(yColumn)) return `${yColumn.displayName} can't be a Y-axis since it isn't numeric.`
        if (settings.y && settings.type !== 'scatter' && !canColumnBeBarOrBoxPlotYAxis(yColumn)) return `${yColumn.displayName} can only be a scatter plot Y-axis.`
        if (settings.color && !canColumnBeCategoricalPlotAxis(SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME[settings.color])) return `Unknown or non-categorical color column: ${settings.color}`
        if (!PLOT_X_MODES.includes(settings.xMode)) return `Unknown X-axis mode: ${settings.xMode}`
        if (!PLOT_SCALES.includes(settings.xScale) || !PLOT_SCALES.includes(settings.yScale)) return 'Unknown axis scale.'
        if (!PLOT_AGGREGATES.includes(settings.agg)) return `Unknown aggregate: ${settings.agg}`
        if (!PLOT_SORT_DIRECTIONS.includes(settings.dir)) return `Unknown sort direction: ${settings.dir}`
        if (!PLOT_SORT_ORDERS.includes(settings.sort) && !canColumnBeNumericalPlotAxis(SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME[settings.sort])) return `Unknown sort order: ${settings.sort}`
        if (!Number.isInteger(settings.topN) || settings.topN < 1 || settings.topN > 100) return 'The number of categories must be a whole number between 1 and 100.'
        if (!Number.isInteger(settings.bins) || settings.bins < 2 || settings.bins > 200) return 'The number of bins must be a whole number between 2 and 200.'
        return ''
    }

    /**
     * Converts a list of plot settings to the string stored in the URL, e.g. "t:bar,x:GencodeGeneRegion;t:box,..."
     * Only the settings that differ from DEFAULT_SEARCH_RESULTS_PLOT_SETTINGS are written, except the plot type.
     */
    const serializeSearchResultsPlotSettingsList = (settingsList) => settingsList.map(settings =>
        Object.entries(SEARCH_RESULTS_PLOT_SETTING_URL_KEYS)
            .filter(([name]) => name === 'type' || settings[name] !== DEFAULT_SEARCH_RESULTS_PLOT_SETTINGS[name])
            .map(([name, urlKey]) => `${urlKey}:${encodeURIComponent(settings[name])}`)
            .join(',')
    ).join(';')

    /**
     * Parses the string written by serializeSearchResultsPlotSettingsList. Plots whose settings can't be plotted (e.g.
     * a column that no longer exists) are dropped with a console warning.
     */
    const parseSearchResultsPlotSettingsList = (serialized) => {
        if (!serialized) return []
        return String(serialized).split(';').filter(s => s.trim()).map(serializedSettings => {
            const settings = {...DEFAULT_SEARCH_RESULTS_PLOT_SETTINGS}
            serializedSettings.split(',').forEach(keyAndValue => {
                const separatorIndex = keyAndValue.indexOf(':')
                const name = SEARCH_RESULTS_PLOT_SETTING_NAMES_BY_URL_KEY[keyAndValue.slice(0, separatorIndex)]
                if (separatorIndex < 0 || !name) return
                const value = decodeURIComponent(keyAndValue.slice(separatorIndex + 1))
                settings[name] = NUMERIC_SEARCH_RESULTS_PLOT_SETTINGS.includes(name) ? Number(value) : value
            })
            const problem = findProblemWithSearchResultsPlotSettings(settings)
            if (problem) {
                console.warn(`Skipping plot "${serializedSettings}" from the URL: ${problem}`)
                return null
            }
            return settings
        }).filter(settings => settings !== null)
    }

    // --- Queries ---

    const plotCategoryExpression = (column) => column.type === 'STRING' ? `NULLIF(TRIM(${column.name}), '')` : column.name
    const plotNumberExpression = (column) => `CAST(${column.name} AS FLOAT64)`

    // The SQL that maps a value to the plotted position on an axis with the given scale. NULL means the value can't
    // be shown (zero or negative values on a log scale).
    const plotScaleTransformSql = (expression, scale) => {
        if (scale === 'log') return `IF(${expression} > 0, LOG10(${expression}), NULL)`
        // Below 1e-8, log10(1 + |x|) is computed as |x| / ln(10), since 1 + |x| would round to 1 for tiny values
        // like small p-values
        if (scale === 'symlog') return `SIGN(${expression}) * IF(ABS(${expression}) < ${SYMLOG_LINEAR_BELOW}, ABS(${expression}) / LN(10), LOG10(1 + ABS(${expression})))`
        return expression
    }

    // Values that can be shown on an axis with the given scale
    const plotableValueSql = (expression, scale) => scale === 'log' ? `(${expression} > 0)` : `(${expression} IS NOT NULL)`

    // A CTE with the topN most frequent non-missing values of one of the "base" CTE's columns
    const topValuesCte = (cteName, valueAlias, topN) =>
        `${cteName} AS (SELECT ${valueAlias} AS value FROM base WHERE ${valueAlias} IS NOT NULL GROUP BY ${valueAlias} ` +
        `ORDER BY COUNT(*) DESC, CAST(${valueAlias} AS STRING) LIMIT ${topN})`

    const categoryLabelSql = (valueAlias, topValuesCteName) =>
        `CASE WHEN ${valueAlias} IS NULL THEN '${PLOT_MISSING_CATEGORY}' ` +
        `WHEN ${valueAlias} IN (SELECT value FROM ${topValuesCteName}) THEN CAST(${valueAlias} AS STRING) ` +
        `ELSE '${PLOT_OTHER_CATEGORY}' END`

    const isSortByColumn = (settings) => !PLOT_SORT_ORDERS.includes(settings.sort)

    /**
     * Returns the SQL query that computes what the given plot shows.
     *
     * Bar and box plots return one row per (x category, color category) pair, plus the rows that ROLLUP adds: one per
     * x category with c_label NULL (is_total_over_colors = 1), and one for all loci (is_grand_total = 1).
     * Scatter plots return up to MAX_SCATTER_PLOT_POINTS loci, chosen by hashing the LocusId so that the same loci
     * are chosen every time, plus the number of loci in the search results in every row.
     *
     * Args:
     *   settings: plot settings that findProblemWithSearchResultsPlotSettings accepts
     *   completeTableId: the backtick-quoted BigQuery table
     *   whereClause: the search's WHERE clause, or ''
     */
    const buildSearchResultsPlotQuery = (settings, completeTableId, whereClause) => {
        const columns = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME
        const xColumn = columns[settings.x]
        const yColumn = settings.y ? columns[settings.y] : null
        const colorColumn = settings.color ? columns[settings.color] : null
        const sortColumn = doesPlotHaveCategoricalXAxis(settings) && isSortByColumn(settings) ? columns[settings.sort] : null
        const fromClause = `FROM ${completeTableId} ${whereClause}`.trim()

        const histogram = isHistogramPlot(settings)
        const baseColumns = [`${settings.type === 'scatter' || histogram ? plotNumberExpression(xColumn) : plotCategoryExpression(xColumn)} AS x`]
        if (yColumn) baseColumns.push(`${plotNumberExpression(yColumn)} AS y`)
        if (colorColumn) baseColumns.push(`${plotCategoryExpression(colorColumn)} AS c`)
        if (sortColumn) baseColumns.push(`${plotNumberExpression(sortColumn)} AS s`)
        if (settings.type === 'scatter') baseColumns.push('LocusId', 'FARM_FINGERPRINT(LocusId) AS locus_hash')

        const ctes = [`base AS (SELECT ${baseColumns.join(', ')} ${fromClause})`]
        if (colorColumn) ctes.push(topValuesCte('top_colors', 'c', getNumColorCategories(settings)))
        const colorLabel = colorColumn ? categoryLabelSql('c', 'top_colors') : "''"

        if (settings.type === 'scatter') {
            const plotable = `${plotableValueSql('x', settings.xScale)} AND ${plotableValueSql('y', settings.yScale)}`
            ctes.push(`counts AS (SELECT COUNT(*) AS n_rows, COUNTIF(x IS NOT NULL AND y IS NOT NULL) AS n_with_x_and_y, COUNTIF(${plotable}) AS n_plotable FROM base)`)
            return `WITH ${ctes.join(', ')} ` +
                `SELECT x, y, ${colorLabel} AS c_label, LocusId, n_rows, n_with_x_and_y, n_plotable ` +
                `FROM base CROSS JOIN counts WHERE ${plotable} ORDER BY locus_hash, LocusId LIMIT ${MAX_SCATTER_PLOT_POINTS}`
        }

        // A fixed row order, so that if aggregate results ever span several pages of the query proxy (see
        // fetchAllPagesOfPlotQuery), the pages don't overlap
        const orderByLabels = 'ORDER BY is_grand_total, is_total_over_colors, x_label, c_label'
        const valueColumns = [yColumn ? 'y' : null, sortColumn ? 's' : null].filter(Boolean).map(c => `, ${c}`).join('')
        const rollupColumns = 'GROUPING(x_label) AS is_grand_total, GROUPING(c_label) AS is_total_over_colors, COUNT(*) AS n'
        const sortValueColumns = sortColumn ? ', SUM(s) AS s_sum, COUNT(s) AS s_n' : ''
        const yValueColumns = yColumn ? `, ${PLOT_AGGREGATE_SQL[settings.agg]} AS y_value, COUNT(y) AS n_y` : ''

        if (histogram) {
            // Equal-width bins in the plotted (scaled) space. A linear axis over an integer column gets bins whose
            // width is a whole number, so that each bin holds a fixed set of integers.
            const isIntegerBins = xColumn.type === 'INTEGER' && settings.xScale === 'linear'
            const binWidth = isIntegerBins
                ? `GREATEST(1, CEIL((MAX(tx) - MIN(tx) + 1) / ${settings.bins}))`
                : `(MAX(tx) - MIN(tx)) / ${settings.bins}`
            ctes.push(`transformed AS (SELECT *, ${plotScaleTransformSql('x', settings.xScale)} AS tx FROM base)`)
            ctes.push(`bin_range AS (SELECT MIN(tx) AS lo, MAX(tx) AS hi, ${binWidth} AS width FROM transformed)`)
            // Bin i holds the values from lo + i * width (inclusive) to lo + (i + 1) * width. Since floating point
            // division can land just below or above a whole number, the estimate from dividing is corrected by
            // comparing with those edges directly. The click filters use the same edges (see getHistogramBins, which
            // turns them into whole numbers for integer columns on log and symmetric log axes).
            ctes.push(`estimated_bins AS (SELECT *, CAST(IFNULL(FLOOR(SAFE_DIVIDE(tx - lo, width)), 0) AS INT64) AS estimated_bin ` +
                'FROM transformed CROSS JOIN bin_range)')
            const binSql = 'IF(width > 0, estimated_bin - IF(tx < lo + estimated_bin * width, 1, 0) + IF(tx >= lo + (estimated_bin + 1) * width, 1, 0), 0)'
            ctes.push(`labeled AS (SELECT CASE WHEN x IS NULL THEN '${PLOT_MISSING_CATEGORY}' WHEN tx IS NULL THEN '${PLOT_EXCLUDED_BIN}' ` +
                `ELSE CAST(LEAST(${settings.bins - 1}, GREATEST(0, ${binSql})) AS STRING) END AS x_label, ` +
                `${colorLabel} AS c_label${valueColumns} FROM estimated_bins)`)
            return `WITH ${ctes.join(', ')} ` +
                `SELECT x_label, c_label, ${rollupColumns}${yValueColumns}, ` +
                `(SELECT lo FROM bin_range) AS bin_range_lo, (SELECT hi FROM bin_range) AS bin_range_hi, (SELECT width FROM bin_range) AS bin_width ` +
                `FROM labeled GROUP BY ROLLUP(x_label, c_label) ${orderByLabels}`
        }

        ctes.push(topValuesCte('top_x', 'x', settings.topN))
        ctes.push(`labeled AS (SELECT ${categoryLabelSql('x', 'top_x')} AS x_label, ${colorLabel} AS c_label${valueColumns} FROM base)`)

        if (settings.type === 'bar') {
            return `WITH ${ctes.join(', ')} ` +
                `SELECT x_label, c_label, ${rollupColumns}${yValueColumns}${sortValueColumns} FROM labeled GROUP BY ROLLUP(x_label, c_label) ${orderByLabels}`
        }

        // Box plots: approximate quartiles, and whiskers that reach the most extreme values within 1.5 times the
        // interquartile range (IQR) of the box
        const plotable = plotableValueSql('y', settings.yScale)
        ctes.push(`stats AS (SELECT x_label, c_label, ${rollupColumns}, COUNTIF(${plotable}) AS n_y, ` +
            `APPROX_QUANTILES(IF(${plotable}, y, NULL), 100) AS q${sortValueColumns} FROM labeled GROUP BY ROLLUP(x_label, c_label))`)
        const q1 = 'stats.q[SAFE_OFFSET(25)]', q3 = 'stats.q[SAFE_OFFSET(75)]'
        ctes.push(`whiskers AS (SELECT labeled.x_label, labeled.c_label, ` +
            `MIN(IF(y >= ${q1} - 1.5 * (${q3} - ${q1}), y, NULL)) AS lower_whisker, ` +
            `MAX(IF(y <= ${q3} + 1.5 * (${q3} - ${q1}), y, NULL)) AS upper_whisker ` +
            `FROM labeled JOIN stats ON labeled.x_label = stats.x_label AND labeled.c_label = stats.c_label ` +
            `WHERE ${plotable} GROUP BY 1, 2)`)
        return `WITH ${ctes.join(', ')} ` +
            `SELECT stats.x_label, stats.c_label, is_grand_total, is_total_over_colors, n, n_y, ` +
            `${q1} AS q1, stats.q[SAFE_OFFSET(50)] AS median, ${q3} AS q3, ` +
            `lower_whisker, upper_whisker${sortColumn ? ', s_sum, s_n' : ''} ` +
            `FROM stats LEFT JOIN whiskers ON stats.x_label = whiskers.x_label AND stats.c_label = whiskers.c_label ` +
            'ORDER BY is_grand_total, is_total_over_colors, stats.x_label, stats.c_label'
    }

    // --- Axis scales ---

    // The same formula as plotScaleTransformSql's symmetric log, so that click filters agree with the histogram
    // query's bins to the last digit. Below 1e-8, log10(1 + |v|) is computed as |v| / ln(10), since 1 + |v| would
    // round to 1 for tiny values like small p-values.
    const SYMLOG_LINEAR_BELOW = 1e-8
    const symlogTransform = (value) => Math.sign(value) *
        (Math.abs(value) < SYMLOG_LINEAR_BELOW ? Math.abs(value) / Math.LN10 : Math.log10(1 + Math.abs(value)))
    const inverseSymlogTransform = (value) => Math.sign(value) *
        (Math.abs(value) < SYMLOG_LINEAR_BELOW / Math.LN10 ? Math.abs(value) * Math.LN10 : Math.pow(10, Math.abs(value)) - 1)

    // The value at which to draw a number on an axis with the given scale. Log scales are drawn by Chart.js itself.
    const toPlottedValue = (value, scale) => (value === null || value === undefined) ? null : (scale === 'symlog' ? symlogTransform(value) : value)

    const formatPlotNumber = (value) => {
        if (value === null || value === undefined || Number.isNaN(value)) return ''
        // Integers (e.g. genomic coordinates) are shown exactly
        if (Number.isInteger(value)) return value.toLocaleString()
        // Very small values (e.g. p-values) would round to 0 in decimal notation
        if (Math.abs(value) < 1e-4) return value.toExponential(2)
        return Number(value.toPrecision(3)).toLocaleString(undefined, {maximumFractionDigits: 20})
    }

    // For each axis scale, the functions that map a value to its plotted position and back
    const PLOT_SCALE_TRANSFORMS = {
        linear: {transform: (v) => v, inverse: (v) => v},
        log: {transform: Math.log10, inverse: (v) => Math.pow(10, v)},
        symlog: {transform: symlogTransform, inverse: inverseSymlogTransform},
    }

    /**
     * Returns the values to label on a log or symmetric log axis that spans the given raw values: the 1, 5 and 2
     * multiples of powers of 10 (signed, plus 0, on a symmetric log axis), in that order of preference. A value is
     * skipped when it would be drawn closer than 1/12 of the axis length to a label already chosen, since the labels
     * would overlap.
     */
    const computeAxisTickValuesForScale = (rawMin, rawMax, scale) => {
        const {transform} = PLOT_SCALE_TRANSFORMS[scale]
        const candidates = scale === 'symlog' ? [0] : []
        for (const multiple of [1, 5, 2]) {
            for (let exponent = scale === 'symlog' ? -3 : -300; exponent <= 15; exponent++) {
                const value = Number((multiple * Math.pow(10, exponent)).toPrecision(1))
                candidates.push(value)
                if (scale === 'symlog') candidates.push(-value)
            }
        }
        const minSpacing = (transform(rawMax) - transform(rawMin)) / 12
        const tickValues = []
        candidates.filter(v => v >= rawMin && v <= rawMax).forEach(value => {
            if (tickValues.every(t => Math.abs(transform(value) - transform(t)) >= minSpacing)) {
                tickValues.push(value)
            }
        })
        return tickValues.sort((a, b) => a - b)
    }

    /**
     * The Chart.js options for a linear axis whose values were already mapped to their plotted positions by the
     * given log or symmetric log scale's transform, labeled with the original values.
     */
    const buildTransformedValueAxisOptions = (scale, title, extraOptions = {}) => {
        const {transform, inverse} = PLOT_SCALE_TRANSFORMS[scale]
        return {
            type: 'linear',
            title: {display: true, text: title, font: {size: 13}},
            ...extraOptions,
            afterBuildTicks: (axis) => {
                const tickValues = computeAxisTickValuesForScale(inverse(axis.min), inverse(axis.max), scale)
                // Axes too narrow for two such values keep the ticks that Chart.js chose
                if (tickValues.length >= 2) axis.ticks = tickValues.map(value => ({value: transform(value)}))
            },
            ticks: {callback: (value) => formatPlotNumber(Number(inverse(value).toPrecision(6)))},
        }
    }

    // The Chart.js options for a numeric axis with the given scale
    const buildNumericAxisOptions = (scale, title, extraOptions = {}) => {
        if (scale === 'symlog') return buildTransformedValueAxisOptions(scale, title, extraOptions)
        const axisOptions = {
            type: scale === 'log' ? 'logarithmic' : 'linear',
            title: {display: true, text: title, font: {size: 13}},
            ...extraOptions,
        }
        if (scale === 'log') {
            axisOptions.ticks = {callback: (value) => {
                // Label only 1, 2 and 5 times powers of 10, so the labels don't overlap
                const leadingDigit = Number(value.toExponential(0)[0])
                return [1, 2, 5].includes(leadingDigit) ? formatPlotNumber(value) : ''
            }}
        }
        return axisOptions
    }

    // --- Chart configs ---

    const plotCategoryDisplayLabel = (label) => label === PLOT_OTHER_CATEGORY ? 'Other' : (label === PLOT_MISSING_CATEGORY ? 'Missing' : label)

    const isCategoryShown = (label, settings) => {
        if (label === PLOT_OTHER_CATEGORY) return settings.other === 1
        if (label === PLOT_MISSING_CATEGORY) return settings.missing === 1
        return true
    }

    // Puts "Other" and then "Missing" after the other categories
    const specialCategoryRank = (label) => label === PLOT_OTHER_CATEGORY ? 1 : (label === PLOT_MISSING_CATEGORY ? 2 : 0)

    const colorForCategory = (label, index) => {
        if (label === PLOT_OTHER_CATEGORY) return PLOT_OTHER_CATEGORY_COLOR
        if (label === PLOT_MISSING_CATEGORY) return PLOT_MISSING_CATEGORY_COLOR
        return PLOT_CATEGORY_COLORS[index % PLOT_CATEGORY_COLORS.length]
    }

    const hexColorWithAlpha = (hexColor, alpha) => {
        const [r, g, b] = [1, 3, 5].map(i => parseInt(hexColor.slice(i, i + 2), 16))
        return `rgba(${r}, ${g}, ${b}, ${alpha})`
    }

    /**
     * Returns the color categories of a bar, box or scatter plot's rows, with "Other" and "Missing" last and only if
     * the settings show them. Numeric color columns are in increasing order, and the others are most frequent first.
     * Returns [''] for plots with no color column.
     */
    const getShownColorCategories = (settings, rows) => {
        if (!settings.color) return ['']
        const countsByColor = {}
        rows.filter(r => settings.type === 'scatter' || (r.is_grand_total === 0 && r.is_total_over_colors === 0)).forEach(r => {
            countsByColor[r.c_label] = (countsByColor[r.c_label] || 0) + (settings.type === 'scatter' ? 1 : r.n)
        })
        const isNumericColorColumn = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME[settings.color].type !== 'STRING'
        return Object.keys(countsByColor)
            .filter(label => isCategoryShown(label, settings))
            .sort((a, b) => specialCategoryRank(a) - specialCategoryRank(b)
                || (isNumericColorColumn && specialCategoryRank(a) === 0 ? Number(a) - Number(b) : countsByColor[b] - countsByColor[a])
                || a.localeCompare(b))
    }

    const getPlotTitle = (settings) => {
        const columns = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME
        const x = columns[settings.x].displayName
        const y = settings.y ? columns[settings.y].displayName : ''
        let title
        if (settings.type === 'scatter') {
            title = `${y} vs. ${x}`
        } else if (settings.type === 'box') {
            title = `${y} by ${x}`
        } else if (isHistogramPlot(settings)) {
            title = y ? `${PLOT_AGGREGATE_LABELS[settings.agg]} ${y} by ${x}` : `Distribution of ${x}`
        } else {
            title = y ? `${PLOT_AGGREGATE_LABELS[settings.agg]} ${y} by ${x}` : `Number of loci by ${x}`
        }
        return settings.color ? `${title}, colored by ${columns[settings.color].displayName}` : title
    }

    const pluralizeLoci = (n) => `${formatPlotNumber(n)} ${n === 1 ? 'locus' : 'loci'}`

    // Sentences about the loci that the plot leaves out because they're in hidden categories
    const describeHiddenCategories = (settings, xTotalRows, leafRows) => {
        const columns = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME
        const sentences = []
        const countLoci = (rowsToCount, label) => rowsToCount.filter(r => r.x_label === label).reduce((sum, r) => sum + r.n, 0)
        const xName = columns[settings.x].displayName
        if (doesPlotHaveCategoricalXAxis(settings) && settings.other !== 1 && countLoci(xTotalRows, PLOT_OTHER_CATEGORY) > 0) {
            sentences.push(`${pluralizeLoci(countLoci(xTotalRows, PLOT_OTHER_CATEGORY))} whose ${xName} is not among the ${settings.topN} most frequent values are not shown.`)
        }
        if (settings.missing !== 1 && countLoci(xTotalRows, PLOT_MISSING_CATEGORY) > 0) {
            sentences.push(`${pluralizeLoci(countLoci(xTotalRows, PLOT_MISSING_CATEGORY))} with no ${xName} value are not shown.`)
        }
        if (settings.color) {
            const colorName = columns[settings.color].displayName
            // Loci in a log histogram's excluded bin aren't plotted at all, and have their own caption sentence
            const shownXLabels = new Set(xTotalRows.filter(r => isCategoryShown(r.x_label, settings) && r.x_label !== PLOT_EXCLUDED_BIN).map(r => r.x_label))
            const countColorLoci = (label) => leafRows.filter(r => r.c_label === label && shownXLabels.has(r.x_label)).reduce((sum, r) => sum + r.n, 0)
            if (settings.other !== 1 && countColorLoci(PLOT_OTHER_CATEGORY) > 0) {
                sentences.push(`${pluralizeLoci(countColorLoci(PLOT_OTHER_CATEGORY))} whose ${colorName} is not among the ${getNumColorCategories(settings)} most frequent values are not shown.`)
            }
            if (settings.missing !== 1 && countColorLoci(PLOT_MISSING_CATEGORY) > 0) {
                sentences.push(`${pluralizeLoci(countColorLoci(PLOT_MISSING_CATEGORY))} with no ${colorName} value are not shown.`)
            }
        }
        return sentences
    }

    /**
     * Orders a bar or box plot's x categories by the plot's sort settings. The "Other" and "Missing" categories always
     * go last.
     *
     * Args:
     *   settings: plot settings
     *   xLabels: the x categories to order
     *   heightsByXLabel: the bar heights, or the box medians
     *   xTotalRowsByXLabel: the query row with each x category's totals over the color categories
     */
    const sortPlotCategories = (settings, xLabels, heightsByXLabel, xTotalRowsByXLabel) => {
        const xColumn = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME[settings.x]
        const sortKey = (label) => {
            const row = xTotalRowsByXLabel[label]
            if (settings.sort === 'height') return heightsByXLabel[label]
            if (settings.sort === 'count') return row.n
            if (settings.sort === 'value') return xColumn.type === 'STRING' ? label : Number(label)
            return row.s_n > 0 ? row.s_sum / row.s_n : null
        }
        const direction = settings.dir === 'asc' ? 1 : -1
        return [...xLabels].sort((a, b) => {
            const specialRankDifference = specialCategoryRank(a) - specialCategoryRank(b)
            if (specialRankDifference !== 0 || specialCategoryRank(a) > 0) return specialRankDifference
            const [keyA, keyB] = [sortKey(a), sortKey(b)]
            // Categories without a sort key (e.g. no values in the sort column) go last in either direction
            if (keyA === null || keyA === undefined) return (keyB === null || keyB === undefined) ? 0 : 1
            if (keyB === null || keyB === undefined) return -1
            // Numeric comparison of digit runs puts text values like chromosome "9" before "10"
            const comparison = typeof keyA === 'string' ? keyA.localeCompare(keyB, undefined, {numeric: true}) : keyA - keyB
            return direction * comparison || a.localeCompare(b, undefined, {numeric: true})
        })
    }

    /**
     * Returns the smallest whole number whose plotted position on the given log or symmetric log axis is at or
     * after the given (plotted) bin edge. So for an integer column, the filter >= this number selects the same loci
     * as the histogram query's comparison of plotted positions with the edge.
     */
    const smallestIntegerAtOrAfterPlottedEdge = (edge, scale) => {
        const {transform, inverse} = PLOT_SCALE_TRANSFORMS[scale]
        let n = Math.ceil(inverse(edge))
        while (transform(n - 1) >= edge) n--
        while (transform(n) < edge) n++
        return n
    }

    /**
     * Returns the raw value at a (plotted) bin edge on a log or symmetric log axis, rounded to 12 significant digits
     * when the rounded value is still plotted at or after the edge, so that e.g. a value of exactly 9 lands in the
     * bin that starts at symlog(9) both in the histogram query and in the click filter.
     */
    const roundedValueAtOrAfterPlottedEdge = (edge, scale) => {
        const {transform, inverse} = PLOT_SCALE_TRANSFORMS[scale]
        const rounded = Number(inverse(edge).toPrecision(12))
        return transform(rounded) >= edge ? rounded : inverse(edge)
    }

    // The labels and sort order of a histogram's bins, from the bin edges that the query returned
    const getHistogramBins = (settings, rows) => {
        const xColumn = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME[settings.x]
        const firstRow = rows[0]
        if (!firstRow || firstRow.bin_range_lo === null || firstRow.bin_range_lo === undefined) return []
        const {bin_range_lo: lo, bin_range_hi: hi, bin_width: width} = firstRow
        const isIntegerBins = xColumn.type === 'INTEGER' && settings.xScale === 'linear'
        const numBins = isIntegerBins ? Math.ceil((hi - lo + 1) / width) : (width > 0 ? settings.bins : 1)
        const toRawValue = PLOT_SCALE_TRANSFORMS[settings.xScale].inverse
        const bins = []
        for (let i = 0; i < numBins; i++) {
            // rawStart and rawEnd are the bin's range, used to filter the search results to it. Integer bins
            // include rawEnd, the others don't (except the last bin).
            let displayLabel, rawStart, rawEnd
            if (isIntegerBins) {
                // The last bin can extend past the largest value, so its label stops there
                [rawStart, rawEnd] = [lo + i * width, Math.min(lo + (i + 1) * width - 1, hi)]
                displayLabel = rawStart === rawEnd ? formatPlotNumber(rawStart) : `${formatPlotNumber(rawStart)}-${formatPlotNumber(rawEnd)}`
            } else {
                [rawStart, rawEnd] = [toRawValue(lo + i * width), toRawValue(width > 0 ? lo + (i + 1) * width : hi)]
                displayLabel = `${formatPlotNumber(rawStart)}-${formatPlotNumber(rawEnd)}`
            }
            // The edges that the click filter uses. On a log or symmetric log axis, the inverse of an edge can round
            // to just past the value it stands for (e.g. 10 ** log10(5) is 5.000000000000001), so an integer
            // column's edges are whole numbers, and other columns' edges are rounded when that keeps them on the
            // same side of the edge.
            const plottedEdges = [lo + i * width, lo + (i + 1) * width]
            let [filterStart, filterEnd] = [rawStart, rawEnd]
            if (settings.xScale !== 'linear' && width > 0) {
                [filterStart, filterEnd] = plottedEdges.map(edge => xColumn.type === 'INTEGER'
                    ? smallestIntegerAtOrAfterPlottedEdge(edge, settings.xScale)
                    : roundedValueAtOrAfterPlottedEdge(edge, settings.xScale))
            }
            bins.push({xLabel: String(i), displayLabel, rawStart: filterStart, rawEnd: filterEnd, isFirstBin: i === 0, isLastBin: i === numBins - 1, isIntegerBins})
        }
        return bins
    }

    const buildBarPlotChart = (settings, rows) => {
        const columns = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME
        const histogram = isHistogramPlot(settings)
        const stacked = isStackedBarPlot(settings)
        const percent = stacked && settings.pct === 1
        const leafRows = rows.filter(r => r.is_grand_total === 0 && r.is_total_over_colors === 0)
        const xTotalRows = rows.filter(r => r.is_grand_total === 0 && r.is_total_over_colors === 1)
        const xTotalRowsByXLabel = Object.fromEntries(xTotalRows.map(r => [r.x_label, r]))
        const grandTotalRow = rows.find(r => r.is_grand_total === 1)
        const barValue = (row) => settings.y ? row.y_value : row.n
        const colorLabels = getShownColorCategories(settings, rows)

        // valuesByXLabel[xLabel][colorLabel] = the bar (or bar segment) value
        const valuesByXLabel = {}
        leafRows.forEach(r => {
            valuesByXLabel[r.x_label] = valuesByXLabel[r.x_label] || {}
            valuesByXLabel[r.x_label][settings.color ? r.c_label : ''] = barValue(r)
        })

        let xCategories
        if (histogram) {
            xCategories = getHistogramBins(settings, rows)
            if (settings.missing === 1 && xTotalRowsByXLabel[PLOT_MISSING_CATEGORY]) {
                xCategories.push({xLabel: PLOT_MISSING_CATEGORY, displayLabel: 'Missing'})
            }
        } else {
            const shownXLabels = xTotalRows.map(r => r.x_label).filter(label => isCategoryShown(label, settings))
            const heightsByXLabel = Object.fromEntries(shownXLabels.map(label => [label, stacked
                ? colorLabels.reduce((sum, c) => sum + (valuesByXLabel[label]?.[c] || 0), 0)
                : barValue(xTotalRowsByXLabel[label])]))
            xCategories = sortPlotCategories(settings, shownXLabels, heightsByXLabel, xTotalRowsByXLabel)
                .map(label => ({xLabel: label, displayLabel: plotCategoryDisplayLabel(label)}))
        }

        // Percent stacks divide by the sum of the segments' absolute values, so that sums of a signed column (which
        // can add up to 0 or less) still give each segment a share with its own sign
        const stackAbsoluteTotals = xCategories.map(({xLabel}) => colorLabels.reduce((sum, c) => sum + Math.abs(valuesByXLabel[xLabel]?.[c] || 0), 0))
        // On a symmetric log axis, stacked segments are drawn as floating bars between the scaled running totals,
        // since Chart.js would otherwise add up the scaled values
        const drawStackAsFloatingBars = stacked && !percent && settings.yScale === 'symlog'
        // Like Chart.js's own stacking, negative values (possible in sums) stack downward from 0 separately from the
        // positive ones
        const positiveRunningTotals = xCategories.map(() => 0)
        const negativeRunningTotals = xCategories.map(() => 0)
        const datasets = colorLabels.map((colorLabel, colorIndex) => {
            const rawValues = xCategories.map(({xLabel}, i) => {
                const value = valuesByXLabel[xLabel]?.[colorLabel]
                if (value === undefined || value === null) return null
                return percent ? (stackAbsoluteTotals[i] > 0 ? 100 * value / stackAbsoluteTotals[i] : 0) : value
            })
            const data = rawValues.map((value, i) => {
                if (value === null) return null
                if (!drawStackAsFloatingBars) return toPlottedValue(value, percent ? 'linear' : settings.yScale)
                const runningTotals = value >= 0 ? positiveRunningTotals : negativeRunningTotals
                const segment = [symlogTransform(runningTotals[i]), symlogTransform(runningTotals[i] + value)]
                runningTotals[i] += value
                return segment
            })
            const color = settings.color ? colorForCategory(colorLabel, colorIndex) : PLOT_SINGLE_SERIES_COLOR
            return {
                label: settings.color ? plotCategoryDisplayLabel(colorLabel) : (settings.y ? `${PLOT_AGGREGATE_LABELS[settings.agg]} ${columns[settings.y].displayName}` : 'Number of loci'),
                data,
                rawValues,
                backgroundColor: hexColorWithAlpha(color, 0.75),
                borderColor: color,
                borderWidth: 1,
                grouped: !drawStackAsFloatingBars,
                ...(histogram && (stacked || !settings.color) ? {barPercentage: 1, categoryPercentage: 1} : {}),
            }
        })

        const yValueTitle = settings.y ? `${PLOT_AGGREGATE_LABELS[settings.agg]} ${columns[settings.y].displayName}` : 'Number of loci'
        // Percent stacks of sums show each color's share of the summed values, not of the loci
        const yTitle = percent ? (settings.y ? `Percent of summed ${columns[settings.y].displayName}` : 'Percent of loci') : yValueTitle
        const xTitle = histogram ? `${columns[settings.x].displayName}${settings.xScale === 'linear' ? '' : ` (${PLOT_SCALE_LABELS[settings.xScale]} bins)`}` : columns[settings.x].displayName
        const yScale = percent ? 'linear' : settings.yScale
        // Bars start at the bottom of the axis. A log axis would otherwise start at the smallest bar's value,
        // drawing that bar (e.g. a category with 1 locus) with no height, so it starts at the power of 10 below it.
        const smallestPositiveBarValue = Math.min(...datasets.flatMap(d => d.rawValues).filter(v => v !== null && v > 0))
        // Percent stacks end at 100 (floating point rounding can make a stack's sum a hair over 100, which would
        // stretch the axis to 120)
        const yAxisStartOptions = percent ? {beginAtZero: true, max: 100}
            : yScale === 'linear' ? {beginAtZero: true}
            : (yScale === 'log' && Number.isFinite(smallestPositiveBarValue) ? {min: Math.pow(10, Math.floor(Math.log10(smallestPositiveBarValue * 0.999)))} : {})

        const captionSentences = [`Based on ${pluralizeLoci(grandTotalRow ? grandTotalRow.n : 0)} in the search results.`]
        if (settings.y) {
            const aggregateDescription = {mean: 'mean', median: 'approximate median', min: 'minimum', max: 'maximum', sum: 'sum'}[settings.agg]
            captionSentences.push(`Bar heights show the ${aggregateDescription} of ${columns[settings.y].displayName} over the loci in each ${histogram ? 'bin' : 'category'}.`)
            const shownXLabelSet = new Set(xCategories.map(c => c.xLabel))
            const shownColorLabelSet = new Set(colorLabels)
            const lociWithoutY = leafRows.filter(r => shownXLabelSet.has(r.x_label) && shownColorLabelSet.has(settings.color ? r.c_label : ''))
                .reduce((sum, r) => sum + r.n - r.n_y, 0)
            if (lociWithoutY > 0) {
                captionSentences.push(`${pluralizeLoci(lociWithoutY)} with no ${columns[settings.y].displayName} value are not included in the bar heights.`)
            }
        }
        if (percent && settings.y) {
            captionSentences.push(`Each bar's percentages are shares of the sum of the absolute values of its segments, so negative sums show as negative percentages.`)
        }
        if (yScale === 'log') {
            const numNonPositiveBars = datasets.flatMap(d => d.rawValues).filter(v => v !== null && v <= 0).length
            if (numNonPositiveBars > 0) {
                captionSentences.push(`${formatPlotNumber(numNonPositiveBars)} ${numNonPositiveBars === 1 ? 'bar has a value' : 'bars have values'} ≤ 0 that can't be shown on a log scale.`)
            }
        }
        if (histogram) {
            const excludedRow = xTotalRowsByXLabel[PLOT_EXCLUDED_BIN]
            if (excludedRow) captionSentences.push(`${pluralizeLoci(excludedRow.n)} with ${columns[settings.x].displayName} ≤ 0 can't be shown on a log scale.`)
        }
        captionSentences.push(...describeHiddenCategories(settings, xTotalRows, leafRows))

        return {
            chartConfig: {
                type: 'bar',
                data: {labels: xCategories.map(c => c.displayLabel), datasets},
                options: {
                    scales: {
                        x: {stacked: stacked && !drawStackAsFloatingBars, title: {display: true, text: xTitle, font: {size: 13}}},
                        y: buildNumericAxisOptions(yScale, yTitle, {stacked: stacked && !drawStackAsFloatingBars, ...yAxisStartOptions}),
                    },
                    plugins: {
                        legend: {
                            display: !!settings.color,
                            title: {display: !!settings.color, text: settings.color ? columns[settings.color].displayName : ''},
                            // Floating stack segments are positioned from all the colors' values, so hiding a color
                            // from the legend would leave the others at the wrong heights
                            ...(drawStackAsFloatingBars ? {onClick: () => {}} : {}),
                        },
                        tooltip: {callbacks: {label: (context) => {
                            const value = context.dataset.rawValues[context.dataIndex]
                            return `${context.dataset.label}: ${percent ? `${formatPlotNumber(value)}%` : formatPlotNumber(value)}`
                        }}},
                    },
                },
            },
            captionSentences,
            clickTargets: {xCategories, colorLabels},
        }
    }

    // Draws each box's median line and whiskers, from the boxPlotStats that buildBoxPlotChart adds to its datasets.
    // The boxes themselves are floating bars from the 25th to the 75th percentile.
    const BOX_PLOT_MEDIANS_AND_WHISKERS_PLUGIN = {
        id: 'boxPlotMediansAndWhiskers',
        afterDatasetsDraw: (chart) => {
            const ctx = chart.ctx
            const yAxis = chart.scales.y
            chart.data.datasets.forEach((dataset, datasetIndex) => {
                const meta = chart.getDatasetMeta(datasetIndex)
                if (!dataset.boxPlotStats || meta.hidden) return
                meta.data.forEach((bar, i) => {
                    const stats = dataset.boxPlotStats[i]
                    if (!stats) return
                    const {x, width} = bar.getProps(['x', 'width'], true)
                    const [q1, median, q3, lowerWhisker, upperWhisker] = [stats.q1, stats.median, stats.q3, stats.lowerWhisker, stats.upperWhisker]
                        .map(v => v === null ? null : yAxis.getPixelForValue(v))
                    ctx.save()
                    ctx.strokeStyle = dataset.borderColor
                    ctx.lineWidth = 1.5
                    ctx.beginPath()
                    const drawLine = (x1, y1, x2, y2) => { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2) }
                    if (upperWhisker !== null) { drawLine(x, q3, x, upperWhisker); drawLine(x - width / 4, upperWhisker, x + width / 4, upperWhisker) }
                    if (lowerWhisker !== null) { drawLine(x, q1, x, lowerWhisker); drawLine(x - width / 4, lowerWhisker, x + width / 4, lowerWhisker) }
                    ctx.stroke()
                    ctx.beginPath()
                    ctx.lineWidth = 3
                    if (median !== null) drawLine(x - width / 2, median, x + width / 2, median)
                    ctx.stroke()
                    ctx.restore()
                })
            })
        },
    }

    const buildBoxPlotChart = (settings, rows) => {
        const columns = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME
        const leafRows = rows.filter(r => r.is_grand_total === 0 && r.is_total_over_colors === 0)
        const xTotalRows = rows.filter(r => r.is_grand_total === 0 && r.is_total_over_colors === 1)
        const xTotalRowsByXLabel = Object.fromEntries(xTotalRows.map(r => [r.x_label, r]))
        const grandTotalRow = rows.find(r => r.is_grand_total === 1)
        const colorLabels = getShownColorCategories(settings, rows)
        const leafRowsByLabels = Object.fromEntries(leafRows.map(r => [`${r.x_label}\t${settings.color ? r.c_label : ''}`, r]))

        const shownXLabels = xTotalRows.map(r => r.x_label).filter(label => isCategoryShown(label, settings))
        const mediansByXLabel = Object.fromEntries(shownXLabels.map(label => [label, xTotalRowsByXLabel[label].median]))
        const xLabels = sortPlotCategories(settings, shownXLabels, mediansByXLabel, xTotalRowsByXLabel)

        const datasets = colorLabels.map((colorLabel, colorIndex) => {
            const boxRows = xLabels.map(xLabel => {
                const row = leafRowsByLabels[`${xLabel}\t${colorLabel}`]
                return row && row.n_y > 0 ? row : null
            })
            const color = settings.color ? colorForCategory(colorLabel, colorIndex) : PLOT_SINGLE_SERIES_COLOR
            return {
                label: settings.color ? plotCategoryDisplayLabel(colorLabel) : columns[settings.y].displayName,
                data: boxRows.map(r => r ? [toPlottedValue(r.q1, settings.yScale), toPlottedValue(r.q3, settings.yScale)] : null),
                boxRows,
                boxPlotStats: boxRows.map(r => r ? {
                    q1: toPlottedValue(r.q1, settings.yScale),
                    median: toPlottedValue(r.median, settings.yScale),
                    q3: toPlottedValue(r.q3, settings.yScale),
                    lowerWhisker: toPlottedValue(r.lower_whisker, settings.yScale),
                    upperWhisker: toPlottedValue(r.upper_whisker, settings.yScale),
                } : null),
                backgroundColor: hexColorWithAlpha(color, 0.35),
                borderColor: color,
                borderWidth: 1.5,
                borderSkipped: false,
            }
        })

        // The whiskers can reach beyond the boxes, so the y-axis has to span them
        const plottedValues = datasets.flatMap(d => d.boxPlotStats.filter(Boolean).flatMap(s => [s.lowerWhisker, s.upperWhisker, s.q1, s.q3])).filter(v => v !== null)
        const yAxisRange = plottedValues.length > 0 ? {suggestedMin: Math.min(...plottedValues), suggestedMax: Math.max(...plottedValues)} : {}

        const yName = columns[settings.y].displayName
        const captionSentences = [
            `Based on ${pluralizeLoci(grandTotalRow ? grandTotalRow.n : 0)} in the search results. Boxes span the 25th to 75th percentiles (approximate) of ${yName}, the thick line is the median, and the whiskers reach the most extreme values that are within 1.5 times the interquartile range (the 75th minus the 25th percentile, in ${yName} units) of the box.`,
        ]
        const shownXLabelSet = new Set(xLabels)
        const shownColorLabelSet = new Set(colorLabels)
        const lociWithoutY = leafRows.filter(r => shownXLabelSet.has(r.x_label) && shownColorLabelSet.has(settings.color ? r.c_label : ''))
            .reduce((sum, r) => sum + r.n - r.n_y, 0)
        if (lociWithoutY > 0) {
            captionSentences.push(`${pluralizeLoci(lociWithoutY)} with no ${yName} value${settings.yScale === 'log' ? ', or a value ≤ 0 that a log scale can\'t show,' : ''} are not included.`)
        }
        captionSentences.push(...describeHiddenCategories(settings, xTotalRows, leafRows))

        return {
            chartConfig: {
                type: 'bar',
                data: {labels: xLabels.map(plotCategoryDisplayLabel), datasets},
                options: {
                    scales: {
                        x: {title: {display: true, text: columns[settings.x].displayName, font: {size: 13}}},
                        // Bar charts start the value axis at 0 by default, which would squash boxes of values far from 0
                        y: buildNumericAxisOptions(settings.yScale, yName, {beginAtZero: false, ...yAxisRange}),
                    },
                    plugins: {
                        legend: {display: !!settings.color, title: {display: !!settings.color, text: settings.color ? columns[settings.color].displayName : ''}},
                        tooltip: {callbacks: {label: (context) => {
                            const row = context.dataset.boxRows[context.dataIndex]
                            if (!row) return ''
                            return [
                                settings.color ? `${context.dataset.label}:` : `${pluralizeLoci(row.n_y)}`,
                                ...(settings.color ? [`${pluralizeLoci(row.n_y)}`] : []),
                                `upper whisker: ${formatPlotNumber(row.upper_whisker)}`,
                                `75th percentile: ${formatPlotNumber(row.q3)}`,
                                `median: ${formatPlotNumber(row.median)}`,
                                `25th percentile: ${formatPlotNumber(row.q1)}`,
                                `lower whisker: ${formatPlotNumber(row.lower_whisker)}`,
                            ]
                        }}},
                    },
                },
                plugins: [BOX_PLOT_MEDIANS_AND_WHISKERS_PLUGIN],
            },
            captionSentences,
            clickTargets: {xCategories: xLabels.map(xLabel => ({xLabel})), colorLabels},
        }
    }

    /**
     * Returns the scatter plot caption sentences about how many loci the search returned and which of them can't be
     * shown, from the counts that every row of the scatter plot query holds (firstRow is undefined if it returned none).
     */
    const describeScatterPlotLociNotShown = (settings, firstRow) => {
        const xName = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME[settings.x].displayName
        const yName = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME[settings.y].displayName
        if (!firstRow) return [`None of the loci in the search results have both a ${xName} and a ${yName} value that can be shown.`]
        const sentences = [`Based on ${pluralizeLoci(firstRow.n_rows)} in the search results.`]
        if (firstRow.n_rows > firstRow.n_with_x_and_y) {
            sentences.push(`${pluralizeLoci(firstRow.n_rows - firstRow.n_with_x_and_y)} with no ${xName} or no ${yName} value are not shown.`)
        }
        if (firstRow.n_with_x_and_y > firstRow.n_plotable) {
            sentences.push(`${pluralizeLoci(firstRow.n_with_x_and_y - firstRow.n_plotable)} with a value ≤ 0 can't be shown on a log scale.`)
        }
        return sentences
    }

    // Uncolored scatter plots of more loci than a sample holds (MAX_SCATTER_PLOT_POINTS) are drawn as a grid of this
    // many cells, colored by how many loci fall in each, so that every locus counts (a colored scatter plot shows a
    // sample instead, since a cell can't show the colors of its loci)
    const SCATTER_PLOT_HEATMAP_NUM_COLUMNS = 60
    const SCATTER_PLOT_HEATMAP_NUM_ROWS = 40

    // The scatter plot counts that describeScatterPlotLociNotShown needs, from the rows of a heatmap query (whose
    // cells hold all the loci that can be shown), or undefined if no locus can be shown
    const getScatterPlotCountsFromHeatmapRows = (heatmapRows) => heatmapRows.length === 0 ? undefined : {
        n_rows: heatmapRows[0].n_rows,
        n_with_x_and_y: heatmapRows[0].n_with_x_and_y,
        n_plotable: heatmapRows.reduce((sum, r) => sum + r.n, 0),
    }

    const shouldDrawScatterPlotAsHeatmap = (heatmapRows) => heatmapRows.length > 0 &&
        getScatterPlotCountsFromHeatmapRows(heatmapRows).n_plotable > MAX_SCATTER_PLOT_POINTS

    /**
     * Returns the SQL query that counts the loci in each cell of a scatter plot heatmap. The cells divide the range of
     * the plotted (scaled) x and y values into equal parts. Every row also holds the ranges, the number of loci in the
     * search results (n_rows), and how many of them have both an x and a y value (n_with_x_and_y).
     */
    const buildScatterPlotHeatmapQuery = (settings, completeTableId, whereClause) => {
        const columns = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME
        const cellIndexSql = (value, lo, hi, numCells) =>
            `LEAST(${numCells - 1}, CAST(IFNULL(FLOOR(SAFE_DIVIDE(${value} - ${lo}, (${hi} - ${lo}) / ${numCells})), 0) AS INT64))`
        return `WITH base AS (SELECT ${plotNumberExpression(columns[settings.x])} AS x, ${plotNumberExpression(columns[settings.y])} AS y ` +
            `${`FROM ${completeTableId} ${whereClause}`.trim()}), ` +
            `transformed AS (SELECT ${plotScaleTransformSql('x', settings.xScale)} AS tx, ${plotScaleTransformSql('y', settings.yScale)} AS ty FROM base), ` +
            'plotable AS (SELECT tx, ty FROM transformed WHERE tx IS NOT NULL AND ty IS NOT NULL), ' +
            'ranges AS (SELECT MIN(tx) AS x_lo, MAX(tx) AS x_hi, MIN(ty) AS y_lo, MAX(ty) AS y_hi FROM plotable), ' +
            'counts AS (SELECT COUNT(*) AS n_rows, COUNTIF(x IS NOT NULL AND y IS NOT NULL) AS n_with_x_and_y FROM base) ' +
            `SELECT ${cellIndexSql('tx', 'x_lo', 'x_hi', SCATTER_PLOT_HEATMAP_NUM_COLUMNS)} AS x_cell, ` +
            `${cellIndexSql('ty', 'y_lo', 'y_hi', SCATTER_PLOT_HEATMAP_NUM_ROWS)} AS y_cell, COUNT(*) AS n, ` +
            'ANY_VALUE(x_lo) AS x_lo, ANY_VALUE(x_hi) AS x_hi, ANY_VALUE(y_lo) AS y_lo, ANY_VALUE(y_hi) AS y_hi, ' +
            'ANY_VALUE(n_rows) AS n_rows, ANY_VALUE(n_with_x_and_y) AS n_with_x_and_y ' +
            'FROM plotable CROSS JOIN ranges CROSS JOIN counts GROUP BY x_cell, y_cell ORDER BY x_cell, y_cell'
    }

    const buildScatterPlotHeatmapChart = (settings, heatmapRows) => {
        const columns = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME
        const xName = columns[settings.x].displayName
        const yName = columns[settings.y].displayName
        const {x_lo: xLo, x_hi: xHi, y_lo: yLo, y_hi: yHi} = heatmapRows[0]
        // A range of one value still gets cells of nonzero size
        const [xSpan, ySpan] = [(xHi - xLo) || 1, (yHi - yLo) || 1]
        const [cellWidth, cellHeight] = [xSpan / SCATTER_PLOT_HEATMAP_NUM_COLUMNS, ySpan / SCATTER_PLOT_HEATMAP_NUM_ROWS]
        const maxCount = Math.max(...heatmapRows.map(r => r.n))
        const [xInverse, yInverse] = [PLOT_SCALE_TRANSFORMS[settings.xScale].inverse, PLOT_SCALE_TRANSFORMS[settings.yScale].inverse]

        const data = heatmapRows.map(r => ({
            x: xLo + (r.x_cell + 0.5) * cellWidth,
            y: yLo + (r.y_cell + 0.5) * cellHeight,
            v: r.n,
            xRange: [xInverse(xLo + r.x_cell * cellWidth), xInverse(xLo + (r.x_cell + 1) * cellWidth)],
            yRange: [yInverse(yLo + r.y_cell * cellHeight), yInverse(yLo + (r.y_cell + 1) * cellHeight)],
        }))
        // The values are already scaled, so log and symmetric log axes are linear axes labeled with the original values.
        // The axes span exactly the cells (so each cell is 1/60 or 1/40 of the axis), without labeling those ends,
        // and the matrix chart's default of drawing y downward is turned off.
        const axisOptions = (scale, title, min, max) => scale === 'linear'
            ? buildNumericAxisOptions('linear', title, {min, max, reverse: false, offset: false, ticks: {includeBounds: false}})
            : buildTransformedValueAxisOptions(scale, title, {min, max, reverse: false, offset: false})

        const counts = getScatterPlotCountsFromHeatmapRows(heatmapRows)
        const captionSentences = describeScatterPlotLociNotShown(settings, counts)
        captionSentences.push(`Each cell's color shows how many of the ${pluralizeLoci(counts.n_plotable)} that can be shown have values in its ranges (darker means more, on a log scale of the counts).`)

        return {
            chartConfig: {
                type: 'matrix',
                data: {datasets: [{
                    label: 'Loci',
                    data,
                    backgroundColor: (context) => {
                        const count = context.dataset.data[context.dataIndex].v
                        return `rgba(33, 133, 208, ${0.08 + 0.92 * Math.log1p(count) / Math.log1p(maxCount)})`
                    },
                    borderWidth: 0,
                    width: ({chart}) => (chart.chartArea || {width: 0}).width / SCATTER_PLOT_HEATMAP_NUM_COLUMNS,
                    height: ({chart}) => (chart.chartArea || {height: 0}).height / SCATTER_PLOT_HEATMAP_NUM_ROWS,
                }]},
                options: {
                    scales: {
                        x: axisOptions(settings.xScale, xName, xLo, xLo + xSpan),
                        y: axisOptions(settings.yScale, yName, yLo, yLo + ySpan),
                    },
                    plugins: {
                        legend: {display: false},
                        tooltip: {callbacks: {
                            title: () => '',
                            label: (context) => {
                                const cell = context.raw
                                return `${pluralizeLoci(cell.v)} with ${xName} ${formatPlotNumber(cell.xRange[0])} to ${formatPlotNumber(cell.xRange[1])} and ${yName} ${formatPlotNumber(cell.yRange[0])} to ${formatPlotNumber(cell.yRange[1])}`
                            },
                        }},
                    },
                },
            },
            captionSentences,
        }
    }

    /**
     * Returns the custom filters that keep only the loci of a clicked bar, bar segment or box, or null when that's
     * not possible: the "Other" category (loci outside the top N), and the "Missing" category of a text column
     * (which covers both missing and empty values), have no single custom filter.
     *
     * Args:
     *   settings: the plot's settings
     *   xCategory: the clicked x position, as in buildBarPlotChart's xCategories (histogram bins have rawStart,
     *     rawEnd, isFirstBin, isLastBin and isIntegerBins)
     *   colorLabel: the clicked dataset's color category, or '' for plots with no color column
     */
    const getCustomFiltersForClickedPlotElement = (settings, xCategory, colorLabel) => {
        // Bin edges are written in full (String gives the exact floating point value), since rounding them would move
        // loci near an edge into the neighboring bin
        const filter = (column, operator, value) => ({column, operator, value: String(value), enabled: true})
        // The filter for one category of a column, or null if no single filter selects it
        const categoryFilter = (column, label) => {
            if (label === PLOT_OTHER_CATEGORY || label === PLOT_EXCLUDED_BIN) return null
            if (label === PLOT_MISSING_CATEGORY) {
                return SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME[column].type === 'STRING' ? null : filter(column, 'IS NULL', '')
            }
            return filter(column, '=', label)
        }
        const filters = []
        if (xCategory.rawStart === undefined) {
            filters.push(categoryFilter(settings.x, xCategory.xLabel))
        } else {
            // The first and last bins are left open, so that rounding of their edges can't leave out the extreme values
            if (!xCategory.isFirstBin) filters.push(filter(settings.x, '>=', xCategory.rawStart))
            else if (settings.xScale === 'log') filters.push(filter(settings.x, '>', 0))
            if (!xCategory.isLastBin) filters.push(filter(settings.x, xCategory.isIntegerBins ? '<=' : '<', xCategory.rawEnd))
            if (filters.length === 0) filters.push(filter(settings.x, 'IS NOT NULL', ''))
        }
        if (settings.color) filters.push(categoryFilter(settings.color, colorLabel))
        if (filters.includes(null)) return null
        // A box only summarizes the loci whose y value its axis can show
        if (settings.type === 'box') {
            filters.push(settings.yScale === 'log' ? filter(settings.y, '>', 0) : filter(settings.y, 'IS NOT NULL', ''))
        }
        return filters
    }

    const buildScatterPlotChart = (settings, rows) => {
        const columns = SEARCH_RESULTS_PLOT_COLUMNS_BY_NAME
        const colorLabels = getShownColorCategories(settings, rows)
        const datasets = colorLabels.map((colorLabel, colorIndex) => {
            const color = settings.color ? colorForCategory(colorLabel, colorIndex) : PLOT_SINGLE_SERIES_COLOR
            return {
                label: settings.color ? plotCategoryDisplayLabel(colorLabel) : 'Loci',
                data: rows.filter(r => !settings.color || r.c_label === colorLabel).map(r => ({
                    x: toPlottedValue(r.x, settings.xScale),
                    y: toPlottedValue(r.y, settings.yScale),
                    rawX: r.x,
                    rawY: r.y,
                    locusId: r.LocusId,
                })),
                backgroundColor: hexColorWithAlpha(color, 0.6),
                borderColor: hexColorWithAlpha(color, 0.9),
                pointRadius: 2.5,
                pointHoverRadius: 5,
            }
        })

        const xName = columns[settings.x].displayName
        const yName = columns[settings.y].displayName
        const firstRow = rows[0]
        const captionSentences = describeScatterPlotLociNotShown(settings, firstRow)
        if (firstRow) {
            if (firstRow.n_plotable > rows.length) {
                captionSentences.push(`To keep the plot fast, it shows a random sample of ${formatPlotNumber(rows.length)} of the ${pluralizeLoci(firstRow.n_plotable)} that can be shown (the same sample every time).`)
            }
            if (settings.color) {
                const hiddenColorLoci = rows.filter(r => !isCategoryShown(r.c_label, settings)).length
                if (hiddenColorLoci > 0) {
                    captionSentences.push(`${formatPlotNumber(hiddenColorLoci)} of these loci are hidden because their ${columns[settings.color].displayName} is missing or not among the ${getNumColorCategories(settings)} most frequent values.`)
                }
            }
        }

        return {
            chartConfig: {
                type: 'scatter',
                data: {datasets},
                options: {
                    scales: {
                        x: buildNumericAxisOptions(settings.xScale, xName),
                        y: buildNumericAxisOptions(settings.yScale, yName),
                    },
                    plugins: {
                        legend: {display: !!settings.color, title: {display: !!settings.color, text: settings.color ? columns[settings.color].displayName : ''}},
                        tooltip: {callbacks: {label: (context) => {
                            const point = context.raw
                            return `${point.locusId}: ${xName} = ${formatPlotNumber(point.rawX)}, ${yName} = ${formatPlotNumber(point.rawY)}`
                        }}},
                    },
                },
            },
            captionSentences,
        }
    }

    // Fills the background white, so that downloaded PNGs aren't transparent
    const WHITE_BACKGROUND_PLUGIN = {
        id: 'whiteBackground',
        beforeDraw: (chart) => {
            const ctx = chart.ctx
            ctx.save()
            ctx.globalCompositeOperation = 'destination-over'
            ctx.fillStyle = 'white'
            ctx.fillRect(0, 0, chart.width, chart.height)
            ctx.restore()
        },
    }

    /**
     * Returns {chartConfig, captionSentences, title, clickTargets} for a plot, given the rows that its query
     * returned, or for a scatter plot drawn as a heatmap, the rows of its heatmap query (rows is then unused).
     * clickTargets is undefined for scatter plots, and otherwise holds the xCategories and colorLabels that
     * getCustomFiltersForClickedPlotElement needs for each bar or box.
     */
    const buildSearchResultsPlotChart = (settings, rows, heatmapRows = null) => {
        const builders = {bar: buildBarPlotChart, box: buildBoxPlotChart, scatter: buildScatterPlotChart}
        const {chartConfig, captionSentences, clickTargets} = heatmapRows
            ? buildScatterPlotHeatmapChart(settings, heatmapRows)
            : builders[settings.type](settings, rows)
        chartConfig.options = {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            ...chartConfig.options,
        }
        chartConfig.plugins = [...(chartConfig.plugins || []), WHITE_BACKGROUND_PLUGIN]
        return {chartConfig, captionSentences, title: getPlotTitle(settings), clickTargets}
    }

    // --- Page wiring ---

    // The Chart.js charts currently on the page, so they can be destroyed before being redrawn
    let searchResultsPlotCharts = []
    // Promises of query result rows by SQL, so that redrawing the plots (e.g. after changing the results page) doesn't
    // rerun queries
    const searchResultsPlotQueryResultsCache = new Map()
    // What the plots were last drawn for, and a counter that lets a newer redraw discard an older one's results
    let searchResultsPlotsDrawnFor = null
    let searchResultsPlotsDrawSeq = 0

    const getSearchResultsPlotSettingsList = () => parseSearchResultsPlotSettingsList(GLOBAL_PAGE_STATE['plots'])

    const saveSearchResultsPlotSettingsList = (settingsList) => {
        GLOBAL_PAGE_STATE['plots'] = serializeSearchResultsPlotSettingsList(settingsList)
        writePersistentPageStateToUrl()
    }

    const getSearchResultsWhereClause = () => {
        const conditions = window.lastSearchConditions || []
        return conditions.length > 0 ? `WHERE ${conditions.join(' AND ')}` : ''
    }

    const fetchAllPagesOfPlotQuery = async (sql) => {
        // The settings' limits (at most 200 bins and 20 color categories) keep bar, box and histogram results under
        // one page, about 4,650 rows at most. This keeps fetching anyway, in case those limits or the proxy's page
        // size change.
        let result = await queryBigQuery(sql, 0, QUERY_PROXY_MAX_PAGE_SIZE, null, null)
        const rows = [...(result.rows || [])]
        while (result.next_page_start_index !== null && result.next_page_start_index !== undefined) {
            result = await queryBigQuery(sql, result.next_page_start_index, QUERY_PROXY_MAX_PAGE_SIZE, null, null)
            rows.push(...(result.rows || []))
        }
        return rows
    }

    const fetchSearchResultsPlotRows = (sql) => {
        // The cache holds the pending request too, so redrawing the plots while a query is still running (e.g. after
        // adding another plot) waits for it instead of sending the query again
        if (!searchResultsPlotQueryResultsCache.has(sql)) {
            searchResultsPlotQueryResultsCache.set(sql, fetchAllPagesOfPlotQuery(sql).catch((error) => {
                searchResultsPlotQueryResultsCache.delete(sql)  // so that a later redraw retries
                throw error
            }))
        }
        return searchResultsPlotQueryResultsCache.get(sql)
    }

    const drawSearchResultsPlot = async ($plot, settings, drawSeq) => {
        const whereClause = getSearchResultsWhereClause()
        try {
            // An uncolored scatter plot runs its heatmap query first, since that also counts the loci that can be
            // shown: the sample of loci is only needed (and fetched) when they're few enough for it to hold them all
            let heatmapRows = null
            if (settings.type === 'scatter' && !settings.color) {
                heatmapRows = await fetchSearchResultsPlotRows(buildScatterPlotHeatmapQuery(settings, COMPLETE_TABLE_ID, whereClause))
                if (!shouldDrawScatterPlotAsHeatmap(heatmapRows)) heatmapRows = null
            }
            const rows = heatmapRows ? [] : await fetchSearchResultsPlotRows(buildSearchResultsPlotQuery(settings, COMPLETE_TABLE_ID, whereClause))
            if (drawSeq !== searchResultsPlotsDrawSeq) return
            const {chartConfig, captionSentences, title, clickTargets} = buildSearchResultsPlotChart(settings, rows, heatmapRows)
            if (clickTargets) {
                // Clicking a bar or box adds custom filters that keep only its loci
                const getClickedElementFilters = (event, chart) => {
                    // A box whose 25th and 75th percentiles are equal has no height, so box plots take a click
                    // anywhere above or below a box (within its width) as a click on it
                    const isBoxPlot = settings.type === 'box'
                    const [element] = chart.getElementsAtEventForMode(event, 'nearest', {intersect: !isBoxPlot, axis: 'x'}, false)
                    // Chart.js lays out an empty slot (e.g. a color category with no loci in this x category) too
                    if (element && chart.data.datasets[element.datasetIndex].data[element.index] === null) return null
                    if (element && isBoxPlot) {
                        const {x, width} = element.element.getProps(['x', 'width'], true)
                        if (Math.abs(event.x - x) > width / 2) return null
                    }
                    return element ? getCustomFiltersForClickedPlotElement(
                        settings, clickTargets.xCategories[element.index], clickTargets.colorLabels[element.datasetIndex]) : null
                }
                chartConfig.options.onClick = (event, elements, chart) => {
                    const filters = getClickedElementFilters(event, chart)
                    if (filters) addCustomFilterGroupAndSearch(filters)
                }
                chartConfig.options.onHover = (event, elements, chart) => {
                    event.native.target.style.cursor = getClickedElementFilters(event, chart) ? 'pointer' : 'default'
                }
                const shape = settings.type === 'box' ? 'box' : 'bar'
                captionSentences.push(`Click a ${shape} to keep only its loci in the search results (this adds a custom filter)` +
                    (settings.other === 1 || settings.missing === 1
                        ? `, except for Other ${shape}s and the Missing ${shape}s of text columns (which also include empty values), since no single filter selects their loci.`
                        : '.'))
            }
            $plot.find('.search-results-plot-title').text(title)
            $plot.find('.search-results-plot-caption').text(captionSentences.join(' '))
            $plot.find('.search-results-plot-loading').hide()
            $plot.find('.search-results-plot-canvas-container').show()
            searchResultsPlotCharts.push(new Chart($plot.find('canvas')[0], chartConfig))
        } catch (error) {
            if (drawSeq !== searchResultsPlotsDrawSeq) return
            console.error('Error drawing plot:', error)
            // Let the next refresh (e.g. clicking Search again) retry instead of keeping this error
            searchResultsPlotsDrawnFor = null
            $plot.find('.search-results-plot-loading').hide()
            $plot.find('.search-results-plot-error').text(`Unable to draw this plot: ${error.message}`).show()
        }
    }

    /**
     * Draws the plots in the page state for the current search results, and shows the "Add plot..." link. Does
     * nothing if the plots were already drawn for the same search and settings.
     */
    const refreshSearchResultsPlots = () => {
        const totalResults = window.searchResults ? window.searchResults.total_results : 0
        if (totalResults < MIN_SEARCH_RESULTS_TO_SHOW_PLOTS) {
            $('#search-results-plots-area').hide()
            return
        }
        $('#search-results-plots-area').show()

        const whereClause = getSearchResultsWhereClause()
        const drawFor = `${whereClause}\n${GLOBAL_PAGE_STATE['plots']}`
        if (drawFor === searchResultsPlotsDrawnFor) return
        // Only the current search's results are worth keeping, so a new search drops the earlier searches' rows
        if (searchResultsPlotsDrawnFor !== null && !searchResultsPlotsDrawnFor.startsWith(`${whereClause}\n`)) {
            searchResultsPlotQueryResultsCache.clear()
        }
        searchResultsPlotsDrawnFor = drawFor
        const drawSeq = ++searchResultsPlotsDrawSeq

        searchResultsPlotCharts.forEach(chart => chart.destroy())
        searchResultsPlotCharts = []
        const $plots = $('#search-results-plots').empty()
        getSearchResultsPlotSettingsList().forEach((settings, plotIndex) => {
            const $plot = $(`
                <div class="search-results-plot" data-plot-index="${plotIndex}">
                    <div class="search-results-plot-title" style="font-weight: bold; text-align: center; margin-bottom: 8px"></div>
                    <div class="search-results-plot-loading loading-indicator">
                        <div class="ui small active inline loader"></div>
                        <span>Loading plot...</span>
                    </div>
                    <div class="search-results-plot-error ui negative message" style="display: none"></div>
                    <div class="search-results-plot-canvas-container" style="display: none"><canvas></canvas></div>
                    <div class="search-results-plot-caption"></div>
                    <div class="search-results-plot-links">
                        <a class="edit-search-results-plot-link">Edit plot...</a>
                        <a class="download-search-results-plot-link">Download PNG</a>
                        <a class="remove-search-results-plot-link">Remove plot</a>
                    </div>
                </div>`)
            $plots.append($plot)
            drawSearchResultsPlot($plot, settings, drawSeq)
        })
    }

    // --- Plot settings dialog ---

    // The plot that the dialog edits, or null when it adds a new plot
    let searchResultsPlotDialogPlotIndex = null
    // Set while the dialog's dropdowns are being filled in, so their onChange handlers don't respond
    let isFillingSearchResultsPlotDialog = false

    // Dropdown values that stand for "no column"
    const PLOT_DIALOG_NUMBER_OF_LOCI_VALUE = '__number_of_loci__'
    const PLOT_DIALOG_NO_COLOR_VALUE = '__none__'

    const buildPlotColumnDropdownMenu = (columnFilter) => buildColumnDropdownMenu(SEARCH_RESULTS_PLOT_COLUMNS.filter(columnFilter))

    const setPlotDialogDropdownMenu = ($dropdown, menuHtml) => {
        const value = $dropdown.dropdown('get value')
        $dropdown.find('.menu').html(menuHtml)
        $dropdown.dropdown('refresh')
        // Keep the selection if the new menu still offers it
