<script>
    /** --------- START of utils for periodicity plots  ---------- */
    const shiftStringBy = (string, shift) => {
        if (shift === 0 || string.length === 0) {
            return string
        }
        if (shift < 0) {
            throw new Error(`shiftStringBy: shift must be non-negative, got ${shift}`)
        }
        const normalizedShift = shift % string.length
        return string.slice(-normalizedShift) + string.slice(0, string.length - normalizedShift)
    }

    const hashString = (string) => {
        let hash = 0
        for (let i = 0; i < string.length; i++) {
            hash = (hash << 5) - hash + string.charCodeAt(i)
            hash |= 0
        }
        return Math.abs(hash)
    }

    const generatePeriodicityMatrix = (sequence, minMotifSize = 1, maxMotifSize = 50) => {
        const clampedMin = Math.max(minMotifSize, 1)
        const clampedMax = Math.min(maxMotifSize, Math.floor(sequence.length / 2))
        const rowCount = Math.max(clampedMax, clampedMin)
        const matrix = Array.from({ length: rowCount }, () => Array(sequence.length).fill(0))

        for (let row = clampedMin - 1; row < clampedMax; row++) {
            const period = row + 1
            // Motifs of different periods have different lengths, so each period gets its own cache, which lets the
            // motifs of the periods already done be freed
            const hashCache = new Map()
            for (let column = 0; column < sequence.length - period; column++) {
                if (sequence[column] !== sequence[column + period]) {
                    continue
                }
                const motif = sequence.slice(column, column + period)
                const shiftedMotif = shiftStringBy(motif, column % period)
                if (hashCache.has(shiftedMotif)) {
                    matrix[row][column] = hashCache.get(shiftedMotif)
                } else {
                    const hash = hashString(shiftedMotif)
                    hashCache.set(shiftedMotif, hash)
                    matrix[row][column] = hash
                }
            }
        }

        return matrix
    }

    const hexToRgb = (hex) => {
        const normalized = hex.replace("#", "")
        const bigint = parseInt(normalized, 16)
        return {
            r: (bigint >> 16) & 255,
            g: (bigint >> 8) & 255,
            b: bigint & 255,
        }
    }

    // Browsers refuse to draw a canvas wider than about 32,000 pixels, so the periodicity plot stays narrower than this.
    // It also stays within MAX_PLOT_CANVAS_AREA_IN_PIXELS (defined in utils_for_dot_plot.html).
    const MAX_PERIODICITY_PLOT_WIDTH_IN_PIXELS = 30000

    // Building the matrix reads a motif as long as the period at each position, so it takes about (sequence length) x
    // (number of periods)^2 / 2 steps. In Chrome on a 2026 laptop, a plot of 1 billion steps takes about 0.6 seconds to
    // build and draw, and older or slower browsers can take several times longer. Larger plots would freeze the page for
    // longer, so they're skipped.
    const MAX_PERIODICITY_MATRIX_COMPUTATION_STEPS = 1000000000

    // Draws the periodicity plot and returns its matrix, or returns null without drawing anything when the sequence is
    // too long to draw within the size limits even at 1 pixel per cell, or to compute within the steps limit above. For
    // long sequences, each cell is drawn with fewer than pixelsPerCell pixels, while the plot keeps its displayed height
    // of pixelsPerCell per period.
    // The period labels and the blue separator lines are page elements placed over the canvas, since the page stretches
    // the canvas to its width, which would squeeze text drawn on it and can drop thin lines. So the canvas must be the
    // only child of a parent element of its own, and fill its width. This makes that parent a positioned box with room on
    // its left for the labels.
    const plotPeriodicityPlot = (canvas, sequence, pixelsPerCell = 2, minRunLength = 3, startWithPeriod=1, endWithPeriod=24) => {
        const overlayContainer = canvas.parentElement
        overlayContainer.querySelectorAll('.periodicity-plot-overlay-element').forEach(element => element.remove())

        const { filteredSequence, separatorPositions } = splitSequenceAtSeparators(sequence)

        const numPeriodsToPlot = Math.min(endWithPeriod, Math.floor(filteredSequence.length / 2))
        const drawnPixelsPerCell = Math.min(
            pixelsPerCell,
            Math.floor(MAX_PERIODICITY_PLOT_WIDTH_IN_PIXELS / filteredSequence.length),
            Math.floor(Math.sqrt(MAX_PLOT_CANVAS_AREA_IN_PIXELS / (numPeriodsToPlot * filteredSequence.length))),
        )
        const numMatrixComputationSteps = filteredSequence.length * numPeriodsToPlot * numPeriodsToPlot / 2
        if (drawnPixelsPerCell < 1 || numMatrixComputationSteps > MAX_PERIODICITY_MATRIX_COMPUTATION_STEPS) {
            console.warn(`Sequence length is ${filteredSequence.length.toLocaleString()}bp, which is too long for a periodicity plot of ${numPeriodsToPlot} periods. Skipping...`)
            return null
        }

        const matrix = generatePeriodicityMatrix(filteredSequence, startWithPeriod, endWithPeriod)


        // zip matrix[2] with the filteredSequence
        //console.log(Array.from(filteredSequence).map((value, index) => `${value}:  ${matrix[2][index]}`).join("\n"))

        filterOutNoiseInPeriodicityMatrix(matrix, minRunLength)

        const rowCount = matrix.length
        const columnCount = matrix[0]?.length || 0
        if (rowCount === 0 || columnCount === 0) {
            return
        }

        const backgroundColor = hexToRgb("#FFFFFF")
        const motifPalette = ['#24f2a5', '#f27124', '#d8f224', '#24f257', '#d824f2', '#247ef2', '#64f224', '#2431f2', '#6424f2', '#f29824', '#f2e524', '#8b24f2', '#f224e5', '#24f27e', '#3ef224', '#f22424', '#24f2cb', '#f22471', '#24f2f2', '#f2be24', '#b124f2', '#24cbf2', '#8bf224', '#b1f224', '#3e24f2', '#f224be', '#24a5f2', '#f24a24', '#2457f2', '#f22498', '#24f231']

        const width = columnCount * drawnPixelsPerCell
        const height = rowCount * drawnPixelsPerCell
        const pixelData = new Uint8ClampedArray(width * height * 4)

        for (let row = 0; row < rowCount; row++) {
            for (let column = 0; column < columnCount; column++) {
                const value = matrix[row][column]
                const paletteIndex = value === 0 ? -1 : value % motifPalette.length
                const color = paletteIndex >= 0 ? hexToRgb(motifPalette[paletteIndex]) : backgroundColor
                fillScaledCellPixels(pixelData, width, row, column, drawnPixelsPerCell, color.r, color.g, color.b)
            }
        }

        canvas.width = width
        canvas.height = height
        const context = canvas.getContext("2d")
        context.putImageData(new ImageData(pixelData, width, height), 0, 0)
        canvas.style.height = `${1 * pixelsPerCell * rowCount}px`

        // The period labels end just left of the leftmost colored cell, so that they sit next to the plotted periodicity
        // instead of across a blank left flank, without covering any colored cell. When a separator line lies at or left
        // of that cell, they end left of the line instead, so they don't cross it.
        // A plot with no colored cell keeps its labels at the left edge.
        const firstColoredColumn = Math.min(...matrix.map(matrixRow => matrixRow.findIndex(value => value > 0)).filter(column => column >= 0))
        let labelsEndColumn = 0
        if (Number.isFinite(firstColoredColumn)) {
            const separatorPositionsAtOrBeforeFirstColoredColumn = separatorPositions.filter(position => position <= firstColoredColumn)
            labelsEndColumn = separatorPositionsAtOrBeforeFirstColoredColumn.length > 0
                ? Math.max(...separatorPositionsAtOrBeforeFirstColoredColumn)
                : firstColoredColumn
        }

        // The labels are sized to the displayed rows. The canvas fills the box right of the room left for labels of up to
        // 3 digits, so a position that is a given fraction of the way across the canvas is that fraction of the box's
        // width minus that room, measured from where the canvas starts.
        const fontSizeInPixels = Math.round(1.1 * pixelsPerCell)
        const labelRoomInPixels = Math.ceil(2.2 * fontSizeInPixels)
        overlayContainer.style.position = 'relative'
        overlayContainer.style.paddingLeft = `${labelRoomInPixels}px`
        const canvasWidth = `(100% - ${labelRoomInPixels}px)`

        for (const position of separatorPositions) {
            const separatorLine = document.createElement('div')
            separatorLine.className = 'periodicity-plot-overlay-element'
            Object.assign(separatorLine.style, {
                position: 'absolute',
                top: '0',
                left: `calc(${labelRoomInPixels}px + ${canvasWidth} * ${position / columnCount})`,
                width: '1.5px',
                height: canvas.style.height,
                backgroundColor: 'rgba(0, 0, 255, 1)',
            })
            overlayContainer.appendChild(separatorLine)
        }

        // Every 3rd period is labeled. A label's right edge, measured from the box's right edge, is the part of the
        // canvas's width right of labelsEndColumn.
        const labelsRightOffset = `calc(${canvasWidth} * ${1 - labelsEndColumn / columnCount})`
        for (let row = 0; row < rowCount; row++) {
            //const isBoundary = row === 0 || row === rowCount - 1
            if ((row + 1) % 3 === 0) {
                const label = document.createElement('div')
                label.className = 'periodicity-plot-overlay-element'
                label.textContent = `${row + 1}`
                Object.assign(label.style, {
                    position: 'absolute',
                    top: `${(row + 0.5) * pixelsPerCell}px`,
                    right: labelsRightOffset,
                    marginRight: `${Math.ceil(fontSizeInPixels / 4)}px`,
                    transform: 'translateY(-50%)',
                    font: `${fontSizeInPixels}px monospace`,
                    lineHeight: '1',
                })
                overlayContainer.appendChild(label)
            }
        }

        return matrix
    }

    const computeBarScores = (matrix) => {
        if (matrix.length === 0 || matrix[0].length === 0) {
            return []
        }
        const width = matrix[0].length
        return matrix.map((row, index) => {
            const matches = row.reduce((count, value) => count + (value > 0 ? 1 : 0), 0)
            const period = index + 1
            const denominator = Math.max(width - period + 1, 1)
            return matches / denominator
        })
    }

    const isNoiseInPeriodicityMatrix = (matrix, i, j, minRunLength = 3) => {
        // check if the horizontal run starting at (i, j) is at least minRunLength of the same value
        let runLength = 1
        const width = matrix[0].length
        const value = matrix[i][j]
        for (let dx = 1; j + dx < width; dx++) {
            if (matrix[i][j + dx] !== value) {
                break
            }

            runLength += 1
            if (runLength >= minRunLength) {
                return false
            }
        }
        for (let dx = 1; j - dx >= 0; dx++) {
            if (matrix[i][j - dx] !== value) {
                break
            }

            runLength += 1
            if (runLength >= minRunLength) {
                return false
            }
        }

        return true
    }

    const filterOutNoiseInPeriodicityMatrix = (matrix, minRunLength = 3) => {
        const matrixRows = matrix.length
        const matrixColumns = matrix[0].length
        for (let i = 0; i < matrixRows; i++) {
            for (let j = 0; j < matrixColumns; j++) {
                if (matrix[i][j] > 0 && isNoiseInPeriodicityMatrix(matrix, i, j, minRunLength)) {
                    matrix[i][j] = 0
                }
            }
        }
    }

    const buildPeriodicityMatrixBarChart = (container, periodicityMatrix) => {
        container.innerHTML = ""
        container.style.display = "flex"
        container.style.alignItems = "flex-end"
        // Centered when the bars fit, and starting at the left edge (instead of overflowing past it) when they don't
        container.style.justifyContent = "safe center"
        container.style.gap = "12px"
        container.style.height = "320px"
        container.style.marginTop = "32px"

        const scores = computeBarScores(periodicityMatrix)
        const maxScore = Math.max(...scores, 0)

        scores.forEach((score, index) => {
            const wrapper = document.createElement("div")
            wrapper.style.display = "flex"
            wrapper.style.flexDirection = "column"
            wrapper.style.alignItems = "center"
            wrapper.style.font = "22px monospace"

            const bar = document.createElement("div")
            const normalized = maxScore === 0 ? 0 : (score / maxScore)
            bar.style.height = `${normalized * 240}px`
            bar.style.width = "20px"
            bar.style.backgroundColor = "#4cc9f0" //"#6366F1" //"#4cc9f0"
            bar.style.borderRadius = "4px 4px 0 0"
            //bar.title = `Period ${index + 1}: ${(score * 100).toFixed(1)}%`

            const label = document.createElement("span")
            label.style.paddingTop = "10px"
            label.textContent = `${index + 1}`

            wrapper.appendChild(bar)
            wrapper.appendChild(label)
            container.appendChild(wrapper)
        })
    }


    /*
    Example:
    <div style="width: 100%; box-sizing: border-box"><canvas id="periodicityMatrixCanvas" style="width: 100%"></canvas></div>
    <div id="barPlotContainer"></div>


    const pixelsPerCell = 10
    const minRunLength = 3

    const periodicityCanvas = document.getElementById("periodicityMatrixCanvas")
    const periodicityMatrix = plotPeriodicityPlot(periodicityCanvas, inputSequence, pixelsPerCell, minRunLength)

    const barPlotContainer = document.getElementById("barPlotContainer")
    if (periodicityMatrix) {
        buildPeriodicityMatrixBarChart(barPlotContainer, periodicityMatrix)
    }
    */

    /** --------- END of utils for periodicity plots  ---------- */
</script>
