<!DOCTYPE html>
<html>
    {% include "header_template.html" %}
<body>
{% include "dialogs_for_all_pages.html" %}
<style>
    .locus-info-label {
        font-weight: bold;
        padding-right: 10px;
        white-space: nowrap;
    }

    .locus-info-table {
        font-size: 1.12em;
        border-collapse: separate;
        border-spacing: 12px 6px;
    }

    .left-col {
        display: flex;
        padding-right: 20px;
        justify-content: flex-end;    /* right-align, so the box sits next to the center line */
    }
    .right-col {
        display: flex;
        padding-left: 20px;
        justify-content: flex-start;    /* left-align, so the box sits next to the center line */
    }
</style>
<div class="ui stackable grid">

    {% include "body_header_template.html" %}

    <div class="ui row" style="padding-bottom: 0;">
        <div class="three wide column"></div>
        <div class="ten wide column">
            <div id="error-message" class="ui negative message" style="display: none">
                <i class="close icon"></i>
                <div class="header">Error</div>
                <p id="error-text"></p>
            </div>
        </div>
        <div class="three wide column"></div>
    </div>

    <div class="ui row" style="padding-bottom: 0;">
        <div class="three wide column"></div>
        <div class="ten wide column">
            <div id="show-igv-divider">
                <span id="show-igv-divider-text">Show IGV.js<i class="chevron down icon"></i></span>
                <span id="hide-igv-divider-text" style="display: none">Hide IGV.js<i class="chevron up icon"></i></span>
            </div>
        </div>
        <div class="three wide column"></div>
    </div>
    <div class="ui row">
        <div class="two wide column"></div>
        <div class="six wide column" style="min-width: 600px !important;">
            <div id="locus-page-row1-box1" class="left-col"></div>
        </div>
        <div class="six wide column">
            <div id="locus-page-row1-box2" class="right-col"></div>
        </div>
        <div class="two wide column"></div>
    </div>
    <div class="ui row">
        <div class="two wide column"></div>
        <div class="six wide column" style="min-width: 600px !important;">
            <div id="locus-page-row2-box1" class="left-col"></div>
        </div>
        <div class="six wide column">
            <div id="locus-page-row2-box2" class="right-col"></div>
        </div>
        <div class="two wide column"></div>
    </div>
    <div class="ui row">
        <div class="three wide column"></div>
        <div class="ten wide column">
            <div id="locus-page-summary-stats"></div>
        </div>
        <div class="three wide column"></div>
    </div>
    <div class="ui row">
        <div class="four wide column"></div>
        <div class="eight wide column" style="display: flex; justify-content: center">
            <div id="locus-page-efficient-motifs"></div>
        </div>
        <div class="four wide column"></div>
    </div>
    <div class="ui row">
        <div class="three wide column"></div>
        <div class="ten wide column">
            <div id="locus-page-polymorphism-data" style="position: relative; z-index: 100;"></div>
        </div>
        <div class="three wide column"></div>
    </div>
    <div class="ui row">
        <div class="three wide column"></div>
        <div class="ten wide column">
            <div id="locus-page-literature-review"></div>
        </div>
        <div class="three wide column"></div>
    </div>
    <div class="ui row">
        <div class="three wide column"></div>
        <div class="ten wide column">
            <div id="locus-page-splicing-and-expression-effects"></div>
        </div>
        <div class="three wide column"></div>
    </div>
    <div class="ui row">
        <div class="three wide column"></div>
        <div class="ten wide column">
            <div id="locus-page-allele-sequences"></div>
        </div>
        <div class="three wide column"></div>
    </div>
</div>
<div style="min-height: 50px;"></div>

<script>
    // Add back link and page title above IGV (outside igv-row so it's always visible)
    $('#igv-row').before(`
        <div class="ui row" style="padding-bottom: 0;">
            <div class="two wide column"></div>
            <div class="twelve wide column" style="padding: 10px 20px 5px 20px; display: flex; align-items: center;">
                <a id="back-to-search-link" href="index.html" style="font-size: 1.1em; white-space: nowrap;">&lt; Back to search page</a>
                <div id="locus-page-title" style="flex: 1; text-align: center; font-size: 1.3em; font-weight: 600;"></div>
                <div style="width: 140px;"></div>
            </div>
            <div class="two wide column"></div>
        </div>
    `)

    $('body').css('cursor', 'wait')

    const REQUIRED_DATA_COLUMNS_FOR_LOCUS_PAGE = [
        "LocusId",
        "ReferenceRegion",
        "chrom_index",
        "start_0based",
        "end_1based",

        "NumRepeatsInReference",
        "ReferenceMotif",
        "CanonicalMotif",

        "ReferenceRepeatPurity",
        "TRsInRegion",
        "Source",
        "FlanksAndLocusMappability",
        "VariationCluster",
        "VariationClusterSizeDiff",
        "VariationClusterFilterReason",

        "GencodeGeneRegion",
        "GencodeGeneName",
        "GencodeGeneId",
        "ManeGeneRegion",
        "ManeGeneName",
        "ManeGeneId",
        "ManeTranscriptId",

        "AlleleFrequenciesFromIllumina174k",
        "AlleleFrequenciesFromT2TAssemblies",

        "HPRC256_AlleleHistogram",
        "HPRC256_BiallelicHistogram",
        "HPRC256_MinAllele",
        "HPRC256_ModeAllele",
        "HPRC256_Stdev",
        "HPRC256_Median",
        "HPRC256_99thPercentile",
        "HPRC256_MaxAllele",
        "HPRC256_UniqueAlleleLengths",
        "HPRC256_NumCalledAlleles",
        "HPRC256_NumIntervalsThatIncludeThisLocusId",
        "HPRC256_NarrowestInterval",
        "HPRC256_AlleleSizeAndPurityDistribution",
        "HPRC256_AlleleSizeAndMethylationDistribution",

        "HPRC256TotalLength_AlleleHistogram",
        "HPRC256TotalLength_BiallelicHistogram",
        "HPRC256TotalLength_MinAllele",
        "HPRC256TotalLength_ModeAllele",
        "HPRC256TotalLength_Stdev",
        "HPRC256TotalLength_Median",
        "HPRC256TotalLength_99thPercentile",
        "HPRC256TotalLength_MaxAllele",
        "HPRC256TotalLength_UniqueAlleleLengths",
        "HPRC256TotalLength_NumCalledAlleles",
        "HPRC256TotalLength_Interval",

        "TenK10K_AlleleHistogram",
        "TenK10K_BiallelicHistogram",
        "TenK10K_MinAllele",
        "TenK10K_ModeAllele",
        "TenK10K_Stdev",
        "TenK10K_Median",
        "TenK10K_99thPercentile",
        "TenK10K_MaxAllele",
        "TenK10K_UniqueAlleleLengths",
        "TenK10K_NumCalledAlleles",

        "AoU1027_MinAllele",
        "AoU1027_ModeAllele",
        "AoU1027_Stdev",
        "AoU1027_Median",
        "AoU1027_99thPercentile",
        "AoU1027_MaxAllele",
        "AoU1027_NumCalledAlleles",
        "AoU1027_OE_LengthPercentile",

        "RepeatMaskerIntervals",

        "VamosMotifFrequencies",

        "ReferenceRepeatSequence",
        "ReferenceLeftFlank",
        "ReferenceRightFlank",

        "Tanudisastro2024_SignificantCellTypes",
        "Tanudisastro2024_Details",

        "Manigbas2024_Details",

        "SpliceAI_DeltaScoreByRepeatCountThatAffectsSplicing",
        "SpliceAI_DeltaScoreByRepeatCount",
        "SpliceAI_AlleleSizesByRepeatCount",
        "ENCODE4_and_IGVF_CRISPR_or_MPRA_validated_elements",
        "Zhang2025_LengthEffectTestResult",
        "Zhang2025_LengthEffectSlope",
        "Zhang2025_LengthEffectFDR",
        "Zhang2025_Details",

        "Garg2019_AutismDMRMethylationChange",
        "Garg2019_AutismDMRDetails",
        "Garg2019_SchizophreniaDMRMethylationChange",
        "Garg2019_SchizophreniaDMRDetails",
        "Garg2020_NumIndividualsWithDMR",
        "Garg2020_DMRDetails",
    ]

    //locus page-specific settings of the DEFAULT_GLOBAL_PAGE_STATE
    DEFAULT_GLOBAL_PAGE_STATE['locusId'] = ''
    // The genotyped interval selected for the HPRC256 charts and allele sequences, or '' for the default (narrowest) one
    DEFAULT_GLOBAL_PAGE_STATE['hprc256_interval'] = ''
    DEFAULT_GLOBAL_PAGE_STATE['hprc256_decomposed_alleles_mode'] = 'boxes'
    // Empty string = default sort order (no column sort, ranked by haplotype count).
    DEFAULT_GLOBAL_PAGE_STATE['hprc256_decomposed_alleles_sort_column'] = ''
    DEFAULT_GLOBAL_PAGE_STATE['hprc256_decomposed_alleles_sort_direction'] = ''
    // The search page's column selection and uploaded panel id, which this page doesn't use. They are kept in the URL so
    // that the 'Back to search page' link reopens the search page with the same columns, and so that the search page can
    // tell when the panel the search used is no longer available.
    DEFAULT_GLOBAL_PAGE_STATE['showColumns'] = null
    DEFAULT_GLOBAL_PAGE_STATE['uploadedFileId'] = 0

    let GLOBAL_PAGE_STATE = JSON.parse(JSON.stringify(DEFAULT_GLOBAL_PAGE_STATE))

    const readAndApplyPersistentPageStateFromUrl = async () => {
        GLOBAL_PAGE_STATE = readPageStateFromUrlHash()
        console.log("Starting to initialize page. GLOBAL_PAGE_STATE:", GLOBAL_PAGE_STATE)

        // A URL without an IGV location (e.g. one with only the locusId) opens IGV at this page's locus rather than at
        // the default one. This has to happen before IGV starts loading below.
        const parsedLocusId = parseAndNormalizeLocusId(GLOBAL_PAGE_STATE['locusId'])
        if (GLOBAL_PAGE_STATE['igvLoc'] === DEFAULT_GLOBAL_PAGE_STATE['igvLoc'] && parsedLocusId) {
            GLOBAL_PAGE_STATE['igvLoc'] = buildIgvLocusStringForLocusId(parsedLocusId)
        }
        // Rewrite the current history entry in the form this page writes (the search page's links order the parameters
        // differently), so that the writes while the page loads find the same hash and add no history entry. Otherwise
        // Back would return to the original URL, whose load would add the entry again.
        writePersistentPageStateToUrl(true)

        // IGV and the locus data load at the same time, so that a slow or failing IGV track doesn't hold up the locus data
        const [igvResult] = await Promise.allSettled([applyIgvPageState(), performSearch()])
        if (igvResult.status === 'rejected') console.error('Failed to load IGV:', igvResult.reason)
    }

    initShowIgvDivider()

    const displayError = (message) => {
        $('#error-text').text(message)
        $('#error-message').show()
    }

    function generatePheWASSection(row) {
        // Check if locus was tested in PheWAS (has Details)
        if (row['Manigbas2024_Details'] === null || row['Manigbas2024_Details'] === undefined) {
            return ''  // Not tested
        }

        // Keyed by trait name
        const details = parseJsonColumn(row, 'Manigbas2024_Details')
        if (!details) return '<div class="ui error message">Error loading PheWAS details</div>'
        const traitNames = Object.keys(details)

        let html = '<h4>PheWAS (Manigbas et al. 2024)</h4>'

        if (traitNames.length === 0) {
            html += `<p><i>This locus was tested in the UK Biobank PheWAS (n=168,554 individuals, 30,291 traits) but showed no significant fine-mapped trait associations.</i></p>`
        } else {
            html += `<p>Fine-mapped causal associations with <b>${traitNames.length}</b> human trait(s):</p>`

            // Full table
            html += `<table class="ui compact striped table">
                <thead><tr>
                    <th>Trait</th><th>Type</th><th>P-value</th><th>-log10(p)</th><th>CAVIAR Prob</th><th>Sample Size</th><th>Replicated (AoU)</th>
                </tr></thead><tbody>`
            html += buildPheWASTableRowsHtml(details, false)
            html += '</tbody></table>'
        }

        html += `<p style="font-size: 0.9em; color: #666;">
            Source: <a href="https://www.nature.com/articles/s41467-024-54678-0" target="_blank">Manigbas et al. 2024</a>
            (UK Biobank PheWAS, n=168,554 individuals, 30,291 traits)
        </p>`

        return html
    }

    function generateTanudisastroSection(row) {
        if (!row['Tanudisastro2024_SignificantCellTypes']) return ''

        const cellTypes = row['Tanudisastro2024_SignificantCellTypes'].split(',')
        const details = parseJsonColumn(row, 'Tanudisastro2024_Details')
        if (!details) return '<div class="ui error message">Error loading sc-eTR details</div>'
        const tanudisastroLocusId = details.Tanudisastro2024_LocusId
        const isFuzzyMatch = tanudisastroLocusId && tanudisastroLocusId !== row['LocusId']

        let html = '<h4>sc-eTRs (Tanudisastro et al. 2024)</h4>'

        if (isFuzzyMatch) {
            html += `<div class="ui warning message" style="padding: 10px;">
                <i class="info circle icon"></i>
                Matched to Tanudisastro et al. locus <code>${tanudisastroLocusId}</code>
                via coordinate overlap (Jaccard >= 0.2).
            </div>`
        }

        html += `<p>Significant expression associations in <b>${cellTypes.length}</b> immune cell type(s):</p>`

        html += `<table class="ui compact striped table">
            <thead><tr>
                <th>Cell Type</th><th>eGene</th><th>P-value</th><th>Effect Size</th><th>Rank / Total</th>
            </tr></thead><tbody>`
        html += buildScEtrTableRowsHtml(cellTypes, details, false)
        html += '</tbody></table>'

        html += '<p style="font-size: 0.9em; color: #666;">Source: <a href="https://www.biorxiv.org/content/10.1101/2024.11.02.621562" target="_blank">Tanudisastro et al. 2024</a></p>'

        return html
    }

    // cohort is 'autism' or 'schizophrenia'
    function generateGarg2019DmrSection(row, cohort) {
        if (!row[GARG_2019_COLUMNS_BY_COHORT[cohort].methylationChange]) return ''
        return `<h4>Rare DMRs in ${cohort} (Garg et al. 2019)</h4><div>${buildGarg2019DmrDetailsHtml(row, cohort)}</div>`
    }

    function generateGarg2020DmrSection(row) {
        if (row['Garg2020_NumIndividualsWithDMR'] == null) return ''
        return `<h4>Rare hypermethylation next to a CG-rich TR (Garg et al. 2020)</h4><div>${buildGarg2020DmrDetailsHtml(row)}</div>`
    }

    // Fills a locus page section with its subsections (HTML strings, '' for those with no data) under a heading, or
    // clears it if none of them have data
    const renderLocusPageSection = (selector, title, subsectionHtmls) => {
        const html = subsectionHtmls.filter(Boolean).join('<div style="margin-top: 30px;"></div>')  // Spacing between subsections
        $(selector).html(html
            ? `<div style="border-top: 1px dashed #ccc; padding: 23px 20px 15px 15px;"><h3>${title}</h3>${html}</div>`
            : '')
    }

    // The sc-eTR, PheWAS and DMR results from the literature for this locus
    function generateLiteratureReviewSubsections(row) {
        return [
            generateTanudisastroSection(row),
            generatePheWASSection(row),
            generateGarg2019DmrSection(row, 'autism'),
            generateGarg2019DmrSection(row, 'schizophrenia'),
            generateGarg2020DmrSection(row),
        ]
    }

    function generateSpliceAISection(row) {
        const deltaScores = parseSpliceAIDeltaScoresByRepeatCount(row['SpliceAI_DeltaScoreByRepeatCountThatAffectsSplicing'])
        if (deltaScores.length === 0) return ''

        const {tableHtml, footnotesHtml} = buildSpliceAIDeltaScoresTableHtml(row)
        let html = '<h4>SpliceAI (simulated alleles)</h4>'
        html += `<div style="margin-bottom: 1em;">${tableHtml}</div>`
        html += `<p style="color: #666;">${SPLICEAI_SIMULATED_ALLELES_EXPLANATION}</p>`
        html += footnotesHtml
        html += `<p style="font-size: 0.9em; color: #666;">
            Scored with the
            <a href="https://spliceailookup.broadinstitute.org" target="_blank">SpliceAI-lookup</a> code (GENCODE v50
            basic transcripts, max distance 10,000 bp, no masking).
        </p>`
        return html
    }

    function generateEncode4MpraSection(row) {
        if (getEncode4MpraCellLines(row).length === 0) return ''
        return `<h4>ENCODE4 MPRA</h4><div>${buildEncode4MpraDetailsHtml(row)}</div>`
    }

    function generateZhang2025MpraSection(row) {
        if (!wasZhang2025MpraLengthEffectTested(row)) return ''
        return `<h4>Zhang 2025 MPRA</h4><div>${buildZhang2025MpraDetailsHtml(row)}</div>`
    }

    // The SpliceAI, Zhang 2025 MPRA and ENCODE4 MPRA results for this locus
    function generateSplicingAndExpressionEffectsSubsections(row) {
        return [generateSpliceAISection(row), generateZhang2025MpraSection(row), generateEncode4MpraSection(row)]
    }

    const displaySearchResults = async () => {

        const row = window.searchResults.rows[0]
        // Loci with no HPRC256 data have no count
        const isInMultipleHprc256Intervals = row['HPRC256_NumIntervalsThatIncludeThisLocusId'] > 1

        // Clear the interval selector state of a locus shown earlier (e.g. before Back), which the interval code below
        // sets again only for a locus genotyped in more than one interval
        window.__HPRC256_INTERVALS = []
        window.__HPRC256_DECOMP_INTERVAL = null
        $(document).off('change.hprc256intervalabove change.hprc256intervaldecomp')
        if (!isInMultipleHprc256Intervals) {
            GLOBAL_PAGE_STATE['hprc256_interval'] = ''
        }

        const getHelpIcon = (columnName) => {
            return TABLE_COLUMNS[columnName]?.helpText ? `<i class="question circle outline icon" style="margin-left:10px" data-html="${escapeHtmlText(TABLE_COLUMNS[columnName].helpText)}"></i>` : ''
        }

        // A row of the tables at the top of the page: the label, the value and the column's help icon
        const buildLocusInfoRowHtml = (label, valueHtml, columnName) =>
            `<tr><td class="locus-info-label">${label}:</td><td>${valueHtml}</td><td>${getHelpIcon(columnName)}</td></tr>`

        // Generate the tables at the top of the page
        let locusPageRow1Box1 = '<table class="locus-info-table">'
        locusPageRow1Box1 += buildLocusInfoRowHtml('Reference Region',
            `${TABLE_COLUMNS['ReferenceRegion'].getValue(row)} &nbsp; &nbsp; (<a id="show-igv-button" class="action-link" title="Show in IGV.js">IGV</a>)`, 'ReferenceRegion')
        locusPageRow1Box1 += buildLocusInfoRowHtml('Reference Motif', TABLE_COLUMNS['ReferenceMotif'].getValue(row, 35), 'ReferenceMotif')
        locusPageRow1Box1 += buildLocusInfoRowHtml('Canonical Motif', TABLE_COLUMNS['CanonicalMotif'].getValue(row, 35), 'CanonicalMotif')
        locusPageRow1Box1 += buildLocusInfoRowHtml('Reference Region Size',
            `${row.end_1based - row.start_0based} bp (${TABLE_COLUMNS['NumRepeatsInReference'].getValue(row)} repeats)`, 'NumRepeatsInReference')
        locusPageRow1Box1 += buildLocusInfoRowHtml('Repeat Purity', TABLE_COLUMNS['ReferenceRepeatPurity'].getValue(row), 'ReferenceRepeatPurity')
        locusPageRow1Box1 += buildLocusInfoRowHtml('Other TRs Nearby',
            row['TRsInRegion'] > 1 ? TABLE_COLUMNS['TRsInRegion'].getValue(row) : 'no', 'TRsInRegion')
        locusPageRow1Box1 += buildLocusInfoRowHtml('Mappability', TABLE_COLUMNS['FlanksAndLocusMappability'].getValue(row), 'FlanksAndLocusMappability')
        locusPageRow1Box1 += buildLocusInfoRowHtml('Variation Cluster', TABLE_COLUMNS['variationCluster'].getValue(row) || 'no', 'variationCluster')
        // The Locus Id row has a smaller font
        locusPageRow1Box1 += `<tr><td class="locus-info-label">Locus Id:</td><td style="font-size:0.9em !important">${showTruncatedSequence(row['LocusId'], 30, false)}</td><td>${getHelpIcon('LocusId')}</td></tr>`
        locusPageRow1Box1 += `<tr><td colspan="3" style="padding-top: 30px"></td></tr>`
        locusPageRow1Box1 += `<tr><td colspan="3" style="position: relative"><div style="position: absolute; top: 0px; left: 0px; z-index: 1000">`
        locusPageRow1Box1 += `<div class="locus-info-label" style="padding-bottom: 10px">Repeat sequence in hg38:</div>`
        locusPageRow1Box1 += `${showTruncatedSequence(row['ReferenceRepeatSequence'], 100, true, false, true)}`
        locusPageRow1Box1 += `</div></td></tr>`
        locusPageRow1Box1 += '</table>'

        $("#locus-page-row1-box1").html(locusPageRow1Box1)

        let locusPageRow1Box2 = '<table class="locus-info-table">'
        locusPageRow1Box2 += [
            ['Gencode Gene', 'GencodeGeneName'], ['Gencode Region', 'GencodeGeneRegion'], ['Gencode Gene Id', 'GencodeGeneId'],
            ['MANE Gene', 'ManeGeneName'], ['MANE Region', 'ManeGeneRegion'], ['MANE Gene Id', 'ManeGeneId'],
            ['MANE Transcript Id', 'ManeTranscriptId'], ['Repeat Masker', 'RepeatMaskerIntervals'], ['Source', 'Source'],
        ].map(([label, columnName]) => buildLocusInfoRowHtml(label, TABLE_COLUMNS[columnName].getValue(row) || '', columnName)).join('')
        locusPageRow1Box2 += '</table> <br />'

        $("#locus-page-row1-box2").html(locusPageRow1Box2)

        let locusPageRow2Box1 = `<div style="padding: 40px 12px 0px 12px">`
        locusPageRow2Box1 += `<div class="locus-info-label info-font-size" style="padding-bottom: 10px">Left flank:</div>${showTruncatedSequence(row['ReferenceLeftFlank'], 58, true, true, true)}`
        locusPageRow2Box1 += `</div>`
        $("#locus-page-row2-box1").html(locusPageRow2Box1)

        let locusPageRow2Box2 = `<div style="padding: 40px 12px 0px 12px">`
        locusPageRow2Box2 += `<div class="locus-info-label info-font-size" style="padding-bottom: 10px">Right flank:</div>${showTruncatedSequence(row['ReferenceRightFlank'], 58, true, false, true)}`
        locusPageRow2Box2 += `</div>`
        $("#locus-page-row2-box2").html(locusPageRow2Box2)


        // Generate summary stats table (above motif variability). Skip the
        // per-(LocusId, Interval) fetch when the catalog row says only one
        // interval contains this LocusId — the catalog row's HPRC256_* columns
        // already are the complete (and only) interval's stats. Loci with no
        // HPRC256 data skip it too. For loci that
        // appear in 2+ intervals, await the fetch so the table renders correctly
        // on first paint instead of flashing the single-row catalog version.
        let hprc256IntervalRows = []
        if (isInMultipleHprc256Intervals) {
            // Multi-interval locus: show a loader while the per-interval stats fetch runs.
            $('#locus-page-summary-stats').html('<div class="loading-indicator" style="padding:12px 15px;"><div class="ui small active inline loader"></div><span>Loading summary statistics&hellip;</span></div>')
            hprc256IntervalRows = await fetchAllHprc256IntervalRows(row['LocusId'])
        }
        $('#locus-page-summary-stats').html(
            generateSummaryStatsTable(row, hprc256IntervalRows)
        )

        // Generate motif variability section
        const motifFrequencyTableRows = computeMotifFrequenciesTableRows(row['VamosMotifFrequencies'])
        let motifFrequencyTableHtml
        if (motifFrequencyTableRows.length > 1) {
            motifFrequencyTableHtml = computeMotifFrequenciesTableHtml(motifFrequencyTableRows, true)
            motifFrequencyTableHtml = `<div style="border-top: 1px dashed #ccc; padding: 23px 20px 15px 15px;">${motifFrequencyTableHtml}</div>`
        } else {
            motifFrequencyTableHtml = ''
        }
        $('#locus-page-efficient-motifs').html(motifFrequencyTableHtml)

        // Generate allele frequency charts section (hide sigma summary since we show the table above). The charts of an
        // earlier render (e.g. before Back) are destroyed first, since replacing their canvases doesn't free them.
        $('#locus-page-polymorphism-data canvas').each(function() { destroyExistingChart(this) })
        $('#locus-page-polymorphism-data').html(generatePolymorphismDialogContent(row, { showSigmaSummary: false }))

        renderChartsInPolymorphismDialog(row);

        renderLocusPageSection('#locus-page-literature-review', 'Literature Review', generateLiteratureReviewSubsections(row))
        renderLocusPageSection('#locus-page-splicing-and-expression-effects', 'Splicing and Expression Effects',
            generateSplicingAndExpressionEffectsSubsections(row))

        // Lazy-fetch the list of TRGT intervals that genotyped this LocusId, then
        // wire the interval selector. The selector drives all five HPRC256 panels:
        // the four stratified charts (allele histogram, biallelic histogram, purity,
        // methylation) plus the decomposed-alleles section. The total allele length
        // charts have one interval per locus, so they get no selector and ignore it.
        // On change, the four chart panels re-render via handleHprc256DropdownChange, which honors the
        // current GLOBAL_PAGE_STATE['hprc256_interval'] and falls back to the
        // catalog row's HPRC256_* columns only at the narrowest (default) interval.
        // The leading semicolon keeps the line above from being read as a call on this function.
        ;(async () => {
            const locusId = row['LocusId']
            // Show the allele-sequences loader immediately so the section reads
            // "Loading…" continuously through the interval-list fetch and the
            // subsequent decomposed-alleles fetch (both hit BigQuery).
            $('#locus-page-allele-sequences').html(alleleSequencesLoadingHtml())
            // Skip the dropdown query entirely when the catalog row says only one
            // interval exists — saves a BigQuery hit on the typical locus page.
            // The catalog row's HPRC256_NarrowestInterval column carries the only
            // interval, so the decomposed-alleles fetch can still target it.
            // Loci with no HPRC256 data skip the query too.
            const intervals = isInMultipleHprc256Intervals ? await fetchHprc256Intervals(row['chrom_index'], locusId) : []
            // Defensive cross-check: HPRC256_NumIntervalsThatIncludeThisLocusId
            // is computed from the LPS stratified TSV, while fetchHprc256Intervals
            // reads the decomposed-alleles table. The two sources should agree on
            // the per-locus interval count; if they disagree, the BigQuery tables
            // were likely loaded from different VCFs (or one is stale). Warn but
            // continue using whichever source gave us interval rows.
            const intervalCount = row['HPRC256_NumIntervalsThatIncludeThisLocusId']
            if (isInMultipleHprc256Intervals && intervalCount !== intervals.length) {
                console.warn(
                    `HPRC256 interval count mismatch for ${locusId}: ` +
                    `catalog says ${intervalCount}, decompose table returned ${intervals.length}`
                )
            }
            if (!intervals.length) {
                fetchAndRenderDecomposedAlleles(row['chrom_index'], locusId, row['HPRC256_NarrowestInterval'] || null)
                return
            }
            // intervals are sorted narrowest-first by the query.
            const defaultInterval = intervals[0]['interval']
            row.__hprc256DefaultInterval = defaultInterval
            // Restore the interval selected earlier from the URL, if this locus has it. The default (narrowest) interval
            // is stored as '', so that it isn't written to the URL.
            const selectedInterval = intervals.some(iv => iv['interval'] === GLOBAL_PAGE_STATE['hprc256_interval'])
                ? GLOBAL_PAGE_STATE['hprc256_interval']
                : defaultInterval
            GLOBAL_PAGE_STATE['hprc256_interval'] = selectedInterval === defaultInterval ? '' : selectedInterval
            // Decomp section tracks its own interval. Initialized to the same
            // selection; thereafter "above" -> decomp propagates, decomp -> above
            // does not (see split change handlers below).
            window.__HPRC256_DECOMP_INTERVAL = selectedInterval

            const refreshAllPanels = (newInterval) => {
                GLOBAL_PAGE_STATE['hprc256_interval'] = newInterval === defaultInterval ? '' : newInterval
                // Re-render each of the 4 HPRC256 stratified panels with the new
                // interval. handleHprc256DropdownChange reads GLOBAL_PAGE_STATE so
                // we only need to fire it once per .hprc256-stratum-controls block.
                $('.hprc256-stratum-controls').each(function () {
                    if (chartFollowsHprc256IntervalSelector(this.dataset.chartKind)) {
                        handleHprc256DropdownChange(this, row)
                    }
                })
                fetchAndRenderDecomposedAlleles(row['chrom_index'], locusId, newInterval)
            }

            // The interval selector is rendered next to "Sequence display:" (above
            // the allele table) and copied into each Population/Sex row.
            // Expose the intervals list so other render paths
            // (renderSequenceModeSelector, stratum-controls DOM injection) can
            // render the selector without having to await this fetch themselves.
            window.__HPRC256_INTERVALS = intervals

            if (intervals.length > 1) {
                // Inject a bold-label copy of the interval selector into every
                // Population/Sex row already rendered in the polymorphism
                // section. These copies drive the histograms/plots above AND
                // (via downward propagation) the decomp-section selector.
                const intervalOptions = renderHprc256IntervalOptions(selectedInterval)
                $('.hprc256-stratum-controls').each(function() {
                    if ($(this).find('.hprc256-interval-select').length) return
                    if (!chartFollowsHprc256IntervalSelector(this.dataset.chartKind)) return
                    const html = `<label style="display: inline-flex; align-items: center;"><b>Genotyped interval:</b>&nbsp;&nbsp;<select class="hprc256-interval-select hprc256-interval-select-above">${intervalOptions}</select></label>`
                    const emptyNote = $(this).find('.hprc256-stratum-empty-note')
                    if (emptyNote.length) {
                        emptyNote.before(html)
                    } else {
                        $(this).append(html)
                    }
                })

                // "Above" selectors (in Population/Sex rows): propagate to all
                // other "above" copies AND down to the decomp selector, then
                // refresh both the chart panels and the decomp section.
                $(document).off('change.hprc256intervalabove', '.hprc256-interval-select-above')
                    .on('change.hprc256intervalabove', '.hprc256-interval-select-above', function() {
                        const newValue = this.value
                        $('.hprc256-interval-select-above').not(this).val(newValue)
                        window.__HPRC256_DECOMP_INTERVAL = newValue
                        refreshAllPanels(newValue)
                    })

                // Decomp selector: change only the decomp section. Do NOT
                // touch GLOBAL_PAGE_STATE['hprc256_interval'], the "above"
                // selectors, or any charts.
                $(document).off('change.hprc256intervaldecomp', '.hprc256-interval-select-decomp')
                    .on('change.hprc256intervaldecomp', '.hprc256-interval-select-decomp', function() {
                        const newValue = this.value
                        window.__HPRC256_DECOMP_INTERVAL = newValue
                        fetchAndRenderDecomposedAlleles(row['chrom_index'], locusId, newValue)
                    })
            }
            if (selectedInterval === defaultInterval) {
                // The four stratified panels are already rendered from the catalog
                // row, which describes the default (narrowest) interval, so only
                // the decomposed alleles need fetching.
                fetchAndRenderDecomposedAlleles(row['chrom_index'], locusId, defaultInterval)
            } else {
                // Re-render the panels for the interval restored from the URL; this
                // also fetches its decomposed alleles.
                refreshAllPanels(selectedInterval)
            }
        })()

        $('.question').popup({ on: 'click' })
        initShowPopupsWithNestedHelpIcons()
        initGeneInfoLinks()

        // Attach handler to both the (IGV) link and the Reference Region link
        const showIgvAndNavigate = () => showIgvAt(
            buildIgvLocusStringForLocusId(parseAndNormalizeLocusId(window.searchResults.rows[0]['LocusId'])))
        $('#show-igv-button').click(showIgvAndNavigate)
        $('.row-igv-button').click(showIgvAndNavigate)
    }

    const performSearch = async () => {
        // Remove any error messages and no results message
        $('#error-message').hide()

        try {
            $('body').css('cursor', 'wait')

            let locusId = GLOBAL_PAGE_STATE['locusId']
            if (!locusId) {
                displayError('Missing locusId URL parameter (eg. #locusId=4-3074876-3074933-CAG)')
                return
            }

            const parsedLocusId = parseAndNormalizeLocusId(locusId)
            if (!parsedLocusId) {
                displayError(`Invalid locusId format: ${locusId}. Expected format: chrom-start-end-motif (eg. 4-3074876-3074933-CAG)`)
                return
            }
            const { chrom, start_0based, end_1based, motif } = parsedLocusId
            locusId = parsedLocusId.locusId
            if (CHROM_TO_CHROM_INDEX[chrom] === undefined) {
                displayError(`Unknown chromosome in locusId: ${locusId}`)
                return
            }

            // Set page titles immediately (before waiting for search results)
            const referenceRegion = `chr${chrom}:${start_0based}-${end_1based}`
            const truncatedMotif = motif.length > 35 ? motif.substring(0, 35) + '...' : motif
            document.title = `TRExplorer: ${locusId}`
            $('#locus-page-title').text(`Locus Page: ${referenceRegion} ${truncatedMotif}`)

            const whereClause = `WHERE ${buildSqlConditionForLocusId(parsedLocusId)}`
            const query = `SELECT ${REQUIRED_DATA_COLUMNS_FOR_LOCUS_PAGE.join(', ')} FROM ${COMPLETE_TABLE_ID} ${whereClause}`

            window.searchResults = await queryBigQuery(query, 0, 1, null, null)

            console.log("Search results:", window.searchResults)

            if (!window.searchResults.rows || window.searchResults.rows.length === 0) {
                console.error("ERROR: row not found", whereClause)
                displayError(`Locus not found: ${locusId}`)
                return
            }

            await displaySearchResults()

        } catch (error) {
            console.error('Error performing search:', error)
            displayError('Error performing search: ' + error.message)
        } finally {
            $('body').css('cursor', 'default')
        }
    }

    initHeaderDialogLinks()

    // The back link carries the URL parameters as they are when it's clicked, including changes made on this page
    $('#back-to-search-link').on('click', function() {
        this.href = `index.html?#${window.location.hash.substring(1)}`
    })

    // handle browser forward & back buttons
    window.addEventListener('popstate', readAndApplyPersistentPageStateFromUrl)



    $(document).ready(async () => {

        await readAndApplyPersistentPageStateFromUrl()

        console.log("Done initializing page. GLOBAL_PAGE_STATE:", GLOBAL_PAGE_STATE)
        $('body').css('cursor', 'default')
    })

</script>

</body>
